<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>萌社 - 个人中心 (紧凑版)</title>
    <style id="theme-vars">
/* Moe Social Brand Design System — 萌系梦幻柔和 */

:root {
  --color-primary: #7F7FD5;
  --color-primary-light: #9B9FE3;
  --color-primary-lighter: #B7BAF0;
  --color-primary-lightest: #D4D5F6;
  --color-primary-dark: #5F5FBB;
  --color-primary-darker: #3F3FA1;

  --color-secondary: #86A8E7;
  --color-secondary-light: #A0BFEF;
  --color-secondary-lighter: #BBD5F6;
  --color-secondary-darker: #5E88C8;

  --color-tertiary: #91EAE4;
  --color-tertiary-light: #ADF0EC;
  --color-tertiary-lighter: #C8F5F2;
  --color-tertiary-darker: #6DD5CF;

  --color-bg: #F5F7FA;
  --color-bg-elevated: #FFFFFF;
  --color-bg-sunken: #EEEEF2;

  --color-text-primary: #333333;
  --color-text-secondary: #666666;
  --color-text-hint: #9E9E9E;
  --color-text-disabled: #BDBDBD;
  --color-text-inverse: #FFFFFF;

  --state-success: #00A86B;
  --state-warning: #E6A700;
  --state-error: #E94057;
  --state-info: #2563EB;

  --gradient-primary: linear-gradient(135deg, #7F7FD5 0%, #86A8E7 100%);
  --gradient-hero: linear-gradient(135deg, #7F7FD5 0%, #86A8E7 50%, #91EAE4 100%);
  --gradient-aurora: linear-gradient(135deg, #E0C3FC 0%, #8EC5FC 50%, #91EAE4 100%);

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-full: 9999px;
  --radius-button: 25px;
  --radius-input: 15px;

  --shadow-card: 0 8px 16px rgba(127, 127, 213, 0.08);
  --shadow-card-lg: 0 10px 24px rgba(127, 127, 213, 0.08);
  --shadow-float: 0 20px 40px rgba(127, 127, 213, 0.12);
  --shadow-button: 0 4px 12px rgba(127, 127, 213, 0.4);
  --shadow-bottom-bar: 0 -5px 20px rgba(0, 0, 0, 0.05), 0 4px 12px rgba(127, 127, 213, 0.1);
  --shadow-compact: 0 5px 10px rgba(127, 127, 213, 0.08);

  --font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --text-display: 700 28px/1.2 var(--font-family);
  --text-title: 700 22px/1.3 var(--font-family);
  --text-subtitle: 600 18px/1.4 var(--font-family);
  --text-body: 400 15px/1.6 var(--font-family);
  --text-body-sm: 400 14px/1.5 var(--font-family);
  --text-caption: 400 12px/1.35 var(--font-family);

  --duration-fast: 200ms;
  --duration-normal: 300ms;
  --ease-bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
  --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1);

  --bottom-bar-radius: 32px;
  --bottom-bar-padding: 8px 20px;
  --card-padding: 20px;
  --section-gap: 12px;
  --page-padding: 16px;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-secondary: var(--color-secondary);
  }
  @layer base {
    body { background: var(--color-bg); color: var(--color-text-primary); }
  }
    </style>
</head>
<body>

<main data-node-id="page-profile-compact">

  <!-- ====== Compact Header ~220px ====== -->
  <div class="cp-header">

    <!-- Gradient background -->
    <div class="cp-header__bg"></div>
    <div class="cp-header__overlay"></div>

    <!-- Top bar: title left, actions right -->
    <div class="cp-header__topbar">
      <span class="cp-header__title">我的</span>
      <div class="cp-header__actions">
        <button class="cp-header__btn" aria-label="设置">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
        <button class="cp-header__btn" aria-label="编辑资料">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Centered avatar + name/bio row + stats -->
    <div class="cp-header__content">
      <div class="cp-header__avatar-area">
        <div class="cp-header__avatar-glow"></div>
        <div class="cp-header__avatar-ring">
          <div class="cp-header__avatar" style="background: var(--gradient-aurora);">萌</div>
        </div>
      </div>

      <!-- Username + bio on one line -->
      <div class="cp-header__name-row">
        <span class="cp-header__username">萌萌酱</span>
        <span class="cp-header__bio">一只爱画画的猫咪~</span>
      </div>

      <!-- Stats pill (glass morphism) -->
      <div class="cp-header__stats-pill">
        <div class="cp-header__stat">
          <span class="cp-header__stat-val">128</span>
          <span class="cp-header__stat-lbl">动态</span>
        </div>
        <div class="cp-header__stat-sep"></div>
        <div class="cp-header__stat">
          <span class="cp-header__stat-val">256</span>
          <span class="cp-header__stat-lbl">关注</span>
        </div>
        <div class="cp-header__stat-sep"></div>
        <div class="cp-header__stat">
          <span class="cp-header__stat-val">1.2K</span>
          <span class="cp-header__stat-lbl">粉丝</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ====== Quick Actions — compact horizontal circles ====== -->
  <div class="cp-quick-actions">
    <div class="cp-qa-btn">
      <div class="cp-qa-circle" style="background: rgba(90, 103, 216, 0.14);">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="#5A67D8">
          <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7v-5z"/>
        </svg>
      </div>
      <span class="cp-qa-label">签到</span>
    </div>
    <div class="cp-qa-btn">
      <div class="cp-qa-circle" style="background: rgba(38, 166, 154, 0.14);">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="#26A69A">
          <path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.1 0-2-.9-2-2V5c0-1.1.9-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>

        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="#FFB347">

      <span class="cp-qa-label">会员</span>

    <div class="cp-qa-btn">
      <div class="cp-qa-circle" style="background: rgba(127, 127, 213, 0.14);">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="#7F7FD5">
          <path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94.63 1.5 1.98 2.63 3.61 2.96V19H7v2h10v-2h-4v-3.1c1.63-.33 2.98-1.46 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z"/>
        </svg>
      </div>
      <span class="cp-qa-label">成就</span>
    </div>
  </div>

      <div class="cp-menu-section__bar"></div>

    <div class="cp-menu-card">

      <div class="cp-menu-row__divider"></div>

      <!-- 兴趣社区 -->
      <a href="#community" class="cp-menu-row">
        <div class="cp-menu-row__icon" style="background: rgba(91, 141, 239, 0.12);">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="#5B8DEF">
            <path d="M21 6h-2v9H6v2c0 .55.45 1 1 1h11l4 4V7c0-.55-.45-1-1-1zm-4 6V3c0-.55-.45-1-1-1H3c-.55 0-1 .45-1 1v14l4-4h10c.55 0 1-.45 1-1z"/>
          </svg>

        <span class="cp-menu-row__title">兴趣社区</span>

      </a>

      <div class="cp-menu-row__divider"></div>

      <div class="cp-menu-row__divider"></div>

      <!-- 云端图库 -->
      <a href="#cloud-gallery" class="cp-menu-row">

            <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>

        <span class="cp-menu-row__title" style="color: #E94057;">退出登录</span>
        <svg class="cp-menu-row__chevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#CCC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>

  <!-- Bottom safe-area spacer -->

  <nav class="cp-bottom-bar" style="position: fixed; bottom: 16px; left: 16px; right: 16px; z-index: 1000; display: flex; align-items: center; justify-content: space-around;" data-active-tab="profile" aria-label="Main navigation">

    <!-- 首页 (Home) -->
    <a href="#home" class="cp-tab" data-tab="home" data-dom-id="nav-home" aria-label="首页">

      <svg class="cp-tab__icon cp-tab__icon--filled" data-tab-icon="home" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" style="display: none;">

        <path d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z" fill="currentColor"/>

<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font: var(--text-body);
  background: var(--color-bg);
  color: var(--color-text-primary);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  min-height: 100vh;
}
a { text-decoration: none; color: inherit; }
button { border: none; background: none; cursor: pointer; font: inherit; color: inherit; }
main { padding-bottom: 88px; }

/* ===== Compact Header ~220px ===== */
.cp-header {
  position: relative;
  height: 220px;
  overflow: hidden;
}
.cp-header__bg {
  position: absolute;
  inset: 0;
  background: var(--gradient-hero);
}
.cp-header__overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.12) 100%);
}
.cp-header__topbar {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 16px;
  padding-top: env(safe-area-inset-top, 48px);
}
.cp-header__title {
  font: 700 18px/1.2 var(--font-family);
  color: #FFFFFF;
}
.cp-header__actions {
  display: flex;
  gap: 0;
}
.cp-header__btn {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #FFFFFF;
  border-radius: 50%;
  transition: background var(--duration-fast);
}
.cp-header__btn:active {
  background: rgba(255,255,255,0.15);
}

/* Header content */
.cp-header__content {
  position: relative;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 20px 16px;
}

/* Avatar — 60px, overlapping bottom of gradient */
.cp-header__avatar-area {
  position: relative;
  margin-top: -14px;
  margin-bottom: 8px;
}
.cp-header__avatar-glow {
  position: absolute;
  inset: -5px;
  border-radius: 50%;
  background: var(--color-primary);
  opacity: 0.35;
  filter: blur(14px);
}
.cp-header__avatar-ring {
  position: relative;
  width: 68px;
  height: 68px;
  border-radius: 50%;
  background: #FFFFFF;
  padding: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 12px rgba(127, 127, 213, 0.2);
}
.cp-header__avatar {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  font-weight: 600;
  color: var(--color-text-inverse);
}

/* Name + bio on one horizontal line */
.cp-header__name-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.cp-header__username {
  font-size: 20px;
  font-weight: 800;
  color: #FFFFFF;
  letter-spacing: 0.3px;
  white-space: nowrap;
}
.cp-header__bio {
  font-size: 13px;
  color: rgba(255, 255, 255, 0.7);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 160px;
}

/* Stats pill — glass morphism */
.cp-header__stats-pill {
  display: inline-flex;
  align-items: center;
  border-radius: 9999px;
  background: rgba(255, 255, 255, 0.26);
  border: 1px solid rgba(255, 255, 255, 0.42);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  padding: 6px 16px;
  box-shadow: 0 4px 12px rgba(127, 127, 213, 0.1);
  animation: fadeInUp var(--duration-normal) var(--ease-out-back) both;
}
.cp-header__stat {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 10px;
}
.cp-header__stat-val {
  font-size: 15px;
  font-weight: 800;
  color: #1E1E2E;
  line-height: 1;
}
.cp-header__stat-lbl {
  font-size: 11px;
  font-weight: 600;
  color: rgba(30, 30, 46, 0.52);
}
.cp-header__stat-sep {
  width: 1px;
  height: 20px;
  background: rgba(255, 255, 255, 0.35);
}

/* ===== Quick Actions — compact horizontal circles ===== */
.cp-quick-actions {
  display: flex;
  justify-content: space-around;
  align-items: center;
  background: var(--color-bg-elevated);
  border-radius: 24px;
  margin: -12px 16px 12px;
  padding: 12px 8px 8px;
  box-shadow: var(--shadow-card);
  position: relative;
  z-index: 10;
  animation: fadeInUp var(--duration-normal) var(--ease-out-back) 80ms both;
}
.cp-qa-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  transition: transform var(--duration-fast) var(--ease-bounce);
}
.cp-qa-btn:active {
  transform: scale(0.92);
}
.cp-qa-circle {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: box-shadow var(--duration-fast);
}
.cp-qa-circle:active {
  box-shadow: 0 2px 8px rgba(127, 127, 213, 0.25);
}
.cp-qa-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--color-text-primary);
  white-space: nowrap;
}

/* ===== Menu Sections ===== */
.cp-menu-section {
  padding: 0 16px;
  margin-bottom: 12px;
  animation: fadeInUp var(--duration-normal) var(--ease-out-back) 160ms both;
}
.cp-menu-section__title {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
  padding-left: 4px;
}
.cp-menu-section__bar {
  width: 4px;
  height: 16px;
  border-radius: 2px;
  background: var(--color-primary);
  flex-shrink: 0;
}
.cp-menu-section__title span {
  font-size: 15px;
  font-weight: 800;
  color: #2D2D3D;
  letter-spacing: 0.2px;
}
.cp-menu-card {
  background: #FFFFFF;
  border-radius: 24px;
  box-shadow: 0 6px 16px rgba(127, 127, 213, 0.07);
  overflow: hidden;
}

/* Compact menu rows — 48px height */
.cp-menu-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 16px;
  height: 48px;
  cursor: pointer;
  transition: background var(--duration-fast);
}
.cp-menu-row:active {
  background: var(--color-bg, #F5F7FA);
}
.cp-menu-row__icon {
  width: 28px;
  height: 28px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.cp-menu-row__title {
  flex: 1;
  font-size: 14px;
  font-weight: 600;
  color: #333333;
  white-space: nowrap;
}
.cp-menu-row__chevron {
  flex-shrink: 0;
  opacity: 0.5;
}
.cp-menu-row__divider {
  margin-left: 56px;
  margin-right: 16px;
  height: 1px;
  background: rgba(0, 0, 0, 0.06);
}

/* ===== Bottom Bar ===== */
.cp-bottom-bar {
  background: var(--color-bg-elevated);
  border-radius: var(--bottom-bar-radius);
  box-shadow: var(--shadow-bottom-bar);
  padding: var(--bottom-bar-padding);
}
.cp-tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 56px;
  height: 48px;
  text-decoration: none;
  color: var(--color-text-hint, #9E9E9E);
  transition: color var(--duration-fast) var(--ease-smooth);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.cp-tab__label {
  font-size: 10px;
  line-height: 1;
  margin-top: 3px;
  font-weight: 400;
  font-family: var(--font-family);
  transition: font-weight var(--duration-fast) var(--ease-smooth);
}
.cp-tab__icon {
  width: 24px;
  height: 24px;
  flex-shrink: 0;
}
.cp-tab .cp-tab__icon--outline { display: block; }
.cp-tab .cp-tab__icon--filled { display: none; }

/* Active tab state via data-active-tab */
nav[data-active-tab="home"]    .cp-tab[data-tab="home"],
nav[data-active-tab="messages"] .cp-tab[data-tab="messages"],
nav[data-active-tab="ai"]       .cp-tab[data-tab="ai"],
nav[data-active-tab="profile"] .cp-tab[data-tab="profile"] {
  color: var(--color-primary, #7F7FD5);
}
nav[data-active-tab="home"]    .cp-tab[data-tab="home"] .cp-tab__label,
nav[data-active-tab="messages"] .cp-tab[data-tab="messages"] .cp-tab__label,
nav[data-active-tab="ai"]       .cp-tab[data-tab="ai"] .cp-tab__label,
nav[data-active-tab="profile"] .cp-tab[data-tab="profile"] .cp-tab__label {
  font-weight: 500;
}
nav[data-active-tab="home"]    .cp-tab[data-tab="home"] .cp-tab__icon--outline,
nav[data-active-tab="messages"] .cp-tab[data-tab="messages"] .cp-tab__icon--outline,
nav[data-active-tab="ai"]       .cp-tab[data-tab="ai"] .cp-tab__icon--outline,
nav[data-active-tab="profile"] .cp-tab[data-tab="profile"] .cp-tab__icon--outline {
  display: none;
}
nav[data-active-tab="home"]    .cp-tab[data-tab="home"] .cp-tab__icon--filled,
nav[data-active-tab="messages"] .cp-tab[data-tab="messages"] .cp-tab__icon--filled,
nav[data-active-tab="ai"]       .cp-tab[data-tab="ai"] .cp-tab__icon--filled,
nav[data-active-tab="profile"] .cp-tab[data-tab="profile"] .cp-tab__icon--filled {
  display: block;
}

/* Entry animation */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</body>
</html>
