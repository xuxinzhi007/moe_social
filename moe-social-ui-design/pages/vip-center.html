<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled</title>
    <style id="theme-vars">
/* ============================================
   Moe Social Design System - Brand CSS
   Extracted from Flutter MoeTokens & MoeTheme
   ============================================ */

:root {
  /* === Brand Colors === */
  --color-primary: #7F7FD5;
  --color-primary-hover: #6E6EC4;
  --color-secondary: #86A8E7;
  --color-accent: #91EAE4;
  --color-pastel-orange: #FFB347;
  --color-like-red: #FF4757;

  /* VIP Gold */
  --color-vip-gold: #FFD66B;
  --color-vip-gold-dark: #FFA94D;

  /* Gacha Pink */
  --color-gacha-pink: #FFB7C5;
  --color-gacha-pink-dark: #FFA5B5;

  /* === Surface Colors === */
  --color-page-bg: #F5F7FA;
  --color-card-bg: #FFFFFF;
  --color-input-bg: #FFFFFF;
  --color-input-fill: #F9F9F9;
  --color-search-bg: #F5F5F5;

  /* === Text Colors === */
  --color-title: #333333;
  --color-body: #212121;
  --color-body-secondary: rgba(0,0,0,0.6);
  --color-hint: #9E9E9E;
  --color-placeholder: #BDBDBD;

  /* === Status Colors === */
  --color-online: #34C759;
  --color-error: #FF4757;
  --color-success: #34C759;

  /* === Gradients === */
  --gradient-primary: linear-gradient(135deg, #7F7FD5 0%, #86A8E7 100%);
  --gradient-hero: linear-gradient(135deg, #7F7FD5 0%, #86A8E7 50%, #91EAE4 100%);
  --gradient-personalized: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
  --gradient-vip: linear-gradient(135deg, #FFD66B 0%, #FFA94D 100%);
  --gradient-gacha: linear-gradient(135deg, #FFB7C5 0%, #FFA5B5 100%);

  /* === Typography === */
  --font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-family-serif: 'Georgia', 'Noto Serif SC', serif;

  --text-xs: 10px;
  --text-sm: 11px;
  --text-base: 13px;
  --text-md: 15px;
  --text-lg: 16px;
  --text-xl: 18px;
  --text-2xl: 20px;
  --text-3xl: 24px;
  --text-4xl: 26px;
  --text-5xl: 28px;

  --leading-tight: 1.1;
  --leading-snug: 1.3;
  --leading-normal: 1.5;
  --leading-relaxed: 1.6;

  --weight-normal: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;
  --weight-extrabold: 800;
  --weight-black: 900;

  /* === Spacing === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;

  /* === Border Radius === */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-pill: 9999px;

  /* === Shadows === */
  --shadow-card: 0 8px 24px rgba(127,127,213,0.08);
  --shadow-card-hover: 0 12px 32px rgba(127,127,213,0.12);
  --shadow-button: 0 4px 16px rgba(127,127,213,0.3);
  --shadow-float: 0 8px 32px rgba(0,0,0,0.12);
  --shadow-nav: 0 -2px 16px rgba(0,0,0,0.05);
  --shadow-glow-primary: 0 0 20px rgba(127,127,213,0.25);

  /* === Motion === */
  --duration-fast: 150ms;
  --duration-normal: 300ms;
  --duration-slow: 600ms;
  --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-elastic: cubic-bezier(0.68, -0.55, 0.265, 1.55);

  /* === Avatar Ring Colors === */
  --ring-purple: linear-gradient(135deg, #7F7FD5, #f093fb);
  --ring-red-orange: linear-gradient(135deg, #FF6B6B, #FFB347);
  --ring-teal: linear-gradient(135deg, #4ECDC4, #44A08D);
  --ring-blue-purple: linear-gradient(135deg, #86A8E7, #7F7FD5);
  --ring-yellow: linear-gradient(135deg, #FFCA28, #FF8F00);
  --ring-deep-purple: linear-gradient(135deg, #AB47BC, #7B1FA2);
}

/* Dark mode overrides */
html.dark {
  --color-page-bg: #121212;
  --color-card-bg: #1E1E1E;
  --color-input-bg: #2C2C2C;
  --color-input-fill: #252525;
  --color-search-bg: #2C2C2C;
  --color-title: #E0E0E0;
  --color-body: #EEEEEE;
  --color-body-secondary: rgba(255,255,255,0.7);
  --color-hint: #757575;
  --color-placeholder: #616161;
  --shadow-card: 0 8px 24px rgba(0,0,0,0.24);
  --shadow-card-hover: 0 12px 32px rgba(0,0,0,0.32);
  --shadow-nav: 0 -2px 16px rgba(0,0,0,0.2);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-secondary: var(--color-secondary);
    --color-accent: var(--color-accent);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="relative min-h-screen" style="background: var(--color-page-bg); font-family: var(--font-family);">

        <!-- 顶部渐变背景 -->
        <div class="relative" style="height: 300px; background: var(--gradient-primary); border-radius: 0 0 30px 30px; overflow: hidden;">
            <!-- 装饰圆 -->
            <div class="absolute -top-10 -right-10 h-40 w-40 rounded-full" style="background: rgba(255,255,255,0.08);"></div>
            <div class="absolute top-20 -left-6 h-24 w-24 rounded-full" style="background: rgba(255,255,255,0.06);"></div>

            <!-- AppBar -->
            <header class="relative z-10 flex items-center justify-between px-4 py-3">
                <button data-dom-id="btn-back" class="flex h-9 w-9 items-center justify-center rounded-full" style="background: rgba(255,255,255,0.2);" aria-label="返回">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
                </button>
                <h1 class="font-semibold text-white" style="font-size: var(--text-lg); font-weight: var(--weight-semibold);">VIP 会员中心</h1>
                <button class="flex h-9 w-9 items-center justify-center rounded-full" style="background: rgba(255,255,255,0.2);" aria-label="更多">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
                </button>
            </header>

            <!-- VIP 状态卡片 - 已开通 -->
            <div class="relative z-10 mx-4 mt-6 p-5" style="background: var(--gradient-vip); border-radius: var(--radius-2xl); border: 1px solid rgba(255,255,255,0.3); box-shadow: 0 12px 40px rgba(255,214,107,0.3);">
                <div class="flex items-center justify-between">
                    <div>
                        <div class="flex items-center gap-2">
                            <span style="font-size: 24px;">&#128081;</span>
                            <h2 class="font-bold text-white" style="font-size: var(--text-xl); font-weight: var(--weight-bold);">VIP 会员</h2>
                        </div>
                        <p class="mt-1.5 text-white" style="font-size: var(--text-sm); opacity: 0.85;">有效期至 2026.12.31</p>
                    </div>
                    <div class="text-right">
                        <span class="inline-flex items-center px-3 py-1 text-white" style="background: rgba(255,255,255,0.25); border-radius: var(--radius-pill); font-size: var(--text-xs); font-weight: var(--weight-semibold);">已开通</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 权益标签 -->
        <div class="px-4 mt-5 mb-5">
            <h2 class="mb-3 font-semibold" style="font-size: var(--text-base); color: var(--color-title); font-weight: var(--weight-semibold);">专属权益</h2>
            <div class="flex flex-wrap gap-2">
                <span class="inline-flex items-center gap-1.5 px-4 py-2" style="background: rgba(255,214,107,0.15); color: var(--color-vip-gold-dark); border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: var(--weight-medium);">&#127873; 专属头像框</span>
                <span class="inline-flex items-center gap-1.5 px-4 py-2" style="background: rgba(127,127,213,0.12); color: var(--color-primary); border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: var(--weight-medium);">&#127912; 专属表情包</span>
                <span class="inline-flex items-center gap-1.5 px-4 py-2" style="background: rgba(255,214,107,0.15); color: var(--color-vip-gold-dark); border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: var(--weight-medium);">&#128161; AI 对话无限</span>
                <span class="inline-flex items-center gap-1.5 px-4 py-2" style="background: rgba(127,127,213,0.12); color: var(--color-primary); border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: var(--weight-medium);">&#128142; 会员标识</span>
                <span class="inline-flex items-center gap-1.5 px-4 py-2" style="background: rgba(255,214,107,0.15); color: var(--color-vip-gold-dark); border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: var(--weight-medium);">&#127880; 每日额外扭蛋</span>
                <span class="inline-flex items-center gap-1.5 px-4 py-2" style="background: rgba(127,127,213,0.12); color: var(--color-primary); border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: var(--weight-medium);">&#128101; 优先匹配</span>
            </div>
        </div>

        <!-- 菜单列表 -->
        <div class="px-4 space-y-3 pb-24">
            <div class="flex items-center justify-between p-4 bg-white" style="border-radius: var(--radius-xl); box-shadow: var(--shadow-card);">
                <div class="flex items-center gap-3">
                    <div class="flex h-10 w-10 items-center justify-center rounded-xl" style="background: rgba(52,168,235,0.12);">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#34A8EB" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                    </div>
                    <span class="font-medium" style="font-size: var(--text-md); color: var(--color-title); font-weight: var(--weight-medium);">订单记录</span>
                </div>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-placeholder)" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
            </div>

            <div class="flex items-center justify-between p-4 bg-white" style="border-radius: var(--radius-xl); box-shadow: var(--shadow-card);">
                <div class="flex items-center gap-3">
                    <div class="flex h-10 w-10 items-center justify-center rounded-xl" style="background: rgba(127,127,213,0.12);">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </div>
                    <span class="font-medium" style="font-size: var(--text-md); color: var(--color-title); font-weight: var(--weight-medium);">兑换码</span>
                </div>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-placeholder)" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
            </div>

            <div class="flex items-center justify-between p-4 bg-white" style="border-radius: var(--radius-xl); box-shadow: var(--shadow-card);">
                <div class="flex items-center gap-3">
                    <div class="flex h-10 w-10 items-center justify-center rounded-xl" style="background: rgba(52,199,89,0.12);">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#34C759" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    </div>
                    <span class="font-medium" style="font-size: var(--text-md); color: var(--color-title); font-weight: var(--weight-medium);">自动续费</span>
                </div>
                <!-- Switch toggle -->
                <div class="flex h-7 w-12 items-center" style="background: var(--color-primary); border-radius: var(--radius-pill); padding: 2px;">
                    <div class="h-6 w-6 ml-auto rounded-full bg-white shadow-sm"></div>
                </div>
            </div>
        </div>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
