<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>评论区</title>
    <style id="theme-vars">
/* ============================================
   Moe Social Design System - Brand CSS
   Extracted from Flutter MoeTokens & MoeTheme
   ============================================ */

:root {
  /* === Brand Colors === */
  --color-primary: #7F7FD5;
  --color-primary-hover: #6E6EC4;
  --color-secondary: #86A8E7;
  --color-accent: #91EAE4;
  --color-pastel-orange: #FFB347;
  --color-like-red: #FF4757;

  /* VIP Gold */
  --color-vip-gold: #FFD66B;
  --color-vip-gold-dark: #FFA94D;

  /* Gacha Pink */
  --color-gacha-pink: #FFB7C5;
  --color-gacha-pink-dark: #FFA5B5;

  /* === Surface Colors === */
  --color-page-bg: #F5F7FA;
  --color-card-bg: #FFFFFF;
  --color-input-bg: #FFFFFF;
  --color-input-fill: #F9F9F9;
  --color-search-bg: #F5F5F5;

  /* === Text Colors === */
  --color-title: #333333;
  --color-body: #212121;
  --color-body-secondary: rgba(0,0,0,0.6);
  --color-hint: #9E9E9E;
  --color-placeholder: #BDBDBD;

  /* === Status Colors === */
  --color-online: #34C759;
  --color-error: #FF4757;
  --color-success: #34C759;

  /* === Gradients === */
  --gradient-primary: linear-gradient(135deg, #7F7FD5 0%, #86A8E7 100%);
  --gradient-hero: linear-gradient(135deg, #7F7FD5 0%, #86A8E7 50%, #91EAE4 100%);
  --gradient-personalized: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
  --gradient-vip: linear-gradient(135deg, #FFD66B 0%, #FFA94D 100%);
  --gradient-gacha: linear-gradient(135deg, #FFB7C5 0%, #FFA5B5 100%);

  /* === Typography === */
  --font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-family-serif: 'Georgia', 'Noto Serif SC', serif;

  --text-xs: 10px;
  --text-sm: 11px;
  --text-base: 13px;
  --text-md: 15px;
  --text-lg: 16px;
  --text-xl: 18px;
  --text-2xl: 20px;
  --text-3xl: 24px;
  --text-4xl: 26px;
  --text-5xl: 28px;

  --leading-tight: 1.1;
  --leading-snug: 1.3;
  --leading-normal: 1.5;
  --leading-relaxed: 1.6;

  --weight-normal: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;
  --weight-extrabold: 800;
  --weight-black: 900;

  /* === Spacing === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;

  /* === Border Radius === */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-pill: 9999px;

  /* === Shadows === */
  --shadow-card: 0 8px 24px rgba(127,127,213,0.08);
  --shadow-card-hover: 0 12px 32px rgba(127,127,213,0.12);
  --shadow-button: 0 4px 16px rgba(127,127,213,0.3);
  --shadow-float: 0 8px 32px rgba(0,0,0,0.12);
  --shadow-nav: 0 -2px 16px rgba(0,0,0,0.05);
  --shadow-glow-primary: 0 0 20px rgba(127,127,213,0.25);

  /* === Motion === */
  --duration-fast: 150ms;
  --duration-normal: 300ms;
  --duration-slow: 600ms;
  --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-elastic: cubic-bezier(0.68, -0.55, 0.265, 1.55);

  /* === Avatar Ring Colors === */
  --ring-purple: linear-gradient(135deg, #7F7FD5, #f093fb);
  --ring-red-orange: linear-gradient(135deg, #FF6B6B, #FFB347);
  --ring-teal: linear-gradient(135deg, #4ECDC4, #44A08D);
  --ring-blue-purple: linear-gradient(135deg, #86A8E7, #7F7FD5);
  --ring-yellow: linear-gradient(135deg, #FFCA28, #FF8F00);
  --ring-deep-purple: linear-gradient(135deg, #AB47BC, #7B1FA2);
}

/* Dark mode overrides */
html.dark {
  --color-page-bg: #121212;
  --color-card-bg: #1E1E1E;
  --color-input-bg: #2C2C2C;
  --color-input-fill: #252525;
  --color-search-bg: #2C2C2C;
  --color-title: #E0E0E0;
  --color-body: #EEEEEE;
  --color-body-secondary: rgba(255,255,255,0.7);
  --color-hint: #757575;
  --color-placeholder: #616161;
  --shadow-card: 0 8px 24px rgba(0,0,0,0.24);
  --shadow-card-hover: 0 12px 32px rgba(0,0,0,0.32);
  --shadow-nav: 0 -2px 16px rgba(0,0,0,0.2);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-secondary: var(--color-secondary);
    --color-accent: var(--color-accent);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="relative min-h-screen flex flex-col" style="background-color: var(--color-page-bg);">

      <!-- Gradient AppBar -->
      <div style="background: var(--gradient-primary);">
        <div class="h-11"></div>
        <header class="flex items-center px-4" style="height: 44px;">
          <button data-dom-id="btn-back" class="flex h-9 w-9 items-center justify-center" style="background: rgba(255,255,255,0.15); border-radius: 12px;" aria-label="返回">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <h1 class="flex-1 text-center truncate" style="font-size: var(--text-lg); font-weight: var(--weight-bold); color: #FFFFFF;">评论</h1>
          <div class="w-9"></div>
        </header>
      </div>

      <!-- Scrollable Content -->
      <div class="flex-1 overflow-y-auto" style="padding-bottom: 70px;">

        <!-- Embedded Post Card -->
        <div class="mx-4 mb-4" style="margin-top: -10px; background-color: var(--color-card-bg); border-radius: 24px; padding: 16px; box-shadow: var(--shadow-card);">
          <div class="flex items-center gap-2 mb-3">
            <div class="shrink-0" style="width: 40px; height: 40px; border-radius: 50%; background: var(--ring-purple);"></div>
            <div class="min-w-0 flex-1">
              <p class="truncate" style="font-size: var(--text-base); font-weight: var(--weight-bold); color: var(--color-title);">画师小鹿</p>
            </div>
          </div>
          <p class="mb-3" style="font-size: var(--text-base); color: var(--color-body); line-height: var(--leading-relaxed);">最近尝试了新的上色风格，感觉渐变光效特别适合梦幻题材的作品~大家觉得怎么样？</p>
          <div class="mb-2" style="width: 100%; height: 140px; border-radius: 16px; overflow: hidden; background: var(--gradient-hero); opacity: 0.5;"></div>
          <div class="flex items-center gap-4 mt-3">
            <span class="flex items-center gap-1" style="font-size: var(--text-xs); color: var(--color-hint);">3 小时前</span>
            <span class="flex items-center gap-1" style="font-size: var(--text-xs); color: var(--color-hint);">&#10084; 128</span>
          </div>
        </div>

        <!-- Comment Count -->
        <div class="flex items-center gap-2 px-4 mb-3">
          <span style="font-size: 14px; color: var(--color-primary);">&#128172;</span>
          <span style="font-size: 15px; font-weight: var(--weight-extrabold); color: var(--color-title);">全部评论 &#183; 32 条</span>
        </div>

        <!-- Comment 1 -->
        <div class="mx-4 mb-3" style="background-color: var(--color-card-bg); border-radius: 4px 16px 16px 16px; padding: 12px; box-shadow: 0 2px 8px rgba(127,127,213,0.06);">
          <div class="flex gap-2">
            <div class="shrink-0" style="width: 36px; height: 36px; border-radius: 50%; background: var(--ring-teal);"></div>
            <div class="min-w-0 flex-1">
              <div class="flex items-center justify-between">
                <p class="truncate" style="font-size: var(--text-sm); font-weight: var(--weight-bold); color: var(--color-title);">动漫迷小光</p>
                <div class="flex items-center gap-3">
                  <span style="font-size: 11px; color: var(--color-hint);">2 小时前</span>
                  <span style="font-size: 12px; color: var(--color-like-red);">&#10084; 15</span>
                </div>
              </div>
              <p class="mt-1" style="font-size: var(--text-base); color: var(--color-body); line-height: var(--leading-relaxed);">太美了！光效的层次感处理得特别好，能分享一下上色的思路吗？</p>

              <!-- Reply 1 (nested) -->
              <div class="flex gap-2 mt-2" style="padding-left: 0;">
                <div class="shrink-0" style="width: 24px; height: 24px; border-radius: 50%; background: var(--ring-purple);"></div>
                <div class="min-w-0 flex-1">
                  <p style="font-size: var(--text-xs); color: var(--color-body-secondary); line-height: var(--leading-relaxed);">
                    <span style="color: var(--color-primary); font-weight: var(--weight-semibold);">@画师小鹿</span> 谢谢！主要用了正片叠底和发光叠加~
                  </p>
                </div>
              </div>
              <!-- Reply 2 (nested) -->
              <div class="flex gap-2 mt-2" style="padding-left: 0;">
                <div class="shrink-0" style="width: 24px; height: 24px; border-radius: 50%; background: var(--ring-yellow);"></div>
                <div class="min-w-0 flex-1">
                  <p style="font-size: var(--text-xs); color: var(--color-body-secondary); line-height: var(--leading-relaxed);">
                    <span style="color: var(--color-primary); font-weight: var(--weight-semibold);">@动漫迷小光</span> 同求教程！
                  </p>
                </div>
              </div>

              <!-- Expand/Collapse -->
              <p class="mt-2" style="font-size: 12px; color: var(--color-primary); font-weight: var(--weight-semibold);">展开 5 条回复</p>
            </div>
          </div>
        </div>

        <!-- Comment 2 -->
        <div class="mx-4 mb-3" style="background-color: var(--color-card-bg); border-radius: 4px 16px 16px 16px; padding: 12px; box-shadow: 0 2px 8px rgba(127,127,213,0.06);">
          <div class="flex gap-2">
            <div class="shrink-0" style="width: 36px; height: 36px; border-radius: 50%; background: var(--ring-red-orange);"></div>
            <div class="min-w-0 flex-1">
              <div class="flex items-center justify-between">
                <p class="truncate" style="font-size: var(--text-sm); font-weight: var(--weight-bold); color: var(--color-title);">创意工坊</p>
                <div class="flex items-center gap-3">
                  <span style="font-size: 11px; color: var(--color-hint);">1 小时前</span>
                  <span style="font-size: 12px; color: var(--color-hint);">&#10084;</span>
                </div>
              </div>
              <p class="mt-1" style="font-size: var(--text-base); color: var(--color-body); line-height: var(--leading-relaxed);">梦幻风格yyds，配色真的很有感觉</p>
            </div>
          </div>
        </div>

        <!-- Comment 3 -->
        <div class="mx-4 mb-3" style="background-color: var(--color-card-bg); border-radius: 4px 16px 16px 16px; padding: 12px; box-shadow: 0 2px 8px rgba(127,127,213,0.06);">
          <div class="flex gap-2">
            <div class="shrink-0" style="width: 36px; height: 36px; border-radius: 50%; background: var(--ring-deep-purple);"></div>
            <div class="min-w-0 flex-1">
              <div class="flex items-center justify-between">
                <p class="truncate" style="font-size: var(--text-sm); font-weight: var(--weight-bold); color: var(--color-title);">水彩少女</p>
                <div class="flex items-center gap-3">
                  <span style="font-size: 11px; color: var(--color-hint);">45 分钟前</span>
                  <span style="font-size: 12px; color: var(--color-like-red);">&#10084; 8</span>
                </div>
              </div>
              <p class="mt-1" style="font-size: var(--text-base); color: var(--color-body); line-height: var(--leading-relaxed);">请问用什么软件画的？效果真好看~</p>

              <!-- Nested Reply -->
              <div class="flex gap-2 mt-2" style="padding-left: 0;">
                <div class="shrink-0" style="width: 24px; height: 24px; border-radius: 50%; background: var(--ring-purple);"></div>
                <div class="min-w-0 flex-1">
                  <p style="font-size: var(--text-xs); color: var(--color-body-secondary); line-height: var(--leading-relaxed);">
                    <span style="color: var(--color-primary); font-weight: var(--weight-semibold);">@水彩少女</span> Procreate + 自定义笔刷
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- Bottom Input Area -->
      <div class="fixed bottom-0 left-0 right-0 z-30 flex items-center gap-3 px-4" style="padding-top: 12px; padding-bottom: 12px; background-color: var(--color-card-bg); border-radius: 24px 24px 0 0; box-shadow: var(--shadow-nav);">
        <div class="flex-1 flex items-center" style="height: 40px; border-radius: 24px; padding: 0 16px; background-color: #F5F7FA;">
          <span style="font-size: var(--text-base); color: var(--color-placeholder);">说点什么...</span>
        </div>
        <!-- Send button -->
        <div class="shrink-0 flex items-center justify-center" style="width: 40px; height: 40px; border-radius: 50%; background: var(--gradient-primary);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
        </div>
      </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
