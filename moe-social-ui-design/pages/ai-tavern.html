<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 酒馆 - Moe Social</title>
    <style id="theme-vars">
/* ============================================
   Moe Social Design System - Brand CSS
   Extracted from Flutter MoeTokens & MoeTheme
   ============================================ */

:root {
  /* === Brand Colors === */
  --color-primary: #7F7FD5;
  --color-primary-hover: #6E6EC4;
  --color-secondary: #86A8E7;
  --color-accent: #91EAE4;
  --color-pastel-orange: #FFB347;
  --color-like-red: #FF4757;

  /* VIP Gold */
  --color-vip-gold: #FFD66B;
  --color-vip-gold-dark: #FFA94D;

  /* Gacha Pink */
  --color-gacha-pink: #FFB7C5;
  --color-gacha-pink-dark: #FFA5B5;

  /* === Surface Colors === */
  --color-page-bg: #F5F7FA;
  --color-card-bg: #FFFFFF;
  --color-input-bg: #FFFFFF;
  --color-input-fill: #F9F9F9;
  --color-search-bg: #F5F5F5;

  /* === Text Colors === */
  --color-title: #333333;
  --color-body: #212121;
  --color-body-secondary: rgba(0,0,0,0.6);
  --color-hint: #9E9E9E;
  --color-placeholder: #BDBDBD;

  /* === Status Colors === */
  --color-online: #34C759;
  --color-error: #FF4757;
  --color-success: #34C759;

  /* === Gradients === */
  --gradient-primary: linear-gradient(135deg, #7F7FD5 0%, #86A8E7 100%);
  --gradient-hero: linear-gradient(135deg, #7F7FD5 0%, #86A8E7 50%, #91EAE4 100%);
  --gradient-personalized: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
  --gradient-vip: linear-gradient(135deg, #FFD66B 0%, #FFA94D 100%);
  --gradient-gacha: linear-gradient(135deg, #FFB7C5 0%, #FFA5B5 100%);

  /* === Typography === */
  --font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-family-serif: 'Georgia', 'Noto Serif SC', serif;

  --text-xs: 10px;
  --text-sm: 11px;
  --text-base: 13px;
  --text-md: 15px;
  --text-lg: 16px;
  --text-xl: 18px;
  --text-2xl: 20px;
  --text-3xl: 24px;
  --text-4xl: 26px;
  --text-5xl: 28px;

  --leading-tight: 1.1;
  --leading-snug: 1.3;
  --leading-normal: 1.5;
  --leading-relaxed: 1.6;

  --weight-normal: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;
  --weight-extrabold: 800;
  --weight-black: 900;

  /* === Spacing === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;

  /* === Border Radius === */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-pill: 9999px;

  /* === Shadows === */
  --shadow-card: 0 8px 24px rgba(127,127,213,0.08);
  --shadow-card-hover: 0 12px 32px rgba(127,127,213,0.12);
  --shadow-button: 0 4px 16px rgba(127,127,213,0.3);
  --shadow-float: 0 8px 32px rgba(0,0,0,0.12);
  --shadow-nav: 0 -2px 16px rgba(0,0,0,0.05);
  --shadow-glow-primary: 0 0 20px rgba(127,127,213,0.25);

  /* === Motion === */
  --duration-fast: 150ms;
  --duration-normal: 300ms;
  --duration-slow: 600ms;
  --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-elastic: cubic-bezier(0.68, -0.55, 0.265, 1.55);

  /* === Avatar Ring Colors === */
  --ring-purple: linear-gradient(135deg, #7F7FD5, #f093fb);
  --ring-red-orange: linear-gradient(135deg, #FF6B6B, #FFB347);
  --ring-teal: linear-gradient(135deg, #4ECDC4, #44A08D);
  --ring-blue-purple: linear-gradient(135deg, #86A8E7, #7F7FD5);
  --ring-yellow: linear-gradient(135deg, #FFCA28, #FF8F00);
  --ring-deep-purple: linear-gradient(135deg, #AB47BC, #7B1FA2);
}

/* Dark mode overrides */
html.dark {
  --color-page-bg: #121212;
  --color-card-bg: #1E1E1E;
  --color-input-bg: #2C2C2C;
  --color-input-fill: #252525;
  --color-search-bg: #2C2C2C;
  --color-title: #E0E0E0;
  --color-body: #EEEEEE;
  --color-body-secondary: rgba(255,255,255,0.7);
  --color-hint: #757575;
  --color-placeholder: #616161;
  --shadow-card: 0 8px 24px rgba(0,0,0,0.24);
  --shadow-card-hover: 0 12px 32px rgba(0,0,0,0.32);
  --shadow-nav: 0 -2px 16px rgba(0,0,0,0.2);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-secondary: var(--color-secondary);
    --color-accent: var(--color-accent);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="font-family: var(--font-family); background: var(--color-page-bg);">
    <main class="pb-24">
      <!-- AppBar -->
      <header class="sticky top-0 z-20" style="background: var(--color-card-bg);">
        <div class="flex items-center justify-between px-5 py-3">
          <span class="font-bold" style="font-size: var(--text-xl); color: var(--color-title);">AI 酒馆</span>
          <button aria-label="更多操作" class="w-8 h-8 flex items-center justify-center">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-title);"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
          </button>
        </div>
        <!-- Bottom TabBar inside AppBar -->
        <div class="flex gap-4 px-5 pb-3">
          <button class="pb-1 font-semibold border-b-2" style="font-size: var(--text-md); color: var(--color-primary); border-color: var(--color-primary);">角色剧场</button>
          <button class="pb-1 font-semibold" style="font-size: var(--text-md); color: var(--color-hint); border-color: transparent;">模型来源</button>
        </div>
      </header>

      <!-- Search Bar -->
      <div class="px-5 py-3">
        <div class="flex items-center gap-2 px-4 h-11 rounded-xl" style="background: var(--color-search-bg);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-hint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span style="font-size: var(--text-md); color: var(--color-placeholder);">搜索AI角色...</span>
        </div>
      </div>

      <!-- Sort Bar -->
      <div class="px-5 pb-3 flex gap-3">
        <span class="font-semibold whitespace-nowrap" style="font-size: var(--text-sm); color: var(--color-primary);">创建时间</span>
        <span class="whitespace-nowrap" style="font-size: var(--text-sm); color: var(--color-hint);">名称</span>
        <span class="whitespace-nowrap" style="font-size: var(--text-sm); color: var(--color-hint);">使用频率</span>
      </div>

      <!-- AI Character Grid -->
      <div class="px-5 grid grid-cols-2 gap-3">
        <!-- Character 1 -->
        <div class="rounded-[16px] overflow-hidden" style="background: linear-gradient(135deg, #E8D5F5, #C5B3E8);">
          <div class="p-4">
            <div class="w-[60px] h-[60px] rounded-full flex items-center justify-center mb-2" style="background: rgba(255,255,255,0.3);">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            </div>
            <h3 class="font-bold truncate" style="font-size: var(--text-md); color: white;">小助手</h3>
            <p class="mt-1 line-clamp-2" style="font-size: var(--text-sm); color: rgba(255,255,255,0.75);">温柔体贴的AI伙伴，随时为你解答疑问</p>
            <span class="inline-block mt-2 px-2 py-0.5 rounded-full" style="font-size: var(--text-xs); color: white; background: rgba(255,255,255,0.25);">助手</span>
          </div>
        </div>

        <!-- Character 2 -->
        <div class="rounded-[16px] overflow-hidden" style="background: linear-gradient(135deg, #C5EDE8, #A3D9D3);">
          <div class="p-4">
            <div class="w-[60px] h-[60px] rounded-full flex items-center justify-center mb-2" style="background: rgba(255,255,255,0.3);">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="white"><path d="M12 3l1.912 5.813a2 2 0 0 0 1.275 1.275L21 12l-5.813 1.912a2 2 0 0 0-1.275 1.275L12 21l-1.912-5.813a2 2 0 0 0-1.275-1.275L3 12l5.813-1.912a2 2 0 0 0 1.275-1.275L12 3z"/></svg>
            </div>
            <h3 class="font-bold truncate" style="font-size: var(--text-md); color: white;">创意大师</h3>
            <p class="mt-1 line-clamp-2" style="font-size: var(--text-sm); color: rgba(255,255,255,0.75);">灵感无限的创意搭档，帮你突破思维瓶颈</p>
            <span class="inline-block mt-2 px-2 py-0.5 rounded-full" style="font-size: var(--text-xs); color: white; background: rgba(255,255,255,0.25);">创意</span>
          </div>
        </div>

        <!-- Character 3 -->
        <div class="rounded-[16px] overflow-hidden" style="background: linear-gradient(135deg, #FFD5C7, #FFBCB0);">
          <div class="p-4">
            <div class="w-[60px] h-[60px] rounded-full flex items-center justify-center mb-2" style="background: rgba(255,255,255,0.3);">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="white"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </div>
            <h3 class="font-bold truncate" style="font-size: var(--text-md); color: white;">情感导师</h3>
            <p class="mt-1 line-clamp-2" style="font-size: var(--text-sm); color: rgba(255,255,255,0.75);">倾听你的心声，给予温暖的心理支持</p>
            <span class="inline-block mt-2 px-2 py-0.5 rounded-full" style="font-size: var(--text-xs); color: white; background: rgba(255,255,255,0.25);">情感</span>
          </div>
        </div>

        <!-- Character 4 -->
        <div class="rounded-[16px] overflow-hidden" style="background: linear-gradient(135deg, #FFF3C4, #FFE082);">
          <div class="p-4">
            <div class="w-[60px] h-[60px] rounded-full flex items-center justify-center mb-2" style="background: rgba(255,255,255,0.3);">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="white"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            </div>
            <h3 class="font-bold truncate" style="font-size: var(--text-md); color: rgba(0,0,0,0.7);">学霸君</h3>
            <p class="mt-1 line-clamp-2" style="font-size: var(--text-sm); color: rgba(0,0,0,0.55);">博学多才的知识库，随时查阅学习资料</p>
            <span class="inline-block mt-2 px-2 py-0.5 rounded-full" style="font-size: var(--text-xs); color: rgba(0,0,0,0.6); background: rgba(0,0,0,0.1);">知识</span>
          </div>
        </div>

        <!-- Character 5 -->
        <div class="rounded-[16px] overflow-hidden" style="background: linear-gradient(135deg, #E1BEE7, #CE93D8);">
          <div class="p-4">
            <div class="w-[60px] h-[60px] rounded-full flex items-center justify-center mb-2" style="background: rgba(255,255,255,0.3);">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="white"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
            </div>
            <h3 class="font-bold truncate" style="font-size: var(--text-md); color: white;">萌宠管家</h3>
            <p class="mt-1 line-clamp-2" style="font-size: var(--text-sm); color: rgba(255,255,255,0.75);">你的宠物护理专家，呵护毛孩子的健康</p>
            <span class="inline-block mt-2 px-2 py-0.5 rounded-full" style="font-size: var(--text-xs); color: white; background: rgba(255,255,255,0.25);">宠物</span>
          </div>
        </div>

        <!-- Character 6 -->
        <div class="rounded-[16px] overflow-hidden" style="background: linear-gradient(135deg, #C5D5F5, #90CAF9);">
          <div class="p-4">
            <div class="w-[60px] h-[60px] rounded-full flex items-center justify-center mb-2" style="background: rgba(255,255,255,0.3);">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="white"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>
            </div>
            <h3 class="font-bold truncate" style="font-size: var(--text-md); color: white;">数据分析师</h3>
            <p class="mt-1 line-clamp-2" style="font-size: var(--text-sm); color: rgba(255,255,255,0.75);">精准的数据洞察，助你做出明智决策</p>
            <span class="inline-block mt-2 px-2 py-0.5 rounded-full" style="font-size: var(--text-xs); color: white; background: rgba(255,255,255,0.25);">分析</span>
          </div>
        </div>
      </div>
    </main>

    <!-- FAB (Floating Action Button) -->
    <button class="fixed bottom-24 right-5 z-30 w-14 h-14 rounded-[24px] flex items-center justify-center text-white" style="background: var(--gradient-primary); box-shadow: var(--shadow-button);">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14m-7-7h14"/></svg>
    </button>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-4 left-4 right-4 z-30">
      <div class="flex items-center justify-around py-2 px-4 rounded-[32px]" style="background: var(--color-card-bg); box-shadow: var(--shadow-nav), 0 4px 20px rgba(127,127,213,0.12);">
        <a href="home.html" data-dom-id="tab-home" class="flex flex-col items-center gap-0.5 px-4 py-1.5 rounded-[20px]">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-hint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span style="font-size: var(--text-xs); color: var(--color-hint);">首页</span>
        </a>
        <a href="messages.html" data-dom-id="tab-messages" class="flex flex-col items-center gap-0.5 px-4 py-1.5 rounded-[20px]">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-hint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
          <span style="font-size: var(--text-xs); color: var(--color-hint);">消息</span>
        </a>
        <a href="ai-tavern.html" data-dom-id="tab-ai" class="flex flex-col items-center gap-0.5 px-4 py-1.5 rounded-[20px]" style="background: rgba(127,127,213,0.15);">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform: scale(1.12);"><path d="M12 3l1.912 5.813a2 2 0 0 0 1.275 1.275L21 12l-5.813 1.912a2 2 0 0 0-1.275 1.275L12 21l-1.912-5.813a2 2 0 0 0-1.275-1.275L3 12l5.813-1.912a2 2 0 0 0 1.275-1.275L12 3z"/></svg>
          <span class="font-semibold" style="font-size: var(--text-xs); color: var(--color-primary);">AI</span>
        </a>
        <a href="profile.html" data-dom-id="tab-profile" class="flex flex-col items-center gap-0.5 px-4 py-1.5 rounded-[20px]">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-hint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span style="font-size: var(--text-xs); color: var(--color-hint);">我的</span>
        </a>
      </div>
    </nav>
    <script>lucide.createIcons();</script>
</body>
</html>
