<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 聊天 - 萌社交</title>
    <style id="theme-vars">
/* ============================================
   Moe Social Design System - Brand CSS
   Extracted from Flutter MoeTokens & MoeTheme
   ============================================ */

:root {
  /* === Brand Colors === */
  --color-primary: #7F7FD5;
  --color-primary-hover: #6E6EC4;
  --color-secondary: #86A8E7;
  --color-accent: #91EAE4;
  --color-pastel-orange: #FFB347;
  --color-like-red: #FF4757;

  /* VIP Gold */
  --color-vip-gold: #FFD66B;
  --color-vip-gold-dark: #FFA94D;

  /* Gacha Pink */
  --color-gacha-pink: #FFB7C5;
  --color-gacha-pink-dark: #FFA5B5;

  /* === Surface Colors === */
  --color-page-bg: #F5F7FA;
  --color-card-bg: #FFFFFF;
  --color-input-bg: #FFFFFF;
  --color-input-fill: #F9F9F9;
  --color-search-bg: #F5F5F5;

  /* === Text Colors === */
  --color-title: #333333;
  --color-body: #212121;
  --color-body-secondary: rgba(0,0,0,0.6);
  --color-hint: #9E9E9E;
  --color-placeholder: #BDBDBD;

  /* === Status Colors === */
  --color-online: #34C759;
  --color-error: #FF4757;
  --color-success: #34C759;

  /* === Gradients === */
  --gradient-primary: linear-gradient(135deg, #7F7FD5 0%, #86A8E7 100%);
  --gradient-hero: linear-gradient(135deg, #7F7FD5 0%, #86A8E7 50%, #91EAE4 100%);
  --gradient-personalized: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
  --gradient-vip: linear-gradient(135deg, #FFD66B 0%, #FFA94D 100%);
  --gradient-gacha: linear-gradient(135deg, #FFB7C5 0%, #FFA5B5 100%);

  /* === Typography === */
  --font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-family-serif: 'Georgia', 'Noto Serif SC', serif;

  --text-xs: 10px;
  --text-sm: 11px;
  --text-base: 13px;
  --text-md: 15px;
  --text-lg: 16px;
  --text-xl: 18px;
  --text-2xl: 20px;
  --text-3xl: 24px;
  --text-4xl: 26px;
  --text-5xl: 28px;

  --leading-tight: 1.1;
  --leading-snug: 1.3;
  --leading-normal: 1.5;
  --leading-relaxed: 1.6;

  --weight-normal: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;
  --weight-extrabold: 800;
  --weight-black: 900;

  /* === Spacing === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;

  /* === Border Radius === */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-pill: 9999px;

  /* === Shadows === */
  --shadow-card: 0 8px 24px rgba(127,127,213,0.08);
  --shadow-card-hover: 0 12px 32px rgba(127,127,213,0.12);
  --shadow-button: 0 4px 16px rgba(127,127,213,0.3);
  --shadow-float: 0 8px 32px rgba(0,0,0,0.12);
  --shadow-nav: 0 -2px 16px rgba(0,0,0,0.05);
  --shadow-glow-primary: 0 0 20px rgba(127,127,213,0.25);

  /* === Motion === */
  --duration-fast: 150ms;
  --duration-normal: 300ms;
  --duration-slow: 600ms;
  --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-elastic: cubic-bezier(0.68, -0.55, 0.265, 1.55);

  /* === Avatar Ring Colors === */
  --ring-purple: linear-gradient(135deg, #7F7FD5, #f093fb);
  --ring-red-orange: linear-gradient(135deg, #FF6B6B, #FFB347);
  --ring-teal: linear-gradient(135deg, #4ECDC4, #44A08D);
  --ring-blue-purple: linear-gradient(135deg, #86A8E7, #7F7FD5);
  --ring-yellow: linear-gradient(135deg, #FFCA28, #FF8F00);
  --ring-deep-purple: linear-gradient(135deg, #AB47BC, #7B1FA2);
}

/* Dark mode overrides */
html.dark {
  --color-page-bg: #121212;
  --color-card-bg: #1E1E1E;
  --color-input-bg: #2C2C2C;
  --color-input-fill: #252525;
  --color-search-bg: #2C2C2C;
  --color-title: #E0E0E0;
  --color-body: #EEEEEE;
  --color-body-secondary: rgba(255,255,255,0.7);
  --color-hint: #757575;
  --color-placeholder: #616161;
  --shadow-card: 0 8px 24px rgba(0,0,0,0.24);
  --shadow-card-hover: 0 12px 32px rgba(0,0,0,0.32);
  --shadow-nav: 0 -2px 16px rgba(0,0,0,0.2);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-secondary: var(--color-secondary);
    --color-accent: var(--color-accent);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="relative min-h-screen flex flex-col" style="background: #F8F7FF; font-family: var(--font-family);">

        <!-- AppBar -->
        <header class="sticky top-0 z-30 flex items-center justify-between px-4 py-3 bg-white" style="box-shadow: var(--shadow-nav);">
            <div class="flex items-center gap-2">
                <button data-dom-id="btn-back" class="flex h-8 w-8 items-center justify-center rounded-full" style="background: var(--color-search-bg);" aria-label="返回">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-title)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
                </button>
                <div>
                    <h1 class="font-bold" style="font-size: var(--text-lg); color: var(--color-title); font-weight: var(--weight-bold);">小萌助手</h1>
                    <p class="mt-0.5" style="font-size: var(--text-xs); color: var(--color-hint);">GPT-4o</p>
                </div>
            </div>
            <div class="flex items-center gap-1">
                <button class="flex h-8 w-8 items-center justify-center rounded-full" style="background: var(--color-search-bg);" aria-label="设置">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-body-secondary)" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </button>
                <button class="flex h-8 w-8 items-center justify-center rounded-full" style="background: var(--color-search-bg);" aria-label="搜索">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-body-secondary)" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                </button>
                <button class="flex h-8 w-8 items-center justify-center rounded-full" style="background: var(--color-search-bg);" aria-label="信息">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-body-secondary)" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                </button>
                <button class="flex h-8 w-8 items-center justify-center rounded-full" style="background: var(--color-search-bg);" aria-label="历史">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-body-secondary)" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </button>
            </div>
        </header>

        <!-- 身份英雄区 -->
        <div class="flex flex-col items-center px-4 pt-8 pb-6">
            <div class="h-20 w-20 flex items-center justify-center rounded-full mb-4" style="background: var(--gradient-hero); box-shadow: 0 0 20px rgba(127,127,213,0.3);">
                <span style="font-size: 36px;">&#129302;</span>
            </div>
            <h2 class="font-bold" style="font-size: var(--text-xl); color: var(--color-title); font-weight: var(--weight-bold);">小萌助手</h2>
            <p class="mt-2 text-center" style="font-size: var(--text-sm); color: var(--color-hint); line-height: 1.5; max-width: 260px;">你的专属 AI 伙伴，随时倾听你的想法，给予温暖的回应和建议</p>
            <button class="mt-4 px-6 py-2.5 text-white font-semibold" style="background: var(--gradient-primary); border-radius: var(--radius-pill); font-size: var(--text-base); box-shadow: var(--shadow-button);">开始对话</button>
        </div>

        <!-- 消息列表 -->
        <div class="flex-1 px-4 pb-4 space-y-4">

            <!-- 日期分隔线 -->
            <div class="flex items-center gap-3 py-2">
                <div class="flex-1 h-px" style="background: var(--color-placeholder); opacity: 0.3;"></div>
                <span class="px-3 py-1 text-xs" style="background: var(--color-search-bg); color: var(--color-hint); border-radius: var(--radius-pill); font-size: var(--text-sm);">今天</span>
                <div class="flex-1 h-px" style="background: var(--color-placeholder); opacity: 0.3;"></div>
            </div>

            <!-- AI 消息 (左对齐) -->
            <div class="flex gap-2.5 items-start max-w-[85%]">
                <div class="h-9 w-9 shrink-0 flex items-center justify-center rounded-full" style="background: var(--gradient-hero);">
                    <span style="font-size: 16px;">&#129302;</span>
                </div>
                <div class="px-4 py-3 rounded-2xl" style="background: white; box-shadow: var(--shadow-card);">
                    <p style="font-size: var(--text-md); color: var(--color-body); line-height: 1.5;">你好呀！今天心情怎么样？有什么想和我分享的吗？</p>
                </div>
            </div>

            <!-- 用户消息 (右对齐) -->
            <div class="flex justify-end">
                <div class="max-w-[75%] px-4 py-3" style="background: var(--color-primary); border-radius: 18px 6px 18px 18px;">
                    <p style="font-size: var(--text-md); color: white; line-height: 1.5;">最近工作压力有点大，想找人聊聊</p>
                </div>
            </div>

            <!-- AI 消息 -->
            <div class="flex gap-2.5 items-start max-w-[85%]">
                <div class="h-9 w-9 shrink-0 flex items-center justify-center rounded-full" style="background: var(--gradient-hero);">
                    <span style="font-size: 16px;">&#129302;</span>
                </div>
                <div class="px-4 py-3 rounded-2xl" style="background: white; box-shadow: var(--shadow-card);">
                    <p style="font-size: var(--text-md); color: var(--color-body); line-height: 1.5;">我理解你的感受。工作压力大的时候，可以试试深呼吸，或者做一些自己喜欢的事情来放松一下。你有什么兴趣爱好吗？</p>
                </div>
            </div>

            <!-- 用户消息 -->
            <div class="flex justify-end">
                <div class="max-w-[75%] px-4 py-3" style="background: var(--color-primary); border-radius: 18px 6px 18px 18px;">
                    <p style="font-size: var(--text-md); color: white; line-height: 1.5;">我喜欢画画和听音乐，但最近都没时间</p>
                </div>
            </div>

            <!-- AI 消息 -->
            <div class="flex gap-2.5 items-start max-w-[85%]">
                <div class="h-9 w-9 shrink-0 flex items-center justify-center rounded-full" style="background: var(--gradient-hero);">
                    <span style="font-size: 16px;">&#129302;</span>
                </div>
                <div class="px-4 py-3 rounded-2xl" style="background: white; box-shadow: var(--shadow-card);">
                    <p style="font-size: var(--text-md); color: var(--color-body); line-height: 1.5;">即使只有 10 分钟，画画或听一首喜欢的歌也能帮你缓解压力哦。不如今晚试着给自己留一小段"独处时光"？</p>
                </div>
            </div>

        </div>

        <!-- 快捷回复 -->
        <div class="px-4 pb-2">
            <div class="flex gap-2 overflow-x-auto no-scrollbar">
                <span class="shrink-0 inline-flex items-center px-3.5 py-2 whitespace-nowrap" style="background: white; border: 1px solid var(--color-primary); border-radius: 20px; font-size: var(--text-sm); color: var(--color-primary);">推荐一首放松的音乐</span>
                <span class="shrink-0 inline-flex items-center px-3.5 py-2 whitespace-nowrap" style="background: white; border: 1px solid var(--color-primary); border-radius: 20px; font-size: var(--text-sm); color: var(--color-primary);">如何快速减压</span>
                <span class="shrink-0 inline-flex items-center px-3.5 py-2 whitespace-nowrap" style="background: white; border: 1px solid var(--color-primary); border-radius: 20px; font-size: var(--text-sm); color: var(--color-primary);">跟我聊聊爱好</span>
            </div>
        </div>

        <!-- 输入区域 -->
        <div class="sticky bottom-0 bg-white px-4 pt-3 pb-4" style="box-shadow: 0 -2px 16px rgba(0,0,0,0.05);">
            <div class="flex items-center gap-2">
                <button class="flex h-9 w-9 items-center justify-center rounded-full shrink-0" style="background: var(--color-search-bg);" aria-label="语音输入">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                </button>
                <input type="text" class="flex-1 py-2.5 px-4 outline-none" placeholder="输入消息..." style="background: var(--color-search-bg); border-radius: 22px; font-size: var(--text-base); color: var(--color-title); border: none;" />
                <button class="flex h-10 w-10 items-center justify-center rounded-full shrink-0" style="background: var(--color-primary); box-shadow: var(--shadow-button);" aria-label="发送">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
            </div>
        </div>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
