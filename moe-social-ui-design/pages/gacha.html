<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled</title>
    <style id="theme-vars">
/* ============================================
   Moe Social Design System - Brand CSS
   Extracted from Flutter MoeTokens & MoeTheme
   ============================================ */

:root {
  /* === Brand Colors === */
  --color-primary: #7F7FD5;
  --color-primary-hover: #6E6EC4;
  --color-secondary: #86A8E7;
  --color-accent: #91EAE4;
  --color-pastel-orange: #FFB347;
  --color-like-red: #FF4757;

  /* VIP Gold */
  --color-vip-gold: #FFD66B;
  --color-vip-gold-dark: #FFA94D;

  /* Gacha Pink */
  --color-gacha-pink: #FFB7C5;
  --color-gacha-pink-dark: #FFA5B5;

  /* === Surface Colors === */
  --color-page-bg: #F5F7FA;
  --color-card-bg: #FFFFFF;
  --color-input-bg: #FFFFFF;
  --color-input-fill: #F9F9F9;
  --color-search-bg: #F5F5F5;

  /* === Text Colors === */
  --color-title: #333333;
  --color-body: #212121;
  --color-body-secondary: rgba(0,0,0,0.6);
  --color-hint: #9E9E9E;
  --color-placeholder: #BDBDBD;

  /* === Status Colors === */
  --color-online: #34C759;
  --color-error: #FF4757;
  --color-success: #34C759;

  /* === Gradients === */
  --gradient-primary: linear-gradient(135deg, #7F7FD5 0%, #86A8E7 100%);
  --gradient-hero: linear-gradient(135deg, #7F7FD5 0%, #86A8E7 50%, #91EAE4 100%);
  --gradient-personalized: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
  --gradient-vip: linear-gradient(135deg, #FFD66B 0%, #FFA94D 100%);
  --gradient-gacha: linear-gradient(135deg, #FFB7C5 0%, #FFA5B5 100%);

  /* === Typography === */
  --font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-family-serif: 'Georgia', 'Noto Serif SC', serif;

  --text-xs: 10px;
  --text-sm: 11px;
  --text-base: 13px;
  --text-md: 15px;
  --text-lg: 16px;
  --text-xl: 18px;
  --text-2xl: 20px;
  --text-3xl: 24px;
  --text-4xl: 26px;
  --text-5xl: 28px;

  --leading-tight: 1.1;
  --leading-snug: 1.3;
  --leading-normal: 1.5;
  --leading-relaxed: 1.6;

  --weight-normal: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;
  --weight-extrabold: 800;
  --weight-black: 900;

  /* === Spacing === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;

  /* === Border Radius === */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-pill: 9999px;

  /* === Shadows === */
  --shadow-card: 0 8px 24px rgba(127,127,213,0.08);
  --shadow-card-hover: 0 12px 32px rgba(127,127,213,0.12);
  --shadow-button: 0 4px 16px rgba(127,127,213,0.3);
  --shadow-float: 0 8px 32px rgba(0,0,0,0.12);
  --shadow-nav: 0 -2px 16px rgba(0,0,0,0.05);
  --shadow-glow-primary: 0 0 20px rgba(127,127,213,0.25);

  /* === Motion === */
  --duration-fast: 150ms;
  --duration-normal: 300ms;
  --duration-slow: 600ms;
  --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-elastic: cubic-bezier(0.68, -0.55, 0.265, 1.55);

  /* === Avatar Ring Colors === */
  --ring-purple: linear-gradient(135deg, #7F7FD5, #f093fb);
  --ring-red-orange: linear-gradient(135deg, #FF6B6B, #FFB347);
  --ring-teal: linear-gradient(135deg, #4ECDC4, #44A08D);
  --ring-blue-purple: linear-gradient(135deg, #86A8E7, #7F7FD5);
  --ring-yellow: linear-gradient(135deg, #FFCA28, #FF8F00);
  --ring-deep-purple: linear-gradient(135deg, #AB47BC, #7B1FA2);
}

/* Dark mode overrides */
html.dark {
  --color-page-bg: #121212;
  --color-card-bg: #1E1E1E;
  --color-input-bg: #2C2C2C;
  --color-input-fill: #252525;
  --color-search-bg: #2C2C2C;
  --color-title: #E0E0E0;
  --color-body: #EEEEEE;
  --color-body-secondary: rgba(255,255,255,0.7);
  --color-hint: #757575;
  --color-placeholder: #616161;
  --shadow-card: 0 8px 24px rgba(0,0,0,0.24);
  --shadow-card-hover: 0 12px 32px rgba(0,0,0,0.32);
  --shadow-nav: 0 -2px 16px rgba(0,0,0,0.2);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-secondary: var(--color-secondary);
    --color-accent: var(--color-accent);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="relative min-h-screen overflow-hidden" style="background: #FDFBF7; font-family: var(--font-family);">

        <!-- 装饰圆 -->
        <div class="absolute top-0 right-0 h-[300px] w-[300px] rounded-full -z-0" style="background: rgba(255,183,197,0.2);"></div>

        <!-- AppBar -->
        <header class="relative z-10 flex items-center justify-between px-4 py-3">
            <button data-dom-id="btn-back" class="flex h-9 w-9 items-center justify-center rounded-full" style="background: rgba(255,255,255,0.8);" aria-label="返回">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-title)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
            </button>
            <h1 class="font-bold" style="font-size: var(--text-lg); color: var(--color-title); font-weight: var(--weight-bold);">心情扭蛋机</h1>
            <div class="flex items-center gap-2">
                <button class="flex h-9 w-9 items-center justify-center rounded-full" style="background: rgba(255,255,255,0.8);" aria-label="背包">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-title)" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                </button>
                <span class="inline-flex items-center gap-1 px-3 py-1.5 text-white" style="background: rgba(0,0,0,0.15); border-radius: var(--radius-pill); font-size: var(--text-sm); font-weight: var(--weight-semibold);">
                    &#129689; 1280
                </span>
            </div>
        </header>

        <!-- 扭蛋机主体 -->
        <div class="relative z-10 flex justify-center mt-4">
            <div class="relative flex flex-col items-center" style="width: 280px; height: 400px; background: var(--gradient-gacha); border-radius: 40px; border: 4px solid white; box-shadow: 0 12px 40px rgba(255,183,197,0.3);">

                <!-- 玻璃罩 -->
                <div class="flex items-center justify-center mt-8" style="width: 200px; height: 200px; border-radius: 50%; background: rgba(255,255,255,0.5); box-shadow: inset 0 4px 20px rgba(0,0,0,0.05);">
                    <!-- 彩色小球 -->
                    <div class="relative">
                        <div class="absolute h-10 w-10 rounded-full" style="background: #FF9A9E; top: 0; left: 30px;"></div>
                        <div class="absolute h-10 w-10 rounded-full" style="background: #A18CD1; top: 20px; left: 70px;"></div>
                        <div class="absolute h-10 w-10 rounded-full" style="background: #8FD3F4; top: 50px; left: 20px;"></div>
                        <div class="absolute h-10 w-10 rounded-full" style="background: #FFB347; top: 40px; left: 55px;"></div>
                        <div class="absolute h-10 w-10 rounded-full" style="background: #FF9A9E; top: 70px; left: 80px;"></div>
                        <div class="absolute h-10 w-10 rounded-full" style="background: #91EAE4; top: 15px; left: 5px;"></div>
                        <div class="absolute h-10 w-10 rounded-full" style="background: #7F7FD5; top: 65px; left: 5px;"></div>
                        <div class="absolute h-8 w-8 rounded-full" style="background: #E2E2E2; top: 80px; left: 45px;"></div>
                        <div class="absolute h-9 w-9 rounded-full" style="background: #FFD66B; top: 30px; left: 100px;"></div>
                        <div class="absolute h-8 w-8 rounded-full" style="background: #86A8E7; top: 75px; left: 70px;"></div>
                    </div>
                </div>

                <!-- 出口 -->
                <div class="mt-auto mb-10 flex items-center justify-center" style="width: 80px; height: 24px; background: rgba(0,0,0,0.15); border-radius: 12px 12px 0 0;"></div>

                <!-- 状态文字 -->
                <p class="absolute bottom-5 text-white font-semibold" style="font-size: var(--text-base); font-weight: var(--weight-semibold); text-shadow: 0 1px 4px rgba(0,0,0,0.1);">剩余 56 次</p>
            </div>
        </div>

        <!-- 奖品池按钮 -->
        <div class="relative z-10 flex justify-center mt-5">
            <button class="inline-flex items-center gap-2 px-5 py-2.5 bg-white font-medium" style="border-radius: 22px; box-shadow: var(--shadow-card); font-size: var(--text-sm); color: var(--color-title); font-weight: var(--weight-medium);">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
                查看奖品池
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-hint)" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
        </div>

        <!-- 抽奖按钮 -->
        <div class="relative z-10 flex gap-3 px-6 mt-6 pb-8">
            <!-- 单抽 -->
            <button class="flex-1 flex flex-col items-center justify-center h-16 text-white font-bold" style="background: var(--color-primary); border-radius: 20px; box-shadow: 0 8px 24px rgba(127,127,213,0.35); font-weight: var(--weight-bold);">
                <span style="font-size: var(--text-md);">单次抽取</span>
                <span class="flex items-center gap-1 mt-0.5" style="font-size: var(--text-sm); opacity: 0.7;">
                    &#129689; 100
                </span>
            </button>
            <!-- 十连 -->
            <button class="flex-1 relative flex flex-col items-center justify-center h-16 text-white font-bold" style="background: #FF9A9E; border-radius: 20px; box-shadow: 0 8px 24px rgba(255,154,158,0.35); font-weight: var(--weight-bold);">
                <span style="font-size: var(--text-md);">十连抽取</span>
                <span class="flex items-center gap-1 mt-0.5" style="font-size: var(--text-sm); opacity: 0.7;">
                    &#129689; 900
                </span>
                <span class="absolute -top-2.5 left-1/2 -translate-x-1/2 px-2 py-0.5 text-white whitespace-nowrap" style="background: rgba(255,255,255,0.3); border-radius: var(--radius-pill); font-size: 10px; font-weight: var(--weight-semibold);">必出SR</span>
            </button>
        </div>

        <!-- 稀有度图例 -->
        <div class="relative z-10 flex items-center justify-center gap-4 pb-8">
            <div class="flex items-center gap-1.5">
                <div class="h-3 w-3 rounded-full" style="background: #FF9A9E;"></div>
                <span style="font-size: var(--text-xs); color: var(--color-hint);">SSR</span>
            </div>
            <div class="flex items-center gap-1.5">
                <div class="h-3 w-3 rounded-full" style="background: #A18CD1;"></div>
                <span style="font-size: var(--text-xs); color: var(--color-hint);">SR</span>
            </div>
            <div class="flex items-center gap-1.5">
                <div class="h-3 w-3 rounded-full" style="background: #8FD3F4;"></div>
                <span style="font-size: var(--text-xs); color: var(--color-hint);">R</span>
            </div>
            <div class="flex items-center gap-1.5">
                <div class="h-3 w-3 rounded-full" style="background: #E2E2E2;"></div>
                <span style="font-size: var(--text-xs); color: var(--color-hint);">N</span>
            </div>
        </div>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
