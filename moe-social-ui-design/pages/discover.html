<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled</title>
    <style id="theme-vars">
/* ============================================
   Moe Social Design System - Brand CSS
   Extracted from Flutter MoeTokens & MoeTheme
   ============================================ */

:root {
  /* === Brand Colors === */
  --color-primary: #7F7FD5;
  --color-primary-hover: #6E6EC4;
  --color-secondary: #86A8E7;
  --color-accent: #91EAE4;
  --color-pastel-orange: #FFB347;
  --color-like-red: #FF4757;

  /* VIP Gold */
  --color-vip-gold: #FFD66B;
  --color-vip-gold-dark: #FFA94D;

  /* Gacha Pink */
  --color-gacha-pink: #FFB7C5;
  --color-gacha-pink-dark: #FFA5B5;

  /* === Surface Colors === */
  --color-page-bg: #F5F7FA;
  --color-card-bg: #FFFFFF;
  --color-input-bg: #FFFFFF;
  --color-input-fill: #F9F9F9;
  --color-search-bg: #F5F5F5;

  /* === Text Colors === */
  --color-title: #333333;
  --color-body: #212121;
  --color-body-secondary: rgba(0,0,0,0.6);
  --color-hint: #9E9E9E;
  --color-placeholder: #BDBDBD;

  /* === Status Colors === */
  --color-online: #34C759;
  --color-error: #FF4757;
  --color-success: #34C759;

  /* === Gradients === */
  --gradient-primary: linear-gradient(135deg, #7F7FD5 0%, #86A8E7 100%);
  --gradient-hero: linear-gradient(135deg, #7F7FD5 0%, #86A8E7 50%, #91EAE4 100%);
  --gradient-personalized: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
  --gradient-vip: linear-gradient(135deg, #FFD66B 0%, #FFA94D 100%);
  --gradient-gacha: linear-gradient(135deg, #FFB7C5 0%, #FFA5B5 100%);

  /* === Typography === */
  --font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-family-serif: 'Georgia', 'Noto Serif SC', serif;

  --text-xs: 10px;
  --text-sm: 11px;
  --text-base: 13px;
  --text-md: 15px;
  --text-lg: 16px;
  --text-xl: 18px;
  --text-2xl: 20px;
  --text-3xl: 24px;
  --text-4xl: 26px;
  --text-5xl: 28px;

  --leading-tight: 1.1;
  --leading-snug: 1.3;
  --leading-normal: 1.5;
  --leading-relaxed: 1.6;

  --weight-normal: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;
  --weight-extrabold: 800;
  --weight-black: 900;

  /* === Spacing === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;

  /* === Border Radius === */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-pill: 9999px;

  /* === Shadows === */
  --shadow-card: 0 8px 24px rgba(127,127,213,0.08);
  --shadow-card-hover: 0 12px 32px rgba(127,127,213,0.12);
  --shadow-button: 0 4px 16px rgba(127,127,213,0.3);
  --shadow-float: 0 8px 32px rgba(0,0,0,0.12);
  --shadow-nav: 0 -2px 16px rgba(0,0,0,0.05);
  --shadow-glow-primary: 0 0 20px rgba(127,127,213,0.25);

  /* === Motion === */
  --duration-fast: 150ms;
  --duration-normal: 300ms;
  --duration-slow: 600ms;
  --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-elastic: cubic-bezier(0.68, -0.55, 0.265, 1.55);

  /* === Avatar Ring Colors === */
  --ring-purple: linear-gradient(135deg, #7F7FD5, #f093fb);
  --ring-red-orange: linear-gradient(135deg, #FF6B6B, #FFB347);
  --ring-teal: linear-gradient(135deg, #4ECDC4, #44A08D);
  --ring-blue-purple: linear-gradient(135deg, #86A8E7, #7F7FD5);
  --ring-yellow: linear-gradient(135deg, #FFCA28, #FF8F00);
  --ring-deep-purple: linear-gradient(135deg, #AB47BC, #7B1FA2);
}

/* Dark mode overrides */
html.dark {
  --color-page-bg: #121212;
  --color-card-bg: #1E1E1E;
  --color-input-bg: #2C2C2C;
  --color-input-fill: #252525;
  --color-search-bg: #2C2C2C;
  --color-title: #E0E0E0;
  --color-body: #EEEEEE;
  --color-body-secondary: rgba(255,255,255,0.7);
  --color-hint: #757575;
  --color-placeholder: #616161;
  --shadow-card: 0 8px 24px rgba(0,0,0,0.24);
  --shadow-card-hover: 0 12px 32px rgba(0,0,0,0.32);
  --shadow-nav: 0 -2px 16px rgba(0,0,0,0.2);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-secondary: var(--color-secondary);
    --color-accent: var(--color-accent);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="relative min-h-screen" style="background: var(--color-page-bg); font-family: var(--font-family);">

        <!-- 标题区域 -->
        <header class="px-4 pt-6 pb-4">
            <div class="flex items-start justify-between">
                <div>
                    <h1 class="font-black" style="font-size: var(--text-4xl); color: var(--color-title); font-weight: var(--weight-black);">探索</h1>
                    <p class="mt-1" style="font-size: var(--text-sm); color: var(--color-hint);">发现有趣的人和玩法</p>
                </div>
                <button class="flex h-9 w-9 items-center justify-center rounded-full" style="background: white; box-shadow: var(--shadow-card);" aria-label="通知">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                </button>
            </div>
        </header>

        <!-- 分段选择器 -->
        <div class="px-4 mb-5">
            <div class="flex p-1 relative" style="background: var(--color-search-bg); border-radius: 14px; height: 44px;">
                <div class="absolute top-1 left-1 h-[calc(100%-8px)] w-[calc(50%-4px)]" style="background: rgba(127,127,213,0.12); border-radius: 10px; transition: transform 300ms;"></div>
                <button class="relative z-10 flex-1 flex items-center justify-center text-sm font-semibold" style="color: var(--color-primary); font-size: var(--text-base); font-weight: var(--weight-semibold);">同好</button>
                <button class="relative z-10 flex-1 flex items-center justify-center text-sm" style="color: var(--color-hint); font-size: var(--text-base);">玩法</button>
            </div>
        </div>

        <!-- 推荐用户卡片 -->
        <div class="px-4 mb-6">
            <h2 class="mb-3 font-semibold" style="font-size: var(--text-base); color: var(--color-title); font-weight: var(--weight-semibold);">推荐关注</h2>
            <div class="flex gap-3 overflow-x-auto no-scrollbar pb-1">

                <div class="shrink-0 w-36 p-3 bg-white" style="border-radius: var(--radius-lg); box-shadow: var(--shadow-card);">
                    <div class="h-14 w-14 mx-auto flex items-center justify-center rounded-full" style="background: var(--ring-purple);">
                        <span style="font-size: 24px;">&#128054;</span>
                    </div>
                    <h3 class="mt-2 text-center truncate font-semibold" style="font-size: var(--text-sm); color: var(--color-title); font-weight: var(--weight-semibold);">萌萌酱</h3>
                    <p class="mt-1 text-center truncate" style="font-size: var(--text-xs); color: var(--color-hint); line-height: 1.3;">热爱绘画和猫咪</p>
                    <button class="mt-2.5 w-full py-1.5 text-white text-xs font-semibold" style="background: var(--color-primary); border-radius: var(--radius-sm); font-size: var(--text-sm);">关注</button>
                </div>

                <div class="shrink-0 w-36 p-3 bg-white" style="border-radius: var(--radius-lg); box-shadow: var(--shadow-card);">
                    <div class="h-14 w-14 mx-auto flex items-center justify-center rounded-full" style="background: var(--ring-teal);">
                        <span style="font-size: 24px;">&#127912;</span>
                    </div>
                    <h3 class="mt-2 text-center truncate font-semibold" style="font-size: var(--text-sm); color: var(--color-title); font-weight: var(--weight-semibold);">星野花</h3>
                    <p class="mt-1 text-center truncate" style="font-size: var(--text-xs); color: var(--color-hint); line-height: 1.3;">插画师 / 旅行达人</p>
                    <button class="mt-2.5 w-full py-1.5 text-white text-xs font-semibold" style="background: var(--color-primary); border-radius: var(--radius-sm); font-size: var(--text-sm);">关注</button>
                </div>

                <div class="shrink-0 w-36 p-3 bg-white" style="border-radius: var(--radius-lg); box-shadow: var(--shadow-card);">
                    <div class="h-14 w-14 mx-auto flex items-center justify-center rounded-full" style="background: var(--ring-red-orange);">
                        <span style="font-size: 24px;">&#127911;</span>
                    </div>
                    <h3 class="mt-2 text-center truncate font-semibold" style="font-size: var(--text-sm); color: var(--color-title); font-weight: var(--weight-semibold);">音乐小熊</h3>
                    <p class="mt-1 text-center truncate" style="font-size: var(--text-xs); color: var(--color-hint); line-height: 1.3;">民谣吉他手</p>
                    <button class="mt-2.5 w-full py-1.5 text-white text-xs font-semibold" style="background: var(--color-primary); border-radius: var(--radius-sm); font-size: var(--text-sm);">关注</button>
                </div>

                <div class="shrink-0 w-36 p-3 bg-white" style="border-radius: var(--radius-lg); box-shadow: var(--shadow-card);">
                    <div class="h-14 w-14 mx-auto flex items-center justify-center rounded-full" style="background: var(--ring-blue-purple);">
                        <span style="font-size: 24px;">&#128218;</span>
                    </div>
                    <h3 class="mt-2 text-center truncate font-semibold" style="font-size: var(--text-sm); color: var(--color-title); font-weight: var(--weight-semibold);">书虫小林</h3>
                    <p class="mt-1 text-center truncate" style="font-size: var(--text-xs); color: var(--color-hint); line-height: 1.3;">小说爱好者</p>
                    <button class="mt-2.5 w-full py-1.5 text-white text-xs font-semibold" style="background: var(--color-primary); border-radius: var(--radius-sm); font-size: var(--text-sm);">关注</button>
                </div>

            </div>
        </div>

        <!-- 兴趣匹配区域 -->
        <div class="px-4 mb-24">
            <h2 class="mb-3 font-semibold" style="font-size: var(--text-base); color: var(--color-title); font-weight: var(--weight-semibold);">兴趣匹配</h2>
            <div class="flex flex-wrap gap-2">
                <span class="inline-flex items-center px-4 py-2" style="background: rgba(127,127,213,0.15); color: var(--color-primary); border-radius: var(--radius-pill); font-size: var(--text-sm); font-weight: var(--weight-medium);">&#127912; 绘画</span>
                <span class="inline-flex items-center px-4 py-2" style="background: rgba(145,234,228,0.2); color: #4ECDC4; border-radius: var(--radius-pill); font-size: var(--text-sm); font-weight: var(--weight-medium);">&#127925; 音乐</span>
                <span class="inline-flex items-center px-4 py-2" style="background: rgba(134,168,231,0.15); color: var(--color-secondary); border-radius: var(--radius-pill); font-size: var(--text-sm); font-weight: var(--weight-medium);">&#128218; 阅读</span>
                <span class="inline-flex items-center px-4 py-2" style="background: rgba(255,179,71,0.15); color: #FF9500; border-radius: var(--radius-pill); font-size: var(--text-sm); font-weight: var(--weight-medium);">&#127760; 旅行</span>
                <span class="inline-flex items-center px-4 py-2" style="background: rgba(255,183,197,0.2); color: #E91E63; border-radius: var(--radius-pill); font-size: var(--text-sm); font-weight: var(--weight-medium);">&#127859; 美食</span>
                <span class="inline-flex items-center px-4 py-2" style="background: rgba(78,205,196,0.15); color: #00BFA5; border-radius: var(--radius-pill); font-size: var(--text-sm); font-weight: var(--weight-medium);">&#9917; 运动</span>
                <span class="inline-flex items-center px-4 py-2" style="background: rgba(171,71,188,0.15); color: #AB47BC; border-radius: var(--radius-pill); font-size: var(--text-sm); font-weight: var(--weight-medium);">&#127908; 游戏</span>
                <span class="inline-flex items-center px-4 py-2" style="background: rgba(255,167,38,0.15); color: #FF6F00; border-radius: var(--radius-pill); font-size: var(--text-sm); font-weight: var(--weight-medium);">&#128247; 摄影</span>
                <span class="inline-flex items-center px-4 py-2" style="background: rgba(127,127,213,0.1); color: var(--color-primary); border-radius: var(--radius-pill); font-size: var(--text-sm); font-weight: var(--weight-medium);">&#128054; 萌宠</span>
                <span class="inline-flex items-center px-4 py-2" style="background: rgba(255,183,197,0.15); color: #F06292; border-radius: var(--radius-pill); font-size: var(--text-sm); font-weight: var(--weight-medium);">&#127803; 手工</span>
            </div>
        </div>

        <!-- 返回按钮 -->
        <button data-dom-id="btn-back" class="sr-only" aria-label="返回"></button>

        <!-- FAB -->
        <button class="fixed bottom-6 right-6 z-30 flex h-14 w-14 items-center justify-center rounded-full shadow-lg" style="background: var(--color-primary); box-shadow: var(--shadow-button);" aria-label="随机匹配">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
        </button>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
