<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布动态 - 萌社交</title>
    <style id="theme-vars">
/* ============================================
   Moe Social Design System - Brand CSS
   Extracted from Flutter MoeTokens & MoeTheme
   ============================================ */

:root {
  /* === Brand Colors === */
  --color-primary: #7F7FD5;
  --color-primary-hover: #6E6EC4;
  --color-secondary: #86A8E7;
  --color-accent: #91EAE4;
  --color-pastel-orange: #FFB347;
  --color-like-red: #FF4757;

  /* VIP Gold */
  --color-vip-gold: #FFD66B;
  --color-vip-gold-dark: #FFA94D;

  /* Gacha Pink */
  --color-gacha-pink: #FFB7C5;
  --color-gacha-pink-dark: #FFA5B5;

  /* === Surface Colors === */
  --color-page-bg: #F5F7FA;
  --color-card-bg: #FFFFFF;
  --color-input-bg: #FFFFFF;
  --color-input-fill: #F9F9F9;
  --color-search-bg: #F5F5F5;

  /* === Text Colors === */
  --color-title: #333333;
  --color-body: #212121;
  --color-body-secondary: rgba(0,0,0,0.6);
  --color-hint: #9E9E9E;
  --color-placeholder: #BDBDBD;

  /* === Status Colors === */
  --color-online: #34C759;
  --color-error: #FF4757;
  --color-success: #34C759;

  /* === Gradients === */
  --gradient-primary: linear-gradient(135deg, #7F7FD5 0%, #86A8E7 100%);
  --gradient-hero: linear-gradient(135deg, #7F7FD5 0%, #86A8E7 50%, #91EAE4 100%);
  --gradient-personalized: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
  --gradient-vip: linear-gradient(135deg, #FFD66B 0%, #FFA94D 100%);
  --gradient-gacha: linear-gradient(135deg, #FFB7C5 0%, #FFA5B5 100%);

  /* === Typography === */
  --font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-family-serif: 'Georgia', 'Noto Serif SC', serif;

  --text-xs: 10px;
  --text-sm: 11px;
  --text-base: 13px;
  --text-md: 15px;
  --text-lg: 16px;
  --text-xl: 18px;
  --text-2xl: 20px;
  --text-3xl: 24px;
  --text-4xl: 26px;
  --text-5xl: 28px;

  --leading-tight: 1.1;
  --leading-snug: 1.3;
  --leading-normal: 1.5;
  --leading-relaxed: 1.6;

  --weight-normal: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;
  --weight-extrabold: 800;
  --weight-black: 900;

  /* === Spacing === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;

  /* === Border Radius === */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-pill: 9999px;

  /* === Shadows === */
  --shadow-card: 0 8px 24px rgba(127,127,213,0.08);
  --shadow-card-hover: 0 12px 32px rgba(127,127,213,0.12);
  --shadow-button: 0 4px 16px rgba(127,127,213,0.3);
  --shadow-float: 0 8px 32px rgba(0,0,0,0.12);
  --shadow-nav: 0 -2px 16px rgba(0,0,0,0.05);
  --shadow-glow-primary: 0 0 20px rgba(127,127,213,0.25);

  /* === Motion === */
  --duration-fast: 150ms;
  --duration-normal: 300ms;
  --duration-slow: 600ms;
  --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-elastic: cubic-bezier(0.68, -0.55, 0.265, 1.55);

  /* === Avatar Ring Colors === */
  --ring-purple: linear-gradient(135deg, #7F7FD5, #f093fb);
  --ring-red-orange: linear-gradient(135deg, #FF6B6B, #FFB347);
  --ring-teal: linear-gradient(135deg, #4ECDC4, #44A08D);
  --ring-blue-purple: linear-gradient(135deg, #86A8E7, #7F7FD5);
  --ring-yellow: linear-gradient(135deg, #FFCA28, #FF8F00);
  --ring-deep-purple: linear-gradient(135deg, #AB47BC, #7B1FA2);
}

/* Dark mode overrides */
html.dark {
  --color-page-bg: #121212;
  --color-card-bg: #1E1E1E;
  --color-input-bg: #2C2C2C;
  --color-input-fill: #252525;
  --color-search-bg: #2C2C2C;
  --color-title: #E0E0E0;
  --color-body: #EEEEEE;
  --color-body-secondary: rgba(255,255,255,0.7);
  --color-hint: #757575;
  --color-placeholder: #616161;
  --shadow-card: 0 8px 24px rgba(0,0,0,0.24);
  --shadow-card-hover: 0 12px 32px rgba(0,0,0,0.32);
  --shadow-nav: 0 -2px 16px rgba(0,0,0,0.2);
}

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-secondary: var(--color-secondary);
    --color-accent: var(--color-accent);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="relative min-h-screen" style="background: var(--color-page-bg); font-family: var(--font-family);">

        <!-- AppBar -->
        <header class="sticky top-0 z-30 flex items-center justify-between px-4 py-3" style="background: var(--color-page-bg);">
            <button data-dom-id="btn-back" class="flex h-9 w-9 items-center justify-center rounded-full bg-white shadow-md" aria-label="返回">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-title)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
            </button>
            <h1 class="text-lg font-semibold" style="color: var(--color-title); font-size: var(--text-lg); font-weight: var(--weight-semibold);">发布动态</h1>
            <button class="px-5 py-2 text-sm font-semibold text-white" style="background: var(--color-primary); border-radius: 20px; font-size: var(--text-base);">发布</button>
        </header>

        <div class="px-4 pb-28">

            <!-- 日期装饰行 -->
            <div class="flex items-center gap-3 mt-4 mb-5">
                <div>
                    <span class="font-black" style="font-size: var(--text-3xl); color: var(--color-title); font-weight: var(--weight-black);">6月28日</span>
                    <span class="ml-2 font-medium" style="font-size: var(--text-sm); color: var(--color-hint); font-weight: var(--weight-medium);">星期日</span>
                </div>
                <span class="inline-flex items-center gap-1 px-3 py-1 text-xs font-medium" style="background: rgba(255,179,71,0.15); color: #FF9500; border-radius: var(--radius-pill); font-size: var(--text-sm); font-weight: var(--weight-medium);">
                    &#9728; 晴天 28&#176;C
                </span>
            </div>

            <!-- 输入区域 -->
            <textarea class="w-full resize-none bg-transparent outline-none" rows="5" placeholder="分享你的心情..." style="color: var(--color-title); font-size: var(--text-md); line-height: 1.6; font-weight: var(--weight-normal);"></textarea>

            <!-- 图片预览区 (拍立得风格) -->
            <div class="flex gap-3 mt-3 overflow-x-auto no-scrollbar pb-2">
                <div class="relative shrink-0 p-1.5 bg-white" style="border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                    <div class="w-28 h-28 flex items-center justify-center" style="background: var(--color-search-bg); border-radius: 2px;">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--color-hint)" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                    </div>
                    <button class="absolute -top-1.5 -right-1.5 flex h-5 w-5 items-center justify-center rounded-full text-white text-xs" style="background: var(--color-like-red); font-size: 10px;" aria-label="删除图片">
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M18 6L6 18M6 6l12 12"/></svg>
                    </button>
                </div>
                <div class="relative shrink-0 p-1.5 bg-white" style="border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                    <div class="w-28 h-28 flex items-center justify-center" style="background: linear-gradient(135deg, rgba(127,127,213,0.1), rgba(145,234,228,0.1)); border-radius: 2px;">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                    </div>
                    <button class="absolute -top-1.5 -right-1.5 flex h-5 w-5 items-center justify-center rounded-full text-white text-xs" style="background: var(--color-like-red); font-size: 10px;" aria-label="删除图片">
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M18 6L6 18M6 6l12 12"/></svg>
                    </button>
                </div>
                <div class="relative shrink-0 p-1.5 bg-white" style="border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                    <div class="w-28 h-28 flex items-center justify-center" style="background: linear-gradient(135deg, rgba(134,168,231,0.1), rgba(127,127,213,0.1)); border-radius: 2px;">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--color-secondary)" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                    </div>
                    <button class="absolute -top-1.5 -right-1.5 flex h-5 w-5 items-center justify-center rounded-full text-white text-xs" style="background: var(--color-like-red); font-size: 10px;" aria-label="删除图片">
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M18 6L6 18M6 6l12 12"/></svg>
                    </button>
                </div>
            </div>

            <!-- 心情选择 -->
            <div class="mt-6">
                <h2 class="mb-3 font-semibold" style="font-size: var(--text-base); color: var(--color-title); font-weight: var(--weight-semibold);">选择心情</h2>
                <div class="flex flex-wrap gap-2">
                    <span class="inline-flex items-center gap-1.5 px-4 py-2 text-sm" style="background: rgba(127,127,213,0.2); color: var(--color-primary); border-radius: var(--radius-pill); font-size: var(--text-base); font-weight: var(--weight-medium); border: 1.5px solid var(--color-primary);">
                        &#128522; 开心
                    </span>
                    <span class="inline-flex items-center gap-1.5 px-4 py-2 text-sm" style="background: transparent; color: var(--color-body-secondary); border-radius: var(--radius-pill); font-size: var(--text-base); font-weight: var(--weight-normal); border: 1px solid var(--color-placeholder);">
                        &#128151; 感动
                    </span>
                    <span class="inline-flex items-center gap-1.5 px-4 py-2 text-sm" style="background: transparent; color: var(--color-body-secondary); border-radius: var(--radius-pill); font-size: var(--text-base); font-weight: var(--weight-normal); border: 1px solid var(--color-placeholder);">
                        &#127754; 平静
                    </span>
                    <span class="inline-flex items-center gap-1.5 px-4 py-2 text-sm" style="background: transparent; color: var(--color-body-secondary); border-radius: var(--radius-pill); font-size: var(--text-base); font-weight: var(--weight-normal); border: 1px solid var(--color-placeholder);">
                        &#127881; 兴奋
                    </span>
                    <span class="inline-flex items-center gap-1.5 px-4 py-2 text-sm" style="background: transparent; color: var(--color-body-secondary); border-radius: var(--radius-pill); font-size: var(--text-base); font-weight: var(--weight-normal); border: 1px solid var(--color-placeholder);">
                        &#129300; 思考
                    </span>
                    <span class="inline-flex items-center gap-1.5 px-4 py-2 text-sm" style="background: transparent; color: var(--color-body-secondary); border-radius: var(--radius-pill); font-size: var(--text-base); font-weight: var(--weight-normal); border: 1px solid var(--color-placeholder);">
                        &#128546; 难过
                    </span>
                </div>
            </div>

            <!-- 话题标签 -->
            <div class="mt-6">
                <h2 class="mb-3 font-semibold" style="font-size: var(--text-base); color: var(--color-title); font-weight: var(--weight-semibold);">话题标签</h2>
                <div class="flex flex-wrap gap-2">
                    <span class="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm" style="background: rgba(127,127,213,0.1); color: var(--color-primary); border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: var(--weight-medium);">
                        # 日常记录
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
                    </span>
                    <span class="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm" style="background: rgba(134,168,231,0.1); color: var(--color-secondary); border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: var(--weight-medium);">
                        # 萌宠日常
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
                    </span>
                    <span class="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm" style="background: rgba(145,234,228,0.1); color: #4ECDC4; border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: var(--weight-medium);">
                        # 开心时刻
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
                    </span>
                    <span class="inline-flex items-center gap-1 px-3 py-1.5 text-sm" style="background: var(--color-search-bg); color: var(--color-hint); border-radius: var(--radius-md); font-size: var(--text-sm); border: 1px dashed var(--color-placeholder);">
                        + 添加话题
                    </span>
                </div>
            </div>

        </div>

        <!-- 底部工具栏 -->
        <div class="fixed bottom-6 left-1/2 z-30 w-auto -translate-x-1/2">
            <div class="flex items-center gap-2 px-4 py-2.5 bg-white" style="border-radius: 28px; box-shadow: 0 4px 20px rgba(127,127,213,0.2);">
                <button class="flex h-10 w-10 items-center justify-center rounded-full" style="background: var(--color-primary);" aria-label="相册">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                </button>
                <button class="flex h-10 w-10 items-center justify-center rounded-full" style="background: #34C759;" aria-label="拍摄">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                </button>
                <button class="flex h-10 w-10 items-center justify-center rounded-full" style="background: var(--color-secondary);" aria-label="位置">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                </button>
                <button class="flex h-10 w-10 items-center justify-center rounded-full" style="background: var(--color-accent);" aria-label="表情">
                    <span style="font-size: 18px;">&#128512;</span>
                </button>
                <button class="flex h-10 w-10 items-center justify-center rounded-full" style="background: var(--color-search-bg);" aria-label="更多">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-hint)" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
                </button>
            </div>
        </div>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
