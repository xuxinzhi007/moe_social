# 上传 bin/moe-social 后的二进制部署（见 deploy-agent backend_upload_binaries）
services:
  moe-social:
    image: alpine:latest
    container_name: moe-social
    working_dir: /app
    command: ["/app/moe-social", "-f", "config/config.yaml"]
    restart: always
    environment:
      MOE_LLM_BASE_URL: ${MOE_LLM_BASE_URL:-}
      MOE_LLM_API_STYLE: ${MOE_LLM_API_STYLE:-}
      MOE_LLM_MODEL: ${MOE_LLM_MODEL:-}
      MOE_LLM_API_KEY: ${MOE_LLM_API_KEY:-}
    # 必须 host：容器内 127.0.0.1:11434 才能打到宿主机上的 Ollama 反代隧道
    network_mode: host
    volumes:
      - ./bin/moe-social:/app/moe-social
      - ./api/etc:/app/api/etc
      - ./config:/app/config
      - /root/gowork/moe_images:/app/data/images
