
syntax = "proto3";

package super;

// 勿用 "path;super"：goctl 会把包前缀算成 super_super。只写路径，Go 包名仍为 super。
option go_package = "backend/rpc/pb/super";

// 用户相关消息
message User {
  string id = 1;
  string username = 2;
  string email = 3;
  string avatar = 4;
  string signature = 5;   // 个性签名
  string gender = 6;      // 性别
  string birthday = 7;    // 生日
  string created_at = 8;
  string updated_at = 9;
  bool is_vip = 10;
  string vip_expires_at = 11;
  bool auto_renew = 12;
  float balance = 13; // 钱包余额
  string inventory = 14;
  string equipped_frame_id = 15;
  string moe_no = 16;
  // 收到他人赠送礼物累计：魅力点（与礼物标价挂钩）与面值总和（展示用）
  int32 gift_charm = 17;
  double received_gift_value = 18;
  // 与 moe_no 相同，个人中心等「对外展示账号」请用本字段或 moe_no；业务主键仍为 id
  string display_user_id = 19;
  // 0=自动（YAML+VIP）；7 或 30 为用户在设置里自选的私信保留天数（仅影响新消息）
  int32 message_retention_choice = 20;
  // 绑定的企业飞书邮箱（receive_id_type=email）
  string feishu_email = 21;
  // 飞书 OAuth 显示名（通知卡片「操作者」会附带）
  string feishu_name = 22;
  // 是否已通过飞书 OAuth 绑定
  bool feishu_bound = 23;
  string role = 24; // App 用户角色 user | admin | super_admin
  // 微信 OAuth 昵称
  string wechat_nickname = 25;
  // 是否已通过微信 OAuth 绑定
  bool wechat_bound = 26;
  // 社区 AI Bot 账号（由 moe_agent_runtimes 绑定）
  bool is_bot = 27;
  string bot_agent_key = 28;
}

message FeishuAuthorizeURLReq {
  string state = 1;
}

message FeishuAuthorizeURLResp {
  string authorize_url = 1;
}

message FeishuLoginReq {
  string code = 1;
}

message FeishuLoginResp {
  User user = 1;
  string token = 2;
  bool is_new_user = 3;
}

message WechatAuthorizeURLReq {
  string state = 1;
  // website=开放平台网站应用扫码；mp=公众号网页授权（仅微信内）
  string flow = 2;
}

message WechatAuthorizeURLResp {
  string authorize_url = 1;
}

message WechatLoginReq {
  string code = 1;
  // app=移动应用 SDK；website=网站应用扫码；mp=公众号
  string flow = 2;
}

message WechatLoginResp {
  User user = 1;
  string token = 2;
  bool is_new_user = 3;
}

message BindFeishuReq {
  string user_id = 1;
  string feishu_email = 2;
}

message BindFeishuResp {
  User user = 1;
}

message UnbindFeishuReq {
  string user_id = 1;
}

message UnbindFeishuResp {
  User user = 1;
}

message SendFeishuTestCardReq {
  string user_id = 1;
}

message SendFeishuTestCardResp {}

// 用户注册请求
message RegisterReq {
  string username = 1;
  string password = 2;
  string email = 3;
}

// 用户注册响应
message RegisterResp {
  User user = 1;
  string token = 2;
}

// 用户登录请求
message LoginReq {
  string username = 1;
  string email = 2;
  string password = 3;
}

// 用户登录响应
message LoginResp {
  User user = 1;
  string token = 2;
}

message GetUserInfoReq {
  string user_id = 1;
}

message GetUserInfoResp {
  User user = 1;
}

// 获取单个用户请求
message GetUserReq {
  string user_id = 1;
}

// 获取单个用户响应
message GetUserResp {
  User user = 1;
}

// 根据邮箱获取用户请求
message GetUserByEmailReq {
  string email = 1;
}

// 根据邮箱获取用户响应
message GetUserByEmailResp {
  User user = 1;
}

// 更新用户信息请求
message UpdateUserInfoReq {
  string user_id = 1;
  string username = 2;
  string email = 3;
  string avatar = 4;
  string signature = 5;   // 个性签名
  string gender = 6;      // 性别
  string birthday = 7;    // 生日
  string inventory = 8;
  string equipped_frame_id = 9;
  bool clear_equipped_frame = 10;
  // 空=不修改。auto=恢复自动；7 / 30 为自选保存天数（写入 users.message_retention_choice）
  string message_retention = 11;
}

// 更新用户信息响应
message UpdateUserInfoResp {
  User user = 1;
}

// 更新用户密码请求
message UpdateUserPasswordReq {
  string user_id = 1;
  string old_password = 2;
  string new_password = 3;
}

// 更新用户密码响应
message UpdateUserPasswordResp {
}

// 重置用户密码请求
message ResetPasswordReq {
  string email = 1;
  string new_password = 2;
}

// 重置用户密码响应
message ResetPasswordResp {
}

// 删除用户请求
message DeleteUserReq {
  string user_id = 1;
}

// 删除用户响应
message DeleteUserResp {
}

// 更新用户VIP状态请求
message UpdateUserVipReq {
  string user_id = 1;
  bool is_vip = 2;
  string vip_expires = 3;
}

// 更新用户VIP状态响应
message UpdateUserVipResp {
  User user = 1;
}

message GetUsersReq {
  int32 page = 1;
  int32 page_size = 2;
}

message GetUsersResp {
  repeated User users = 1;
  int32 total = 2;
}

message GetUserCountReq {
}

message GetUserCountResp {
  int32 count = 1;
}

// VIP套餐相关消息
message VipPlan {
  string id = 1;
  string name = 2;
  string description = 3;
  float price = 4;
  int32 duration_days = 5;
  string created_at = 6;
  string updated_at = 7;
}

// 获取单个VIP套餐请求
