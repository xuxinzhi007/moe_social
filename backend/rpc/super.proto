message GetUserActiveVipRecordReq {
  string user_id = 1;
}

// 获取用户活跃VIP记录响应
message GetUserActiveVipRecordResp {
  VipRecord record = 1;
}

// VIP状态相关消息
message GetUserVipStatusReq {
  string user_id = 1;
}

message GetUserVipStatusResp {
  bool is_vip = 1;
  string expires_at = 2;
  bool auto_renew = 3;
}

message CheckUserVipReq {
  string user_id = 1;
}

message CheckUserVipResp {
  bool is_vip = 1;
}

message UpdateAutoRenewReq {
  string user_id = 1;
  bool auto_renew = 2;
}

message UpdateAutoRenewResp {
}

message SyncUserVipStatusReq {
  string user_id = 1;
}

message SyncUserVipStatusResp {
  bool is_vip = 1;
  string expires_at = 2;
}

// 充值请求
message RechargeReq {
  string user_id = 1;
  float amount = 2;
  string description = 3;
}

// 充值响应
message RechargeResp {
