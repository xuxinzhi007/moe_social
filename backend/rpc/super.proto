}

// 评论相关消息
message Comment {
  string id = 1;
  string post_id = 2;
  string user_id = 3;
  string user_name = 4;
  string user_avatar = 5;
  string content = 6;
  int32 likes = 7;
  bool is_liked = 8;
  string created_at = 9;
  string parent_id = 10;
  string reply_to_user_name = 11;
}

// 创建评论请求
message CreateCommentReq {
  string post_id = 1;
  string user_id = 2;
  string content = 3;
  string parent_id = 4;
}

// 创建评论响应
message CreateCommentResp {
  Comment comment = 1;
  repeated AchievementUnlock new_achievements = 2;
}

// 点赞评论请求
message LikeCommentReq {
  string comment_id = 1;
  string user_id = 2;
}

// 点赞评论响应
message LikeCommentResp {
  Comment comment = 1;
}

// 通知相关消息
message Notification {
  string id = 1;
  string user_id = 2;
  string sender_id = 3;
  string sender_name = 4;
  string sender_avatar = 5;
  int32 type = 6;
  string post_id = 7;
  string content = 8;
