  float new_balance = 2;
}

// 获取交易记录请求
message GetTransactionsReq {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

// 交易记录
message Transaction {
  string id = 1;
  string user_id = 2;
  float amount = 3;
  string type = 4;
  string status = 5;
  string description = 6;
  string created_at = 7;
}

// 交易记录响应
message GetTransactionsResp {
  repeated Transaction transactions = 1;
  int32 total = 2;
}

// 获取单个交易记录请求
message GetTransactionReq {
  string id = 1;
}

// 获取单个交易记录响应
message GetTransactionResp {
