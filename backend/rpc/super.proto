}

// 话题标签消息
message TopicTag {
  string id = 1;
  string name = 2;
  string color = 3;
  // 标签在库中的创建时间（与帖子 created_at 相同本地格式，便于 Flutter 复用解析）
  string created_at = 4;
}

// 服务定义帖子相关消息
message Post {
  string id = 1;
  string user_id = 2;
  string user_name = 3;
  string user_avatar = 4;
  string content = 5;
  repeated string images = 6;
  repeated TopicTag topic_tags = 7;
  int32 likes = 8;
  int32 comments = 9;
  bool is_liked = 10;
  string created_at = 11;
  string hand_draw_card = 12;
  string hand_draw_thumb_url = 13;
  string moderation_status = 14;
  bool author_is_bot = 15;
  string author_bot_agent_key = 16;
}

// 获取帖子列表请求
message GetPostsReq {
  int32 page = 1;
  int32 page_size = 2;
  string viewer_user_id = 3;
  // latest | hot | following（空则按 latest）
  string feed_mode = 4;
  // 按话题标签 ID 筛选（与 post_topics 关联）
  string topic_tag_id = 5;
  // 仅返回该作者发布的动态（与 feed_mode=following 互斥，优先按作者筛选）
  string author_user_id = 6;
}

// 获取帖子列表响应
message GetPostsResp {
  repeated Post posts = 1;
  int32 total = 2;
}

// 获取单个帖子请求
message GetPostReq {
  string post_id = 1;
  string viewer_user_id = 2;
}

// 获取单个帖子响应
message GetPostResp {
  Post post = 1;
}

// 创建帖子请求
message CreatePostReq {
  string user_id = 1;
  string content = 2;
  repeated string images = 3;
  repeated TopicTag topic_tags = 4;
  string hand_draw_card = 5;
  string hand_draw_thumb_url = 6;
  string mood_tag = 7;
  // 可选：创建后自动关联到该群组（需已是群成员）
  string group_id = 8;
}

// 更新帖子请求
message UpdatePostReq {
  string post_id = 1;
  string user_id = 2;
  string content = 3;
  repeated string images = 4;
  repeated TopicTag topic_tags = 5;
  string hand_draw_card = 6;
  string hand_draw_thumb_url = 7;
}

message UpdatePostResp {
  Post post = 1;
}

// 删除帖子请求
message DeletePostReq {
  string post_id = 1;
  string user_id = 2;
}

message DeletePostResp {}

// 举报帖子
message ReportPostReq {
  string post_id = 1;
  string reporter_user_id = 2;
  string reason = 3;
}

message ReportPostResp {
}

// 创建帖子响应
message CreatePostResp {
  Post post = 1;
  repeated AchievementUnlock new_achievements = 2;
}

// 点赞帖子请求
message LikePostReq {
  string post_id = 1;
  string user_id = 2;
}

// 点赞帖子响应
