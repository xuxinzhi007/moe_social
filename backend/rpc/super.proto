message GetGiftsReq {
  int32 page = 1;
  int32 page_size = 2;
  // 可选：传入则在每个 Gift 上填充 owned_quantity（背包）
  string viewer_user_id = 3;
}

message GetGiftsResp {
  repeated Gift gifts = 1;
  int32 total = 2;
}

message GetGiftReq {
  string gift_id = 1;
}

message GetGiftResp {
  bool success = 1;
  string message = 2;
  Gift gift = 3;
}

message SendGiftReq {
  string from_user_id = 1;
  string to_user_id = 2;
  string gift_id = 3;
  int32 quantity = 4;
}

message SendGiftResp {
  bool success = 1;
  string message = 2;
  GiftRecord record = 3;
  repeated AchievementUnlock new_achievements = 4;
}

message GetGiftRecordsReq {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message GetGiftRecordsResp {
  repeated GiftRecord records = 1;
  int32 total = 2;
}

message PurchaseGiftReq {
  string user_id = 1;
  string gift_id = 2;
  int32 quantity = 3;
}

message PurchaseGiftResp {
  bool success = 1;
  string message = 2;
  double new_balance = 3;
  int32 owned_quantity = 4;
  string order_no = 5;
}

message GiftPurchaseOrder {
  string id = 1;
  string user_id = 2;
  string order_no = 3;
  string gift_id = 4;
  string gift_name = 5;
  int32 quantity = 6;
  double unit_price = 7;
  double total_amount = 8;
  string pay_method = 9;
  string status = 10;
  string created_at = 11;
}

message GetGiftPurchaseOrdersReq {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message GetGiftPurchaseOrdersResp {
  repeated GiftPurchaseOrder orders = 1;
  int32 total = 2;
}
