}

message ReadNotificationReq {
  string id = 1;
  string user_id = 2;
}

message ReadNotificationResp {
}

message ReadAllNotificationsReq {
  string user_id = 1;
}

message ReadAllNotificationsResp {
}

message CreateNotificationReq {
  string user_id = 1;
  string sender_id = 2;
  int32 type = 3;
  string post_id = 4;
  string content = 5;
}

message CreateNotificationResp {
  Notification notification = 1;
}

// --- 私信持久化（private_messages）---
message PrivateMessage {
  string id = 1;
  string sender_id = 2;
  string receiver_id = 3;
  string body = 4;
  repeated string image_paths = 5;
  int32 retention_days = 6;
  string created_at = 7;
  string expires_at = 8;
  // 展示用 Moe 号（10 位）；查询入参仍用 sender_id/receiver_id 主键
  string sender_moe_no = 9;
  string receiver_moe_no = 10;
}

message SendPrivateMessageReq {
  string sender_id = 1;
  string receiver_id = 2;
  string body = 3;
  repeated string image_paths = 4;
}

message SendPrivateMessageResp {
  PrivateMessage message = 1;
}

message ListPrivateMessagesReq {
  string viewer_id = 1;
  string peer_id = 2;
  string before_id = 3;
  int32 limit = 4;
}

message ListPrivateMessagesResp {
  repeated PrivateMessage messages = 1;
  bool has_more = 2;
}

message PrivateConversation {
  string peer_id = 1;
