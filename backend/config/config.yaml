# ===== Moe Social 统一配置（可选）=====
# 说明：
# - backend/api 读 api/etc/super.yaml；Docker 用 MOE_SUPER_RPC_ENDPOINT 覆盖 RPC 地址
# - 现在 backend/api 会额外尝试读取本文件，用于覆盖部分参数（找不到会自动跳过）
# - JWT 密钥唯一配置处：auth.access_secret（也可用环境变量 MOE_AUTH_ACCESS_SECRET 覆盖）
auth:
  access_secret: "u8K9x2L1n4Q7v5Z0m3P6r9Y2b5X8j1W4"
  access_expire_seconds: 432000  # 5 天

# Moe Admin 管理后台（本地使用；与 App JWT 分离）
admin:
  jwt_secret: "moe-admin-local-jwt-change-me"
  token_expire_hours: 24
  bootstrap:
    username: "admin"
    password: "admin123"

api:
  # go-zero REST 超时（毫秒）。LLM 首次加载模型可能较慢，建议 >= 180000
  timeout_ms: 600000
  # 对外 API 根地址（与 Flutter AppConfig.productionUrl 一致；feishu.redirect_uri 留空时用于拼回调）
  public_base_url: "http://47.106.175.49:8888"
  # API→RPC 地址（可选）。Docker 推荐用 compose 环境变量 MOE_SUPER_RPC_ENDPOINT=rpc:8080；
  # 本机 go run 勿配置此项，沿用 api/etc/super.yaml 的 127.0.0.1:8080。
  # super_rpc_endpoints:
  #   - rpc:8080

# 飞书：企业自建应用机器人（非群自定义 Webhook）
# 1. 开放平台创建企业自建应用，拿到 App ID / App Secret
# 2. 开通权限：im:message、im:message:send_as_bot
# 3. 发到指定同事：receive_id_type=email，receive_id 填其企业飞书邮箱（须为本租户成员）
# 4. 发到群会话：receive_id_type=chat_id，receive_id 填 oc_xxx，且需先把机器人拉进群

feishu:
  enabled: true
  app_id: "cli_aa805993a6a3dcc4"
  app_secret: "YCNyyGx73ZWBa7S3vyjUveJq6ortsaIb"
  receive_id: "xinzhi.xu@feishu.cn"  # 企业飞书邮箱，或 chat_id / open_id 等
  receive_id_type: "email"             # email | chat_id | open_id | user_id | union_id
  # OAuth 登录（须在飞书开放平台配置相同 redirect_uri）
  # 真机连 VPS：用下方 47.106...；仅本机 Chrome 调试可改回 127.0.0.1 并同步开放平台
  redirect_uri: "http://47.106.175.49:8888/api/auth/feishu/callback"
  # redirect_uri: "http://127.0.0.1:8888/api/auth/feishu/callback"
  oauth_scope: "contact:user.email:readonly"
  # Web 跳回以 OAuth state（当前页 origin）为准；此项仅作兜底
  app_return_url: ""
  # 尝试把 OAuth 用户加入飞书通讯录（需管理员开通 contact 写权限 + 部门 ID）
  auto_add_to_directory: false
  default_department_id: ""  # 例：od-xxxxxxxx（一般不启用，用邀请链接即可）
  # 可选：企业邀请链接（管理后台 → 邀请成员 → 企业链接），供 App「申请加入企业」
  enterprise_invite_url: "https://xcnwo3uyqh3i.feishu.cn/invite/member/b1FV8k8WIKA"
  enterprise_notice: "机器人仅可向企业内成员发送通知。如需推送，可申请加入企业；不加入也可正常使用 App。"

# 微信登录（https://open.weixin.qq.com）
# - App：开放平台创建「移动应用」，填 wechat.app，包名 com.example.moe_social + 签名
# - Web/PC：开放平台创建「网站应用」，填 wechat.website，授权回调域与 redirect_uri 主机一致
# - mp（可选）：公众号网页授权，仅微信内打开 H5 时可用
# 改后须同步 VPS 的 config/config.yaml 并重启 RPC + API
wechat:
  enabled: true
  redirect_uri: "http://47.106.175.49:8888/api/auth/wechat/callback"
  # redirect_uri: "http://127.0.0.1:8888/api/auth/wechat/callback"
  app_return_url: ""
  app:
    # 正式：填开放平台「移动应用」凭证；调试可暂与 mp 相同（须与 lib/utils/wechat_config.dart 的 appId 一致）
    app_id: "wxf640612c0ad331d9"
    app_secret: "b8d8a2887474b31a66639da1a7c08fff"
  website:
    app_id: ""      # 网站应用 AppID（Web/PC 扫码登录）
    app_secret: ""
  mp:
    app_id: "wxf640612c0ad331d9"
    app_secret: "b8d8a2887474b31a66639da1a7c08fff"
  oauth_scope: "snsapi_userinfo"

