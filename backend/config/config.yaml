# 可选：覆盖 api/etc/moe.yaml 里的 Image（不配置则完全沿用 moe.yaml）。

# 图片「云图库」（文件落在 API 所在机器的 LocalDir；Flutter 连云 API 时即云上磁盘）
# 上传落盘位置由「请求打到哪台 API」决定，不是 PublicBaseUrl 决定。
# PublicBaseUrl 只影响列表/管理台拼出来的完整图片 URL。
Image:
  LocalDir: "/app/data/images"
  PublicBaseUrl: "http://47.106.175.49:8888"
  MaxBytes: 1073741824

# 仅本机 go run 后端、且要用本机磁盘存图时取消注释（与 Docker 云部署无关）：
# image:
#   local_dir: "./data/images"
#   public_base_url: "http://127.0.0.1:8888"
#   max_bytes: 1073741824

# 私信持久化 private_messages 表（保留天数在写入时按发送方 VIP 快照；见 docs/private_messages.md）
private_message:
  retention_days_default: 30   # normal 未配置时的兜底
  retention_days_normal: 7     # 非有效 VIP 的发送方
  retention_days_vip: 90       # 发送方 IsVip 且 VipEndAt 未过期
  body_max_runes: 8000
  image_paths_max: 9






# Moe Intelligence Stack v1（与 LLM 解耦；默认档位 s2 = 7B）
moe:
  enabled: true
  default_capability_tier: s2
  bot_post_daily_limit_default: 5
  # API 进程内 Bot 定时发帖（cron + smart 模式）
  bot_scheduler_enabled: true
  bot_scheduler_tick_seconds: 60
  # Memory RPG 定时入梦（consolidation）
  dream_scheduler_enabled: true
  dream_scheduler_tick_seconds: 300
  # 智能发送：LLM 判断此刻是否发帖
  bot_smart_retry_minutes: 30
  bot_smart_min_interval_hours: 2
  # Bot 发帖专用模型 ID（llama-server 的基座名，如 qwen2）；勿填酒馆「创建角色」派生模型名
  bot_post_model: "qwen2"
  # Phase 3 Sprint 1：管理台 Moe HTTP 优先走 API 进程内 MoeAdmin（仍需 RPC 处理发帖/记忆端口）
  api_in_process: true
  # FS-2：VIP 套餐 HTTP 走 API 进程内 biz（与 api_in_process 默认同开）
  vip_api_in_process: true
  user_api_in_process: true
  landing_api_in_process: true
  behavior_api_in_process: true
  post_api_in_process: true
  comment_api_in_process: true
  checkin_api_in_process: true
  achievement_api_in_process: true
  gift_api_in_process: true
  llm_api_in_process: true
  ai_api_in_process: true
  community_api_in_process: true
  chat_api_in_process: true
  admin_readonly_api_in_process: true
  # 单进程 Kratos HTTP（make moe-social）
  single_process: true
  kratos_pure_enabled: true
  kratos_admin_base_url: "http://127.0.0.1:8888"
  production:
    unified_entry: moe-social
    external_http_port: "8888"

# 用户记忆：简化版，仅使用关键词检索（云端模型质量高，无需复杂向量/图谱）
memory:
  search:
    hybrid_enabled: false
    vector_weight: 0.0
    keyword_weight: 1.0
    rerank_enabled: false
    rerank_top_k: 8
    rerank_mmr_lambda: 0.7
    graph_enabled: false
    graph_hops: 1
    graph_boost: 0.0
    graph_max_expand: 0
  embedding:
    openai_base_url: ""
    openai_api_key: ""
    openai_model: ""

