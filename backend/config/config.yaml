# 用户记忆 Phase 2：混合检索 + 多路 embedding（不偏向单一厂商，按链式回退）
memory:
  search:
    hybrid_enabled: true
    vector_weight: 0.7
    keyword_weight: 0.3
    # Phase 3：Mem0 风格 rerank + 图谱扩展
    rerank_enabled: true
    rerank_top_k: 24
    rerank_mmr_lambda: 0.7
    graph_enabled: true
    graph_hops: 1
    graph_boost: 0.35
    graph_max_expand: 6
  embedding:
    # 默认链：先 Ollama（ollama.base_url），再 OpenAI 兼容中转（需同时配置 base_url + api_key）
    ollama_model: nomic-embed-text
    openai_base_url: ""   # 例：https://api.openai.com/v1 或你的中转 /v1
    openai_api_key: ""   # 也可用环境变量 MOE_MEMORY_EMBED_API_KEY
    openai_model: text-embedding-3-small
    # 显式优先级（可选）；配置后覆盖默认链
