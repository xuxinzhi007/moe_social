    prefix: "media"                                  # 下面再按用户分 avatar / album / post / chat
    access_key: "c2RytiFZrxjm8CF4ZpPrbhBdEUR_MIb8gJKvRKpN"                                   # 留空，改用上面的环境变量
    secret_key: "rus_ItGAPWc9VQrZizz7abgBvGzhBUyQczYR4Yzv"
    private: true                                    # 空间不公开，由接口签名后再拉取
    proxy_via_api: true                              # 经接口把图转给 App，不把会过期的地址交给客户端

