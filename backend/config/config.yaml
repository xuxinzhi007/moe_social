# 私信持久化 private_messages 表（保留天数在写入时按发送方 VIP 快照；见 docs/private_messages.md）
private_message:
  retention_days_default: 30   # normal 未配置时的兜底
  retention_days_normal: 7     # 非有效 VIP 的发送方
  retention_days_vip: 90       # 发送方 IsVip 且 VipEndAt 未过期
  body_max_runes: 8000
  image_paths_max: 9






# Moe Intelligence Stack v1（与 LLM 解耦；默认档位 s2 = 7B）
moe:
  enabled: true
  default_capability_tier: s2
  bot_post_daily_limit_default: 5
  # API 进程内 Bot 定时发帖（cron + smart 模式）
  bot_scheduler_enabled: true
  bot_scheduler_tick_seconds: 60
  # 智能发送：LLM 判断此刻是否发帖
  bot_smart_retry_minutes: 30
  bot_smart_min_interval_hours: 2
  # Bot 发帖专用模型 ID（llama-server 的基座名，如 qwen2）；勿填酒馆「创建角色」派生模型名
  bot_post_model: "qwen2"
  # Phase 3 Sprint 1：管理台 Moe HTTP 优先走 API 进程内 MoeAdmin（仍需 RPC 处理发帖/记忆端口）
  api_in_process: true
  # FS-2：VIP 套餐 HTTP 走 API 进程内 biz（与 api_in_process 默认同开）
  vip_api_in_process: true
  user_api_in_process: true
  landing_api_in_process: true
  behavior_api_in_process: true
  post_api_in_process: true
  comment_api_in_process: true
  checkin_api_in_process: true
  achievement_api_in_process: true
  gift_api_in_process: true
  llm_api_in_process: true
  community_api_in_process: true
  admin_readonly_api_in_process: true
  # 在 RPC :8080 同时注册 moe.v1.MoeAdmin gRPC（与 super.Super 并存）
  register_moe_grpc: true
  # API Admin Moe 在无 api_in_process 时优先走 moe gRPC（否则 super Admin*）
  use_moe_grpc: true
  # 单进程：make moe-social 时为 true；与 api_in_process 搭配，Moe Admin 全走进程内分层
  single_process: false
  # Phase 3 纯 Kratos 灰度：:8888 Admin 的 ListRuntimes / GetBrainPipeline 转发到 moe-kratos HTTP
  kratos_admin_http_enabled: false
  kratos_admin_base_url: "http://127.0.0.1:19032"
  # Phase 4 试点进程默认值（cmd/moe-kratos；CLI 参数可覆盖）
  # 生产对外端口不变：Flutter / moe-admin 仍 :8888（由 moe-social / go-zero API 提供）
  production:
    unified_entry: moe-social
    external_http_port: "8888"
    internal_grpc_port: "8080"
    pilot_http_port: "19032"
    pilot_grpc_port: "19031"
  pilot:
    grpc_addr: ":19031"
    http_addr: ":19032"
    super_rpc_endpoint: ""
    vip_admin_read_enabled: true

# 用户记忆 Phase 2：混合检索 + 多路 embedding（不偏向单一厂商，按链式回退）
memory:
  search:
    hybrid_enabled: true
    vector_weight: 0.7
    keyword_weight: 0.3
    # Phase 3：Mem0 风格 rerank + 图谱扩展
    rerank_enabled: true
    rerank_top_k: 24
    rerank_mmr_lambda: 0.7
    graph_enabled: true
    graph_hops: 1
    graph_boost: 0.35
    graph_max_expand: 6
  embedding:
    # 默认链：先本机 llama.cpp（/v1/embeddings），再 OpenAI 兼容中转
    openai_base_url: "http://127.0.0.1:6633"
    openai_api_key: "local"
    openai_model: ""
    # 遗留 Ollama embedding（已废弃）
    # ollama_model: nomic-embed-text
    # providers:
    #   - type: openai_compatible
    #     base_url: "http://127.0.0.1:6633"
    #     api_key: "local"
    #     model: ""
    #     priority: 1
    #   - type: openai_compatible
    #     base_url: "https://your-relay/v1"
    #     api_key_env: MOE_MEMORY_EMBED_API_KEY
    #     model: text-embedding-3-small
