# 微信登录（https://open.weixin.qq.com）
# - App：开放平台创建「移动应用」，填 wechat.app，包名 com.example.moe_social + 签名
# - Web/PC：开放平台创建「网站应用」，填 wechat.website，授权回调域与 redirect_uri 主机一致
# - mp（可选）：公众号网页授权，仅微信内打开 H5 时可用
# 改后须同步 VPS 的 config/config.yaml 并重启 RPC + API
wechat:
  enabled: true
  redirect_uri: ""
  # redirect_uri: "http://127.0.0.1:8888/api/auth/wechat/callback"
  app:
    # 开放平台「Moe Social Dev」移动应用（须与 lib/utils/wechat_config.dart appId 一致）
    app_id: "wx67e8f053879adcc8"
    app_secret: "54b017a98b99db757be90a19af72163a"
  website:
    app_id: ""      # 网站应用 AppID（Web/PC 扫码登录，与移动应用不同 ID）
    app_secret: ""
  mp:
    app_id: ""
    app_secret: ""
  oauth_scope: "snsapi_userinfo"

# 第三方登录（飞书 / 微信）授权事务
#
# allowed_return_urls 是**精确**回跳白名单：授权成功后服务端只会 302 到这份列表里的地址，
# 客户端提交的 return_url 必须与其中一项完全相等（scheme/host/port/path 全等，不接受
# userinfo、query、fragment）。列表里的每一项同样要过校验，写错就登录不了，不会静默放行。
#
# ⚠️ 别把它放宽成「信任 API origin」「信任任意 localhost / 局域网 / 隧道域名」，也别退回
#    「拿 state 当回跳地址」的旧协议 —— 那正是开放重定向：攻击者把 return_url 指向自己的
#    站点，服务端就会把用户的授权码 302 送过去，进而接管账号。
#
# 换开发机 / 换隧道：把新地址加进这份列表后重启服务。Web 端调试示例：
#   - "http://localhost:8080"          # flutter run -d web-server
#   - "http://192.168.124.36:8080"     # 局域网真机访问 Web 版
oauth:
  allowed_return_urls:
    # App 原生授权回跳（lib/utils/oauth_flow_helper.dart 里的两个常量）
    - "moesocial://feishu/oauth"
    - "moesocial://wechat/oauth"
  # 授权事务（服务端 state）有效期，秒：用户可能停在供应商页面，或切去飞书/微信 App 再回来
  auth_ttl_seconds: 600
  # 回调签发的一次性 ticket 有效期，秒：只用于把 302 落地和紧随其后的 login 接上，
  # 窗口越短重放面越小，调大没有好处
  ticket_ttl_seconds: 60
  # 内存中并存的授权事务上限，满时淘汰最早到期的一条（无 DB / Redis，进程重启即全部失效）
  max_pending_auths: 4096

# 统一 LLM 推理配置（Moe Bot、Companion、记忆共用）。
# provider 仅用于说明部署方，真正决定协议的是 api_style：
#   ollama -> 原生 Ollama /api/chat（通常端口 11434）
#   openai -> OpenAI 兼容 /v1/chat/completions（llama.cpp/llama-server 等）
# base_url 必须是后端进程可访问的地址，不是 Flutter 客户端地址。
llm_inference:
  model_management:
    user_quota: 3
    global_quota: 12
    write_concurrency: 1
    model_sync_timeout_seconds: 120
    allowed_base_models: [] # 空列表仅允许当前默认模型，不代表允许所有模型。
  provider: ollama
  base_url: "http://192.168.124.77:11434"
  api_style: ollama
  timeout_seconds: 300
  memory_model: "qwen2.5:3b-instruct"
  api_key: ""
  # 文字游戏可使用独立推理端点；未填写时复用上面的统一端点。
  game_base_url: "http://127.0.0.1:6633"
  # 留空则自动读取端点模型列表中的第一个模型
  game_model: ""
  # narrator=Go管世界+模型只写叙事(0.5B~3B)；agent=模型调world_*工具(7B+)
  game_llm_mode: "narrator"
  # 上下文长度（DeepSeek-chat 支持 32K）
  context_tokens: 32768

