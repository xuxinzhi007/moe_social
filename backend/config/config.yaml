# 可选：覆盖 api/etc/super.yaml 里的 Image（不配置则完全沿用 super.yaml）。

# 图片“云空间”（实际落到服务端本地目录）
Image:
  # 服务端机器的本地目录（与 docker-compose 挂载路径一致）
  LocalDir: "/app/data/images"
  # 对外访问地址（用于拼接图片 url；cpolar/服务器域名放这里）
  # 建议留空：后端会根据本次请求的 Host 自动拼接（cpolar 域名变了也不用改配置）
  PublicBaseUrl: ""
  # 1GB = 1073741824（0 表示不限制/不展示容量）
  MaxBytes: 1073741824


# 本地开发示例（取消注释并改成你的路径即可）：
# image:
#   local_dir: "/Users/you/moe_social_data/images"
#   public_base_url: ""   # 空则按请求 Host 自动拼图片 URL
#   max_bytes: 1073741824

# 私信持久化 private_messages 表（保留天数在写入时按发送方 VIP 快照；见 docs/private_messages.md）
private_message:
  retention_days_default: 30   # normal 未配置时的兜底
  retention_days_normal: 7     # 非有效 VIP 的发送方
  retention_days_vip: 90       # 发送方 IsVip 且 VipEndAt 未过期
  body_max_runes: 8000
  image_paths_max: 9






# 用户记忆 Phase 2：混合检索 + 多路 embedding（不偏向单一厂商，按链式回退）
memory:
  search:
    hybrid_enabled: true
    vector_weight: 0.7
    keyword_weight: 0.3
    # Phase 3：Mem0 风格 rerank + 图谱扩展
    rerank_enabled: true
    rerank_top_k: 24
    rerank_mmr_lambda: 0.7
    graph_enabled: true
    graph_hops: 1
    graph_boost: 0.35
    graph_max_expand: 6
  embedding:
    # 默认链：先 Ollama（ollama.base_url），再 OpenAI 兼容中转（需同时配置 base_url + api_key）
    ollama_model: nomic-embed-text
    openai_base_url: ""   # 例：https://api.openai.com/v1 或你的中转 /v1
    openai_api_key: ""   # 也可用环境变量 MOE_MEMORY_EMBED_API_KEY
    openai_model: text-embedding-3-small
    # 显式优先级（可选）；配置后覆盖默认链
    # providers:
    #   - type: ollama
    #     base_url: "http://127.0.0.1:11434"
    #     model: nomic-embed-text
    #     priority: 1
    #   - type: openai_compatible
    #     base_url: "https://your-relay/v1"
    #     api_key_env: MOE_MEMORY_EMBED_API_KEY
    #     model: text-embedding-3-small
    #     priority: 2

