# 后端 /api/llm/* 转发的本地推理（默认 llama-server OpenAI 兼容，端口 6633）
llm_inference:
  base_url: "http://127.0.0.1:6633"
  api_style: openai
  timeout_seconds: 300
  memory_model: "qwen2"
  # 当 llama-server 未开启 /props 时的上下文 token 兜底（可与 --ctx-size 一致）
  context_tokens: 8192

# 手机 App 可下载的离线 GGUF（文件放 storage_dir，勿提交大文件进 Git）
