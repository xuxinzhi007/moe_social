moe:
  single_process: true      # 单进程 Kratos HTTP 总闸（各域 *_api_in_process 默认继承此值）
  api_in_process: true
  life_engine_enabled: true
  bot_post_model: "qwen2"
  bot_scheduler_enabled: true
  bot_scheduler_tick_seconds: 60
  dream_scheduler_enabled: true
  dream_scheduler_tick_seconds: 300
  bot_smart_retry_minutes: 30
  bot_smart_min_interval_hours: 0
  life_tick_seconds: 300    # 数字生命世界 tick 间隔（秒）
  life_flush_seconds: 300   # 数字生命状态落盘间隔（秒）
  world_tick_seconds: 45    # 文字游戏后台世界时钟（秒）
