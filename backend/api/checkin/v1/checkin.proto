syntax = "proto3";

package checkin.v1;

import "google/api/annotations.proto";

option go_package = "backend/api/checkin/v1;checkinv1";

// Checkin — 域 gRPC SSOT（P4-C；与 Super 并存）。
// HTTP: POST /api/user/:user_id/check-in
// HTTP: GET  /api/user/:user_id/level
// HTTP: GET  /api/user/:user_id/check-in/status
// HTTP: GET  /api/user/:user_id/check-in/history
// HTTP: GET  /api/user/:user_id/exp/logs

message UserLevelInfo {
  int32 level = 1;
  int32 experience = 2;
  int32 total_exp = 3;
  int32 next_level_exp = 4;
  string level_title = 5;
  string badge_url = 6;
  double progress = 7;
}

message CheckInStatus {
  bool has_checked_today = 1;
  int32 consecutive_days = 2;
  int32 today_reward = 3;
  int32 next_day_reward = 4;
  bool can_check_in = 5;
}

message CheckInRecord {
  string check_in_date = 1;
  int32 consecutive_days = 2;
  int32 exp_reward = 3;
  bool is_special_reward = 4;
  string special_reward_desc = 5;
}

message ExpLogRecord {
  string id = 1;
  int32 exp_change = 2;
  string source = 3;
  string description = 4;
  string created_at = 5;
}

message AchievementUnlock {
  string badge_id = 1;
  string name = 2;
  int32 exp_granted = 3;
  bool level_up = 4;
  int32 new_level = 5;
}

message CheckInRequest {
  string user_id = 1;
}

message CheckInReply {
  int32 exp_gained = 1;
  int32 new_level = 2;
  int32 consecutive_days = 3;
  bool level_up = 4;
  string special_reward = 5;
  repeated AchievementUnlock new_achievements = 6;
}

message GetUserLevelRequest {
  string user_id = 1;
}

message GetUserLevelReply {
  UserLevelInfo level_info = 1;
}

message GetCheckInStatusRequest {
  string user_id = 1;
}

message GetCheckInStatusReply {
  CheckInStatus status = 1;
}

message GetCheckInHistoryRequest {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message GetCheckInHistoryReply {
  repeated CheckInRecord records = 1;
  int32 total = 2;
}

message GetExpLogsRequest {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message GetExpLogsReply {
  repeated ExpLogRecord logs = 1;
  int32 total = 2;
}

// 每日活跃经验（发帖/浏览，各每天最多一次；服务端按 exp_log 去重）
message ClaimDailyExpRequest {
  string user_id = 1;
  // browse：浏览动态；post 仅服务端发帖流程调用，客户端请传 browse
  string action = 2;
}

message ClaimDailyExpReply {
  bool granted = 1;
  int32 exp_gained = 2;
  bool level_up = 3;
  int32 new_level = 4;
}

service Checkin {
  rpc CheckIn(CheckInRequest) returns (CheckInReply) {
    option (google.api.http) = { post: "/api/user/{user_id}/check-in" body: "*" };
  }
  rpc GetUserLevel(GetUserLevelRequest) returns (GetUserLevelReply) {
    option (google.api.http) = { get: "/api/user/{user_id}/level" };
  }
  rpc GetCheckInStatus(GetCheckInStatusRequest) returns (GetCheckInStatusReply) {
    option (google.api.http) = { get: "/api/user/{user_id}/check-in/status" };
  }
  rpc GetCheckInHistory(GetCheckInHistoryRequest) returns (GetCheckInHistoryReply) {
    option (google.api.http) = { get: "/api/user/{user_id}/check-in/history" };
  }
  rpc GetExpLogs(GetExpLogsRequest) returns (GetExpLogsReply) {
    option (google.api.http) = { get: "/api/user/{user_id}/exp/logs" };
  }
  rpc ClaimDailyExp(ClaimDailyExpRequest) returns (ClaimDailyExpReply) {
    option (google.api.http) = { post: "/api/user/{user_id}/daily-exp" body: "*" };
  }
}
