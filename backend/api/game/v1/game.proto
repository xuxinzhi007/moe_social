syntax = "proto3";

package game.v1;

import "google/api/annotations.proto";

option go_package = "backend/api/game/v1;gamev1";

message GameNarrativeLine {
  string type = 1;
  string content = 2;
  string name = 3;
}

message GameNpc {
  uint64 id = 1;
  string name = 2;
  string persona = 3;
  int32 favorability = 4;
}

message GameItem {
  uint64 id = 1;
  string name = 2;
  string description = 3;
  bool in_inventory = 4;
}

message GameScene {
  uint64 id = 1;
  string name = 2;
  string description = 3;
  repeated string exits = 4;
}

message InitGameSessionRequest {
  string user_id = 1;
  bool force_new = 2;
}

message InitGameSessionReply {
  uint64 session_id = 1;
  GameScene scene = 2;
  repeated GameNpc npcs = 3;
  repeated GameNarrativeLine opening = 4;
  string game_time = 5;
  int32 overall_favorability = 6;
  repeated GameNarrativeLine history = 7;
  string player_focus = 8;
  bool llm_online = 9;
  repeated GameItem inventory = 10;
  repeated string visited_scenes = 11;
}

message ActRequest {
  string user_id = 1;
  uint64 session_id = 2;
  string action = 3;
}

message ActReply {
  repeated GameNarrativeLine narrative = 1;
  string location = 2;
  string game_time = 3;
  int32 overall_favorability = 4;
  string player_focus = 5;
  string narrative_source = 6;
  bool llm_online = 7;
  repeated string suggested_actions = 8;
  repeated GameItem inventory = 9;
  repeated GameNpc npcs = 10;
}

message GetGameStateRequest {
  string user_id = 1;
  uint64 session_id = 2;
}

message GetGameStateReply {
  uint64 session_id = 1;
  GameScene scene = 2;
  repeated GameNpc npcs = 3;
  string game_time = 4;
  int32 overall_favorability = 5;
  string flags_json = 6;
  string player_focus = 7;
  repeated GameItem inventory = 8;
  repeated string visited_scenes = 9;
  repeated string story_arc_titles = 10;
}

// --- 存档系统 ---

message SaveSlotInfo {
  uint32 slot_index = 1;
  string label = 2;
  int32 turn_count = 3;
  string scene_name = 4;
  string updated_at = 5;
}

message SaveGameRequest {
  string user_id = 1;
  uint64 session_id = 2;
  uint32 slot_index = 3;
  string label = 4;
}

message SaveGameReply {
  bool success = 1;
  SaveSlotInfo slot = 2;
}

message LoadGameRequest {
  string user_id = 1;
  uint32 slot_index = 2;
}

message LoadGameReply {
  uint64 session_id = 1;
  string scene_name = 2;
  int32 turn_count = 3;
  string label = 4;
}

message ListSaveSlotsRequest {
  string user_id = 1;
}

message ListSaveSlotsReply {
  repeated SaveSlotInfo slots = 1;
}

message DeleteSaveSlotRequest {
  string user_id = 1;
  uint32 slot_index = 2;
}

message DeleteSaveSlotReply {
  bool success = 1;
}

service Game {
  rpc InitGameSession(InitGameSessionRequest) returns (InitGameSessionReply) {
    option (google.api.http) = { post: "/api/user/{user_id}/game/init" body: "*" };
  }
  rpc Act(ActRequest) returns (ActReply) {
    option (google.api.http) = { post: "/api/user/{user_id}/game/act" body: "*" };
  }
  rpc GetGameState(GetGameStateRequest) returns (GetGameStateReply) {
    option (google.api.http) = { get: "/api/user/{user_id}/game/state" };
  }
  rpc SaveGame(SaveGameRequest) returns (SaveGameReply) {
    option (google.api.http) = { post: "/api/user/{user_id}/game/save" body: "*" };
  }
  rpc LoadGame(LoadGameRequest) returns (LoadGameReply) {
    option (google.api.http) = { post: "/api/user/{user_id}/game/load" body: "*" };
  }
  rpc ListSaveSlots(ListSaveSlotsRequest) returns (ListSaveSlotsReply) {
    option (google.api.http) = { get: "/api/user/{user_id}/game/slots" };
  }
  rpc DeleteSaveSlot(DeleteSaveSlotRequest) returns (DeleteSaveSlotReply) {
    option (google.api.http) = { delete: "/api/user/{user_id}/game/slots/{slot_index}" };
  }
}
