# PK-13 结构片段（SSOT：config/config.yaml）。改端口/鉴权/LLM 请改 config.yaml。
Name: moe-social
Host: 0.0.0.0
Port: 8888
Timeout: 600000

Auth:
  # 由 backend/config/config.yaml 的 auth.* 覆盖；生产可用 MOE_AUTH_ACCESS_SECRET 环境变量
  AccessSecret: ""
  AccessExpire: 432000

Agora:
  AppId: "40f005107bf94a8fb09a17aabdcdf329"
  AppCertificate: "c5282c8b440342b78e767a7e86b99107"

# 本地推理（llama-server）；详细地址由 backend/config/config.yaml 的 llm_inference 覆盖
LLMInference:
  BaseUrl: http://127.0.0.1:6633
  ApiStyle: openai
  TimeoutSeconds: 300
  # 可选：用于总结和记忆提取的模型，不填则默认使用聊天时指定的模型
  MemoryModel: ""
  # 可选：用于「对话总结」的系统提示词，不填则使用内置中文总结提示
  MemorySummaryPrompt: ""
  # 可选：用于「记忆抽取」的系统提示词，不填则使用内置中文抽取提示
  MemoryExtractPrompt: ""

# 可选：手机离线模型服务端镜像（主路径为 App 从 Hugging Face 直下；此处仅 catalog 合并用）
# 详细项由 backend/config/config.yaml 的 local_models 覆盖
LocalModels:
  StorageDir: ""
  Catalog: []

# 图片“云空间”（实际落到服务端本地目录）
Image:
  # 服务端机器的本地目录（与 docker-compose 挂载路径一致）
  LocalDir: "/app/data/images"
  # 对外访问地址（用于拼接图片 url；cpolar/服务器域名放这里）
  # 建议留空：后端会根据本次请求的 Host 自动拼接（cpolar 域名变了也不用改配置）
  PublicBaseUrl: ""
  # 1GB = 1073741824（0 表示不限制/不展示容量）
  MaxBytes: 1073741824
