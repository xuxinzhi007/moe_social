syntax = "proto3";

package chat.v1;

import "google/api/annotations.proto";

option go_package = "backend/api/chat/v1;chatv1";

// PrivateMessageService — 私信域 gRPC SSOT（P4-C；与 Super 并存）。

message PrivateMessage {
  string id = 1;
  string sender_id = 2;
  string receiver_id = 3;
  string body = 4;
  repeated string image_paths = 5;
  int32 retention_days = 6;
  string created_at = 7;
  string expires_at = 8;
  string sender_moe_no = 9;
  string receiver_moe_no = 10;
}

message SendPrivateMessageRequest {
  string sender_id = 1;
  string receiver_id = 2;
  string body = 3;
  repeated string image_paths = 4;
}

message SendPrivateMessageReply {
  PrivateMessage message = 1;
}

message ListPrivateMessagesRequest {
  string viewer_id = 1;
  string peer_id = 2;
  string before_id = 3;
  int32 limit = 4;
}

message ListPrivateMessagesReply {
  repeated PrivateMessage messages = 1;
  bool has_more = 2;
}

message PrivateConversation {
  string peer_id = 1;
  string peer_name = 2;
  string peer_avatar = 3;
  string peer_moe_no = 4;
  string peer_display_user_id = 5;
  PrivateMessage last_message = 6;
  int32 unread_count = 7;
}

message ListPrivateConversationsRequest {
  string viewer_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListPrivateConversationsReply {
  repeated PrivateConversation conversations = 1;
  int32 total = 2;
  int32 limit = 3;
  int32 offset = 4;
  bool has_more = 5;
}

message BroadcastPushNotificationReq {
  string type = 1;
  string data_json = 2;
}

message BroadcastPushNotificationResp {}

message SendPushNotificationReq {
  string user_id = 1;
  string type = 2;
  string data_json = 3;
}

message SendPushNotificationResp {
  bool delivered = 1;
}

message SendBatchPushNotificationReq {
  repeated string user_ids = 1;
  string type = 2;
  string data_json = 3;
}

message SendBatchPushNotificationResp {}

service PushNotificationService {
  rpc BroadcastPushNotification(BroadcastPushNotificationReq) returns (BroadcastPushNotificationResp) {
    option (google.api.http) = {
      post: "/api/notification/broadcast"
      body: "*"
    };
  }
  rpc SendPushNotification(SendPushNotificationReq) returns (SendPushNotificationResp) {
    option (google.api.http) = { post: "/api/notification/send" body: "*" };
  }
  rpc SendBatchPushNotification(SendBatchPushNotificationReq) returns (SendBatchPushNotificationResp) {
    option (google.api.http) = {
      post: "/api/notification/send-batch"
      body: "*"
    };
  }
}

service PrivateMessageService {
  rpc SendPrivateMessage(SendPrivateMessageRequest) returns (SendPrivateMessageReply) {
    option (google.api.http) = { post: "/api/private-messages" body: "*" };
  }
  rpc ListPrivateMessages(ListPrivateMessagesRequest) returns (ListPrivateMessagesReply) {
    option (google.api.http) = { get: "/api/private-messages" };
  }
  rpc ListPrivateConversations(ListPrivateConversationsRequest) returns (ListPrivateConversationsReply) {
    option (google.api.http) = { get: "/api/private-messages/conversations" };
  }
}
