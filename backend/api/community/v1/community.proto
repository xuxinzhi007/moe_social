syntax = "proto3";

package community.v1;

option go_package = "backend/api/community/v1;communityv1";

import "api/post/v1/post.proto";
import "google/api/annotations.proto";

// Community — 域契约 SSOT（P6）；HTTP: /api/community/groups/*

message Group {
  uint64 id = 1;
  string name = 2;
  string description = 3;
  string avatar = 4;
  string cover = 5;
  uint64 creator_id = 6;
  string creator_name = 7;
  int32 member_count = 8;
  bool is_public = 9;
  string status = 10;
  string created_at = 11;
  bool is_joined = 12;
  string user_role = 13;
}

message GroupMember {
  uint64 id = 1;
  uint64 group_id = 2;
  uint64 user_id = 3;
  string user_name = 4;
  string user_avatar = 5;
  string role = 6;
  string join_at = 7;
  string created_at = 8;
}

message GroupPost {
  uint64 id = 1;
  uint64 group_id = 2;
  uint64 post_id = 3;
  post.v1.Post post = 4;
  string created_at = 5;
}

message GetGroupsRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
  bool is_public = 4;
  string user_id = 5;
}

message GetGroupsReply {
  repeated Group groups = 1;
  int32 total = 2;
}

message GetGroupRequest {
  string group_id = 1;
  string user_id = 2;
}

message GetGroupReply {
  bool success = 1;
  string message = 2;
  Group group = 3;
}

message CreateGroupRequest {
  string name = 1;
  string description = 2;
  string avatar = 3;
  string cover = 4;
  string user_id = 5;
  bool is_public = 6;
}

message CreateGroupReply {
  bool success = 1;
  string message = 2;
  Group group = 3;
}

message UpdateGroupRequest {
  string group_id = 1;
  string name = 2;
  string description = 3;
  string avatar = 4;
  string cover = 5;
  bool is_public = 6;
}

message UpdateGroupReply {
  bool success = 1;
  string message = 2;
  Group group = 3;
}

message DeleteGroupRequest {
  string group_id = 1;
  string user_id = 2;
}

message DeleteGroupReply {
  bool success = 1;
  string message = 2;
}

message JoinGroupRequest {
  string group_id = 1;
  string user_id = 2;
}

message JoinGroupReply {
  bool success = 1;
  string message = 2;
}

message LeaveGroupRequest {
  string group_id = 1;
  string user_id = 2;
}

message LeaveGroupReply {
  bool success = 1;
  string message = 2;
}

message GetGroupMembersRequest {
  string group_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message GetGroupMembersReply {
  repeated GroupMember members = 1;
  int32 total = 2;
}

message GetUserGroupsRequest {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message GetUserGroupsReply {
  repeated Group groups = 1;
  int32 total = 2;
}

message CreateGroupPostRequest {
  string group_id = 1;
  string post_id = 2;
  string user_id = 3;
}

message CreateGroupPostReply {
  bool success = 1;
  string message = 2;
  GroupPost group_post = 3;
}

message GetGroupPostsRequest {
  string group_id = 1;
  int32 page = 2;
  int32 page_size = 3;
  string user_id = 4;
}

message GetGroupPostsReply {
  repeated GroupPost posts = 1;
  int32 total = 2;
}

service Community {
  rpc GetGroups(GetGroupsRequest) returns (GetGroupsReply) {
    option (google.api.http) = { get: "/api/community/groups" };
  }
  rpc GetGroup(GetGroupRequest) returns (GetGroupReply) {
    option (google.api.http) = { get: "/api/community/groups/{group_id}" };
  }
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupReply) {
    option (google.api.http) = { post: "/api/community/groups" body: "*" };
  }
  rpc JoinGroup(JoinGroupRequest) returns (JoinGroupReply) {
    option (google.api.http) = { post: "/api/community/groups/{group_id}/join" body: "*" };
  }
}
