syntax = "proto3";

package community.v1;

option go_package = "backend/api/community/v1;communityv1";

// Community — 域 gRPC SSOT（P4-C；与 Super 并存）。
// HTTP: /api/community/groups/*

message Group {
  uint64 id = 1;
  string name = 2;
  string description = 3;
  string avatar = 4;
  string cover = 5;
  uint64 creator_id = 6;
  string creator_name = 7;
  int32 member_count = 8;
  bool is_public = 9;
  string status = 10;
  string created_at = 11;
  bool is_joined = 12;
  string user_role = 13;
}

message GetGroupsRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
  bool is_public = 4;
  string user_id = 5;
}

message GetGroupsReply {
  repeated Group groups = 1;
  int32 total = 2;
}

message GetGroupRequest {
  string group_id = 1;
  string user_id = 2;
}

message GetGroupReply {
  bool success = 1;
  string message = 2;
  Group group = 3;
}

message CreateGroupRequest {
  string name = 1;
  string description = 2;
  string avatar = 3;
  string cover = 4;
  string user_id = 5;
  bool is_public = 6;
}

message CreateGroupReply {
  bool success = 1;
  string message = 2;
  Group group = 3;
}

message JoinGroupRequest {
  string group_id = 1;
  string user_id = 2;
}

message JoinGroupReply {
  bool success = 1;
  string message = 2;
}

service Community {
  rpc GetGroups(GetGroupsRequest) returns (GetGroupsReply);
  rpc GetGroup(GetGroupRequest) returns (GetGroupReply);
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupReply);
  rpc JoinGroup(JoinGroupRequest) returns (JoinGroupReply);
}
