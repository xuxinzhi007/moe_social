syntax = "proto3";

package landing.v1;

import "google/api/annotations.proto";

option go_package = "backend/api/landing/v1;landingv1";

// Landing — 域 gRPC SSOT（P4-C 试点；与 Super 并存，Super 仍保留兼容 RPC）。
// HTTP: POST /api/landing/feedback

message SubmitLandingFeedbackRequest {
  string email = 1;
  string category = 2;
  string content = 3;
  string source = 4;
  string client_ip = 5;
  string user_agent = 6;
}

message SubmitLandingFeedbackReply {
  uint64 id = 1;
}

service Landing {
  rpc SubmitLandingFeedback(SubmitLandingFeedbackRequest) returns (SubmitLandingFeedbackReply) {
    option (google.api.http) = { post: "/api/landing/feedback" body: "*" };
  }
}
