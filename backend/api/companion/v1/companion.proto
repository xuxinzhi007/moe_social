syntax = "proto3";

package companion.v1;

import "google/api/annotations.proto";

option go_package = "backend/api/companion/v1;companionv1";

// Companion — AI 伙伴 HTTP 契约（灵魂层后端 API）。

// ── 公共 message ──

message CompanionProfileMsg {
  string name = 1;
  string emoji = 2;
  string persona = 3;
  repeated string personality_traits = 4;
  string greeting_style = 5;
  int32 relationship_level = 6;
  double intimacy_score = 7;
  string system_prompt_override = 8;
  string agent_id = 9;
  int32 life_entity_id = 10;
  // 关系层头像 URL（用户自定义）；空则前端回退 emoji。与世界居民形象分离。
  string avatar_url = 11;
  // 世界绑定状态：unbound | bound_ok | bound_missing（已绑定但居民不在舞台，不解绑）。
  string world_bind_status = 12;
}

message CompanionProactiveSettingsMsg {
  bool enabled = 1;
  int32 daily_limit = 2;
  int32 quiet_start = 3;
  int32 quiet_end = 4;
  int32 timezone_offset = 5;
}

message CommunityIdentityMsg {
  string user_id = 1;
  string user_name = 2;
  string user_avatar = 3;
  string agent_id = 4;
  bool author_is_bot = 5;
  string author_bot_agent_key = 6;
}

message CompanionStateMsg {
  // 人格化表达（直接给前端展示）
  string mood_thought = 1;
  string activity_label = 2;
  string greeting = 3;
  // 动态（类朋友圈）
  repeated CompanionMomentMsg moments = 4;
  // 原始数值（高级展示用）
  double mood = 10;
  double hunger = 11;
  double energy = 12;
  // 绑定居民是否在舞台上存活；false 时 moments 仍可来自历史事件日志。
  bool entity_alive = 13;
  // 与 Profile.world_bind_status 对齐，便于 state 单接口刷新 UI。
  string world_bind_status = 14;
}

message CompanionMomentMsg {
  string text = 1;
  string icon = 2;
  string time_label = 3;
}

message CompanionMemoryMsg {
  uint64 id = 1;
  string memory_type = 2;
  string content = 3;
  int32 importance = 4;
  string created_at = 5;
  // 置顶：列表靠前；置顶时服务端会取消过期（永久保留）。
  bool pinned = 6;
  // 用户已确认：表示用户检查过这条记忆。
  bool user_confirmed = 7;
  string confirmed_at = 8;
  string memory_key = 9;
  double confidence = 10;
}

message CompanionMemoryConflictMsg {
  uint64 id = 1;
  uint64 memory_id = 2;
  string memory_type = 3;
  string memory_key = 4;
  string candidate_content = 5;
  double confidence = 6;
  string status = 7;
  string created_at = 8;
  string resolved_at = 9;
}

message CompanionChatLogMsg {
  uint64 id = 1;
  string role = 2;
  string content = 3;
  string created_at = 4;
}

message CompanionRelationshipEventMsg {
  uint64 id = 1;
  string event_type = 2;
  string title = 3;
  string content = 4;
  int32 relationship_level = 5;
  double intimacy_score = 6;
  string created_at = 7;
}

message CompanionEventMsg {
  uint64 id = 1;
  string event_type = 2;
  string source_domain = 3;
  uint64 source_id = 4;
  string dedupe_key = 5;
  string payload_json = 6;
  string visibility = 7;
  string sensitivity = 8;
  double relationship_delta = 9;
  string occurred_at = 10;
  string created_at = 11;
}

// ── Request / Reply ──

message GetProfileRequest {}

message GetProfileReply {
  CompanionProfileMsg profile = 1;
}

message GetCommunityIdentityRequest {}

message GetCommunityIdentityReply {
  CommunityIdentityMsg identity = 1;
}

message UpsertProfileRequest {
  string name = 1;
  string emoji = 2;
  string persona = 3;
  repeated string personality_traits = 4;
  string greeting_style = 5;
  string system_prompt_override = 6;
  string agent_id = 7;
  int32 life_entity_id = 8;
  string avatar_url = 9;
}

message UpsertProfileReply {
  CompanionProfileMsg profile = 1;
}

message GetStateRequest {}

message GetStateReply {
  CompanionStateMsg state = 1;
  CompanionProfileMsg profile = 2;
}

message ListMemoriesRequest {
  int32 limit = 1;
}

message ListMemoriesReply {
  repeated CompanionMemoryMsg memories = 1;
}

message DeleteMemoryRequest {
  uint64 memory_id = 1;
}

message DeleteMemoryReply {}

message SetMemoryPinnedRequest {
  uint64 memory_id = 1;
  bool pinned = 2;
}

message SetMemoryPinnedReply {
  CompanionMemoryMsg memory = 1;
}

message UpdateMemoryRequest {
  uint64 memory_id = 1;
  string content = 2;
}

message UpdateMemoryReply {
  CompanionMemoryMsg memory = 1;
}

message GetProactiveSettingsRequest {}

message GetProactiveSettingsReply {
  CompanionProactiveSettingsMsg settings = 1;
}

message UpdateProactiveSettingsRequest {
  bool enabled = 1;
  int32 daily_limit = 2;
  int32 quiet_start = 3;
  int32 quiet_end = 4;
  int32 timezone_offset = 5;
}

message UpdateProactiveSettingsReply {
  CompanionProactiveSettingsMsg settings = 1;
}

message ConfirmMemoryRequest {
  uint64 memory_id = 1;
}

message ConfirmMemoryReply {
  CompanionMemoryMsg memory = 1;
}

message ListMemoryConflictsRequest {
  int32 limit = 1;
}

message ListMemoryConflictsReply {
  repeated CompanionMemoryConflictMsg conflicts = 1;
}

message ResolveMemoryConflictRequest {
  uint64 conflict_id = 1;
  string resolution = 2;
}

message ResolveMemoryConflictReply {}

message ListChatHistoryRequest {
  int32 limit = 1;
}

message ListChatHistoryReply {
  repeated CompanionChatLogMsg messages = 1;
}

message ListRelationshipEventsRequest {
  int32 limit = 1;
}

message ListRelationshipEventsReply {
  repeated CompanionRelationshipEventMsg events = 1;
}

message ListEventsRequest {
  int32 limit = 1;
}

message ListEventsReply {
  repeated CompanionEventMsg events = 1;
}

message ContextPreviewRequest {
  string scene = 1;
}

message ContextPreviewReply {
  string scene = 1;
  int32 history_count = 2;
  int32 memory_count = 3;
  int32 relationship_level = 4;
  double intimacy_score = 5;
  string world_bind_status = 6;
  bool first_chat = 7;
  int32 relationship_event_count = 8;
  int32 unfinished_topic_count = 9;
}

message CompanionProactiveDeliveryMsg {
  string delivery_key = 1;
  uint64 notification_id = 2;
  string status = 3;
  string reason = 4;
  int32 priority = 5;
  string scheduled_at = 6;
  string delivered_at = 7;
  string read_at = 8;
  string expires_at = 9;
  string revoked_at = 10;
}

message ListProactiveDeliveriesRequest {
  int32 limit = 1;
}

message ListProactiveDeliveriesReply {
  repeated CompanionProactiveDeliveryMsg deliveries = 1;
}

message RevokeProactiveDeliveryRequest {
  string delivery_key = 1;
  string reason = 2;
}

message RevokeProactiveDeliveryReply {}

message MarkProactiveReadRequest {
  uint64 notification_id = 1;
}

message MarkProactiveReadReply {}

// ── Service ──

service Companion {
  // Profile
  rpc GetProfile(GetProfileRequest) returns (GetProfileReply) {
    option (google.api.http) = {get: "/api/companion/profile"};
  }
  rpc GetCommunityIdentity(GetCommunityIdentityRequest) returns (GetCommunityIdentityReply) {
    option (google.api.http) = {get: "/api/companion/community-identity"};
  }
  rpc UpsertProfile(UpsertProfileRequest) returns (UpsertProfileReply) {
    option (google.api.http) = {
      post: "/api/companion/profile"
      body: "*"
    };
  }

  // State（当前状态，含人格化表达 + 动态）
  rpc GetState(GetStateRequest) returns (GetStateReply) {
    option (google.api.http) = {get: "/api/companion/state"};
  }

  // Memory
  rpc ListMemories(ListMemoriesRequest) returns (ListMemoriesReply) {
    option (google.api.http) = {get: "/api/companion/memories"};
  }
  rpc DeleteMemory(DeleteMemoryRequest) returns (DeleteMemoryReply) {
    option (google.api.http) = {delete: "/api/companion/memories/{memory_id}"};
  }
  rpc SetMemoryPinned(SetMemoryPinnedRequest) returns (SetMemoryPinnedReply) {
    option (google.api.http) = {
      post: "/api/companion/memories/{memory_id}/pin"
      body: "*"
    };
  }
  rpc UpdateMemory(UpdateMemoryRequest) returns (UpdateMemoryReply) {
    option (google.api.http) = {
      put: "/api/companion/memories/{memory_id}"
      body: "*"
    };
  }

  // Chat History
  rpc ListChatHistory(ListChatHistoryRequest) returns (ListChatHistoryReply) {
    option (google.api.http) = {get: "/api/companion/chat/history"};
  }

  rpc GetProactiveSettings(GetProactiveSettingsRequest) returns (GetProactiveSettingsReply) {
    option (google.api.http) = {get: "/api/companion/proactive-settings"};
  }
  rpc UpdateProactiveSettings(UpdateProactiveSettingsRequest) returns (UpdateProactiveSettingsReply) {
    option (google.api.http) = {
      put: "/api/companion/proactive-settings"
      body: "*"
    };
  }
  rpc ConfirmMemory(ConfirmMemoryRequest) returns (ConfirmMemoryReply) {
    option (google.api.http) = {
      post: "/api/companion/memories/{memory_id}/confirm"
      body: "*"
    };
  }

  rpc ListMemoryConflicts(ListMemoryConflictsRequest) returns (ListMemoryConflictsReply) {
    option (google.api.http) = {get: "/api/companion/memory-conflicts"};
  }
  rpc ResolveMemoryConflict(ResolveMemoryConflictRequest) returns (ResolveMemoryConflictReply) {
    option (google.api.http) = {
      post: "/api/companion/memory-conflicts/{conflict_id}/resolve"
      body: "*"
    };
  }

  rpc ListRelationshipEvents(ListRelationshipEventsRequest) returns (ListRelationshipEventsReply) {
    option (google.api.http) = {get: "/api/companion/relationship-events"};
  }

  rpc ListEvents(ListEventsRequest) returns (ListEventsReply) {
    option (google.api.http) = {get: "/api/companion/events"};
  }
  rpc GetTimeline(ListEventsRequest) returns (ListEventsReply) {
    option (google.api.http) = {get: "/api/companion/timeline"};
  }
  rpc GetContextPreview(ContextPreviewRequest) returns (ContextPreviewReply) {
    option (google.api.http) = {get: "/api/companion/context/preview"};
  }
  rpc ListProactiveDeliveries(ListProactiveDeliveriesRequest) returns (ListProactiveDeliveriesReply) {
    option (google.api.http) = {get: "/api/companion/proactive-deliveries"};
  }
  rpc RevokeProactiveDelivery(RevokeProactiveDeliveryRequest) returns (RevokeProactiveDeliveryReply) {
    option (google.api.http) = {
      post: "/api/companion/proactive/revoke"
      body: "*"
    };
  }

  rpc MarkProactiveRead(MarkProactiveReadRequest) returns (MarkProactiveReadReply) {
    option (google.api.http) = {
      post: "/api/companion/proactive/{notification_id}/read"
      body: "*"
    };
  }

  // 注意：Chat SSE 流式端点通过 RegisterChatStreamRoute 手工注册（参照 game 模块）
}
