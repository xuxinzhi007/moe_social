syntax = "proto3";

package post.v1;

import "google/api/annotations.proto";

option go_package = "backend/api/post/v1;postv1";

// Post — 域 HTTP/gRPC 契约 SSOT（P6-0）。
// HTTP: GET/POST /api/posts, GET /api/posts/:post_id, POST like, GET search

message TopicTag {
  string id = 1;
  string name = 2;
  string color = 3;
  string created_at = 4;
}

message Post {
  string id = 1;
  string user_id = 2;
  string user_name = 3;
  string user_avatar = 4;
  string content = 5;
  repeated string images = 6;
  repeated TopicTag topic_tags = 7;
  int32 likes = 8;
  int32 comments = 9;
  bool is_liked = 10;
  string created_at = 11;
  string hand_draw_card = 12;
  string hand_draw_thumb_url = 13;
  string moderation_status = 14;
  bool author_is_bot = 15;
  string author_bot_agent_key = 16;
}

message AchievementUnlock {
  string badge_id = 1;
  string name = 2;
  int32 exp_granted = 3;
  bool level_up = 4;
  int32 new_level = 5;
}

message GetPostRequest {
  string post_id = 1;
  string viewer_user_id = 2;
}

message GetPostReply {
  Post post = 1;
}

message MoeSearchPostsRequest {
  string query = 1;
  int32 limit = 2;
  uint64 viewer_user_id = 3;
  string mood_tag = 4;
  uint64 topic_tag_id = 5;
}

message MoeSearchPostHit {
  string post_id = 1;
  string user_id = 2;
  string user_name = 3;
  string content = 4;
  string snippet = 5;
  string mood_tag = 6;
  int32 likes = 7;
  int32 comments = 8;
  string created_at = 9;
  double score = 10;
  string score_reason = 11;
}

message MoeSearchPostsReply {
  repeated MoeSearchPostHit items = 1;
  int32 total = 2;
}

message CreatePostRequest {
  string user_id = 1;
  string content = 2;
  repeated string images = 3;
  repeated TopicTag topic_tags = 4;
  string hand_draw_card = 5;
  string hand_draw_thumb_url = 6;
  string mood_tag = 7;
  string group_id = 8;
}

message CreatePostReply {
  Post post = 1;
  repeated AchievementUnlock new_achievements = 2;
}

message LikePostRequest {
  string post_id = 1;
  string user_id = 2;
}

message LikePostReply {
  Post post = 1;
}

message GetPostsRequest {
  int32 page = 1;
  int32 page_size = 2;
  string viewer_user_id = 3;
  string feed_mode = 4;
  string topic_tag_id = 5;
  string author_user_id = 6;
}

message GetPostsReply {
  repeated Post posts = 1;
  int32 total = 2;
}

message UpdatePostRequest {
  string post_id = 1;
  string user_id = 2;
  string content = 3;
  repeated string images = 4;
  repeated TopicTag topic_tags = 5;
  string hand_draw_card = 6;
  string hand_draw_thumb_url = 7;
}

message UpdatePostReply {
  Post post = 1;
}

message DeletePostRequest {
  string post_id = 1;
  string user_id = 2;
}

message DeletePostReply {}

message ReportPostRequest {
  string post_id = 1;
  string reporter_user_id = 2;
  string reason = 3;
}

message ReportPostReply {}

service PostService {
  rpc GetPost(GetPostRequest) returns (GetPostReply) {
    option (google.api.http) = { get: "/api/posts/{post_id}" };
  }
  rpc GetPosts(GetPostsRequest) returns (GetPostsReply) {
    option (google.api.http) = { get: "/api/posts" };
  }
  rpc MoeSearchPosts(MoeSearchPostsRequest) returns (MoeSearchPostsReply) {
    option (google.api.http) = { get: "/api/posts/search" };
  }
  rpc CreatePost(CreatePostRequest) returns (CreatePostReply) {
    option (google.api.http) = { post: "/api/posts" body: "*" };
  }
  rpc LikePost(LikePostRequest) returns (LikePostReply) {
    option (google.api.http) = { post: "/api/posts/{post_id}/like" body: "*" };
  }
  rpc UpdatePost(UpdatePostRequest) returns (UpdatePostReply) {
    option (google.api.http) = { put: "/api/posts/{post_id}" body: "*" };
  }
  rpc DeletePost(DeletePostRequest) returns (DeletePostReply) {
    option (google.api.http) = { delete: "/api/posts/{post_id}" };
  }
  rpc ReportPost(ReportPostRequest) returns (ReportPostReply) {
    option (google.api.http) = { post: "/api/posts/{post_id}/report" body: "*" };
  }
}
