syntax = "proto3";

package moe.v1;

import "google/api/annotations.proto";

option go_package = "backend/api/moe/v1;moev1";

// Moe 域契约 SSOT（Phase 3 Sprint 2：与 super.proto Admin Moe 对齐）

message AgentRuntime {
  string agent_key = 1;
  string display_name = 2;
  string bot_user_id = 3;
  string capability_tier = 4;
  string model_name = 5;
  string provider_profile_id = 6;
  bool tools_enabled = 7;
  int32 post_quota_daily = 8;
  int32 posts_today = 9;
  bool enabled = 10;
  string last_run_at = 11;
  string last_post_id = 12;
  string post_schedule_mode = 13;
  string schedule_cron = 14;
  string next_run_at = 15;
  string system_prompt = 16;
  string post_rules = 17;
  string forbidden_tags = 18;
  string preferred_tags = 19;
}

message ListRuntimesRequest {}
message ListRuntimesReply {
  repeated AgentRuntime items = 1;
}

message UpsertRuntimeRequest {
  string agent_key = 1;
  string display_name = 2;
  string bot_user_id = 3;
  string capability_tier = 4;
  string model_name = 5;
  string provider_profile_id = 6;
  bool tools_enabled = 7;
  int32 post_quota_daily = 8;
  bool enabled = 9;
  string system_prompt = 10;
  string post_rules = 11;
  string forbidden_tags = 12;
  string preferred_tags = 13;
  string post_schedule_mode = 14;
  string schedule_cron = 15;
}
message UpsertRuntimeReply {
  AgentRuntime item = 1;
}

message MoePipelineStep {
  string key = 1;
  string label = 2;
  string status = 3;
  string detail = 4;
  int64 duration_ms = 5;
}

message MoeHostMetrics {
  int64 proc_alloc_mb = 1;
  int64 proc_sys_mb = 2;
  int32 num_cpu = 3;
  int32 num_goroutine = 4;
  bool inference_online = 5;
  string inference_base_url = 6;
  int32 inference_models = 7;
  string gpu_note = 8;
}

message GetBrainPipelineRequest {
  string agent_key = 1;
}
message GetBrainPipelineReply {
  string agent_key = 1;
  bool ok = 2;
  string detail = 3;
  string post_id = 4;
  string run_at = 5;
  int64 total_duration_ms = 6;
  repeated MoePipelineStep steps = 7;
  MoeHostMetrics host_metrics = 8;
}

message RunAgentOnceRequest {
  string agent_key = 1;
  bool async = 2;
}
message RunAgentOnceReply {
  string agent_key = 1;
  bool ok = 2;
  string detail = 3;
  string post_id = 4;
  bool accepted = 5;
  bool already_running = 6;
}

message BrainTagStat {
  string tag = 1;
  int32 count = 2;
}
message BrainEpisode {
  uint64 id = 1;
  string post_id = 2;
  string content = 3;
  repeated string tags = 4;
  string mood_tag = 5;
  int32 style_score = 6;
  int32 quality_score = 7;
  bool approved = 8;
  int32 revision_count = 9;
  string memory_key = 10;
  string source = 11;
  string created_at = 12;
}
message BrainMemory {
  string key = 1;
  string value = 2;
  string memory_type = 3;
  string updated_at = 4;
}
message BrainGenerationMeta {
  bool post_uses_tool_memory = 1;
  int32 memories_synced = 2;
  int32 episodes_in_prompt = 3;
  int32 prompt_memory_lines = 4;
  string prompt_preview = 5;
  string note = 6;
  int32 prompt_est_tokens = 7;
  int32 context_limit = 8;
  double context_used_pct = 9;
}

message GetBrainSnapshotRequest {
  string agent_key = 1;
}
message GetBrainSnapshotReply {
  string agent_key = 1;
  string display_name = 2;
  string bot_user_id = 3;
  repeated string forbidden_tags = 4;
  repeated string preferred_tags = 5;
  repeated BrainTagStat tag_stats = 6;
  repeated BrainEpisode episodes = 7;
  repeated BrainMemory memories = 8;
  BrainGenerationMeta generation_meta = 9;
  int32 stability_score = 10;
  int32 stability_delta = 11;
  int32 avg_episode_quality = 12;
}

message BrainGraphNode {
  string id = 1;
  string kind = 2;
  string label = 3;
  string summary = 4;
  int32 weight = 5;
  string ref_id = 6;
}

message BrainGraphEdge {
  string id = 1;
  string source = 2;
  string target = 3;
  string relation = 4;
  double weight = 5;
}

message GetBrainGraphRequest {
  string agent_key = 1;
  int32 limit = 2;
}

message GetBrainGraphReply {
  string agent_key = 1;
  repeated BrainGraphNode nodes = 2;
  repeated BrainGraphEdge edges = 3;
  int32 episode_count = 4;
  int32 memory_count = 5;
  int32 tag_count = 6;
}

message BrainRpgSkill {
  string tag = 1;
  string label = 2;
  int32 level = 3;
  bool locked = 4;
  int32 usage_count = 5;
}

message BrainRpgFragment {
  uint64 id = 1;
  string kind = 2;
  string title = 3;
  string status = 4;
  int32 quality_score = 5;
  bool approved = 6;
  string created_at = 7;
  string memory_key = 8;
}

message BrainRpgDreamLog {
  uint64 id = 1;
  string ran_at = 2;
  string summary = 3;
  int32 refined = 4;
  int32 merged = 5;
  int32 archived = 6;
  int32 xp_gained = 7;
}

message BrainRpgStats {
  int32 total_fragments = 1;
  int32 solid_memories = 2;
  int32 pending_tidy = 3;
  int32 locked_skills = 4;
  int32 graph_nodes = 5;
}

message GetBrainRpgRequest {
  string agent_key = 1;
}

message GetBrainRpgReply {
  string agent_key = 1;
  int32 level = 2;
  int32 xp = 3;
  int32 xp_to_next = 4;
  int32 stability_score = 5;
  repeated BrainRpgSkill skills = 6;
  repeated BrainRpgFragment fragments = 7;
  repeated BrainRpgDreamLog recent_dreams = 8;
  BrainRpgStats stats = 9;
  string last_dream_at = 10;
  bool dream_enabled = 11;
  string dream_cron = 12;
  string next_dream_at = 13;
  bool autonomous_mind_enabled = 14;
  int32 pending_delete_count = 15;
}

message RunBrainDreamRequest {
  string agent_key = 1;
  bool skip_curate = 2;
}

message RunBrainDreamReply {
  string agent_key = 1;
  string summary = 2;
  int32 refined = 3;
  int32 merged = 4;
  int32 archived = 5;
  int32 xp_gained = 6;
  int32 level = 7;
  int32 xp = 8;
}

message CompressBrainMemoriesRequest {
  string agent_key = 1;
  int32 days = 2;
}

message CompressBrainMemoriesReply {
  string agent_key = 1;
  string memory_key = 2;
  string summary = 3;
  int32 source_count = 4;
  int32 xp_gained = 5;
  int32 swept_count = 6;
  int32 merged_clusters = 7;
  int32 marked_count = 8;
  int32 pending_remaining = 9;
}

message TidyBrainFragmentsRequest {
  string agent_key = 1;
  int32 max_episodes = 2;
}

message TidyBrainFragmentsReply {
  string agent_key = 1;
  int32 total = 2;
  int32 approved = 3;
  int32 xp_gained = 4;
}

message LockBrainSkillRequest {
  string agent_key = 1;
  string tag = 2;
  bool lock = 3;
}

message LockBrainSkillReply {
  string agent_key = 1;
  repeated string locked_skills = 2;
}

message ForgetBrainMemoryRequest {
  string agent_key = 1;
  string memory_key = 2;
}

message ForgetBrainMemoryReply {
  string agent_key = 1;
  string memory_key = 2;
  bool deleted = 3;
}

message GetBrainPresenceRequest {
  string agent_key = 1;
}

message GetBrainPresenceReply {
  string agent_key = 1;
  string display_name = 2;
  string activity = 3;
  string mood = 4;
  string thought = 5;
  string pipeline_step = 6;
  bool pipeline_running = 7;
  bool dream_enabled = 8;
  string dream_cron = 9;
  string next_dream_at = 10;
  bool dreaming = 11;
  bool autonomous_mind_enabled = 12;
  string thought_source = 13;
}

message UpdateBrainDreamScheduleRequest {
  string agent_key = 1;
  bool dream_enabled = 2;
  string dream_cron = 3;
}

message UpdateBrainDreamScheduleReply {
  string agent_key = 1;
  bool dream_enabled = 2;
  string dream_cron = 3;
  string next_dream_at = 4;
}

message UpdateBrainAutonomousMindRequest {
  string agent_key = 1;
  bool autonomous_mind_enabled = 2;
}

message UpdateBrainAutonomousMindReply {
  string agent_key = 1;
  bool autonomous_mind_enabled = 2;
}

message GenerateBrainThoughtRequest {
  string agent_key = 1;
}

message GenerateBrainThoughtReply {
  string agent_key = 1;
  string thought = 2;
  string thought_source = 3;
  string generated_at = 4;
}

message UpdateBrainPolicyRequest {
  string agent_key = 1;
  repeated string forbidden_tags = 2;
  repeated string preferred_tags = 3;
}

message DeleteBrainEpisodeRequest {
  uint64 id = 1;
}
message DeleteBrainEpisodeReply {}

message RefineBrainEpisodeRequest {
  uint64 id = 1;
  int32 max_attempts = 2;
}
message RefineBrainEpisodeReply {
  uint64 episode_id = 1;
  bool ok = 2;
  bool approved = 3;
  int32 quality_score = 4;
  string before_content = 5;
  string after_content = 6;
  int32 attempts = 7;
  string detail = 8;
}

message CurateBrainRequest {
  string agent_key = 1;
  int32 max_episodes = 2;
  int32 max_attempts = 3;
  int32 min_quality = 4;
  bool force = 5;
}
message CurateBrainReply {
  string agent_key = 1;
  int32 total = 2;
  int32 approved = 3;
  repeated RefineBrainEpisodeReply results = 4;
}

message ToolStatRow {
  string tool = 1;
  int64 total_calls = 2;
  int64 success_calls = 3;
  int64 failed_calls = 4;
}
message ToolDayStat {
  string date = 1;
  int64 total_calls = 2;
  int64 success_calls = 3;
}
message QueryToolStatsRequest {
  string from = 1;
  string to = 2;
  string agent_key = 3;
  string tool = 4;
}
message QueryToolStatsReply {
  int64 total_calls = 1;
  int64 success_calls = 2;
  int64 failed_calls = 3;
  repeated ToolStatRow by_tool = 4;
  repeated ToolDayStat by_day = 5;
}

message ToolCallRow {
  string id = 1;
  string tool = 2;
  string actor_user_id = 3;
  string agent_key = 4;
  bool ok = 5;
  string error_msg = 6;
  int32 latency_ms = 7;
  string source = 8;
  string arguments_preview = 9;
  string created_at = 10;
}
message ListToolCallsRequest {
  string from = 1;
  string to = 2;
  string agent_key = 3;
  string tool = 4;
  string source = 5;
  string actor_user_id = 6;
  bool ok_only = 7;
  bool failed_only = 8;
  int32 page = 9;
  int32 page_size = 10;
}
message ListToolCallsReply {
  int64 total = 1;
  repeated ToolCallRow items = 2;
}

message MoeFlowNode {
  string id = 1;
  string type = 2;
  string kind = 3;
  string label = 4;
  string subtitle = 5;
  string step_key = 6;
  string tool_name = 7;
  double position_x = 8;
  double position_y = 9;
  bool enabled = 10;
  string on_fail = 11;
  int32 retry_max = 12;
}

message MoeFlowEdge {
  string id = 1;
  string source = 2;
  string target = 3;
  string kind = 4;
  string label = 5;
}

message BotFlowReply {
  string agent_key = 1;
  int32 version = 2;
  string entry_node_id = 3;
  repeated MoeFlowNode nodes = 4;
  repeated MoeFlowEdge edges = 5;
  double viewport_zoom = 6;
  double viewport_x = 7;
  double viewport_y = 8;
  string updated_at = 9;
  bool is_default = 10;
  repeated string warnings = 11;
}

message GetBotFlowRequest {
  string agent_key = 1;
}

message UpsertBotFlowRequest {
  string agent_key = 1;
  repeated MoeFlowNode nodes = 2;
  repeated MoeFlowEdge edges = 3;
  double viewport_zoom = 4;
  double viewport_x = 5;
  double viewport_y = 6;
}

message DeleteBotFlowRequest {
  string agent_key = 1;
}

message GetInferenceStatusRequest {
  string agent_key = 1;
}

message GetInferenceStatusReply {
  bool online = 1;
  string base_url = 2;
  repeated string models = 3;
  string default_post_model = 4;
  string preferred_model = 5;
  string runtime_model = 6;
  string effective_model = 7;
  bool auto_discovered = 8;
  bool model_loaded = 9;
  int32 context_limit = 10;
  string context_source = 11;
  string message = 12;
}

message MoeToolSchemaItem {
  string name = 1;
  string description = 2;
  repeated string allowed_tiers = 3;
}

message GetToolsSchemaRequest {}

message GetToolsSchemaReply {
  string default_tier = 1;
  repeated MoeToolSchemaItem tools = 2;
  string openai_tools_json = 3;
}

// MoeAdmin — PK-1 域 SSOT。HTTP 灰度读路径（PK-2）：
//   GET /api/admin/moe/runtimes
//   GET /api/admin/moe/brain/pipeline?agent_key=
// 试点 :19032；灰度 moe.kratos_admin_http_enabled
service MoeAdmin {
  rpc ListRuntimes(ListRuntimesRequest) returns (ListRuntimesReply) {
    option (google.api.http) = { get: "/api/admin/moe/runtimes" };
  }
  rpc UpsertRuntime(UpsertRuntimeRequest) returns (UpsertRuntimeReply) {
    option (google.api.http) = { post: "/api/admin/moe/runtimes" body: "*" };
  }
  rpc GetBrainPipeline(GetBrainPipelineRequest) returns (GetBrainPipelineReply) {
    option (google.api.http) = { get: "/api/admin/moe/brain/pipeline" };
  }
  rpc RunAgentOnce(RunAgentOnceRequest) returns (RunAgentOnceReply) {
    option (google.api.http) = {
      post: "/api/admin/moe/runtimes/{agent_key}/run-once"
      body: "*"
    };
  }
  rpc GetBrainSnapshot(GetBrainSnapshotRequest) returns (GetBrainSnapshotReply) {
    option (google.api.http) = { get: "/api/admin/moe/runtimes/{agent_key}/brain" };
  }
  rpc GetBrainGraph(GetBrainGraphRequest) returns (GetBrainGraphReply) {
    option (google.api.http) = { get: "/api/admin/moe/runtimes/{agent_key}/brain/graph" };
  }
  rpc GetBrainRpg(GetBrainRpgRequest) returns (GetBrainRpgReply) {
    option (google.api.http) = { get: "/api/admin/moe/runtimes/{agent_key}/brain/rpg" };
  }
  rpc RunBrainDream(RunBrainDreamRequest) returns (RunBrainDreamReply) {
    option (google.api.http) = {
      post: "/api/admin/moe/runtimes/{agent_key}/brain/rpg/dream"
      body: "*"
    };
  }
  rpc CompressBrainMemories(CompressBrainMemoriesRequest) returns (CompressBrainMemoriesReply) {
    option (google.api.http) = {
      post: "/api/admin/moe/runtimes/{agent_key}/brain/rpg/compress"
      body: "*"
    };
  }
  rpc TidyBrainFragments(TidyBrainFragmentsRequest) returns (TidyBrainFragmentsReply) {
    option (google.api.http) = {
      post: "/api/admin/moe/runtimes/{agent_key}/brain/rpg/tidy"
      body: "*"
    };
  }
  rpc LockBrainSkill(LockBrainSkillRequest) returns (LockBrainSkillReply) {
    option (google.api.http) = {
      post: "/api/admin/moe/runtimes/{agent_key}/brain/rpg/skills"
      body: "*"
    };
  }
  rpc ForgetBrainMemory(ForgetBrainMemoryRequest) returns (ForgetBrainMemoryReply) {
    option (google.api.http) = {
      post: "/api/admin/moe/runtimes/{agent_key}/brain/rpg/forget"
      body: "*"
    };
  }
  rpc GetBrainPresence(GetBrainPresenceRequest) returns (GetBrainPresenceReply) {
    option (google.api.http) = { get: "/api/admin/moe/runtimes/{agent_key}/brain/presence" };
  }
  rpc UpdateBrainDreamSchedule(UpdateBrainDreamScheduleRequest) returns (UpdateBrainDreamScheduleReply) {
    option (google.api.http) = {
      put: "/api/admin/moe/runtimes/{agent_key}/brain/rpg/dream-schedule"
      body: "*"
    };
  }
  rpc UpdateBrainAutonomousMind(UpdateBrainAutonomousMindRequest) returns (UpdateBrainAutonomousMindReply) {
    option (google.api.http) = {
      put: "/api/admin/moe/runtimes/{agent_key}/brain/rpg/autonomous-mind"
      body: "*"
    };
  }
  rpc GenerateBrainThought(GenerateBrainThoughtRequest) returns (GenerateBrainThoughtReply) {
    option (google.api.http) = {
      post: "/api/admin/moe/runtimes/{agent_key}/brain/rpg/think"
      body: "*"
    };
  }
  rpc UpdateBrainPolicy(UpdateBrainPolicyRequest) returns (GetBrainSnapshotReply) {
    option (google.api.http) = {
      put: "/api/admin/moe/runtimes/{agent_key}/brain/policy"
      body: "*"
    };
  }
  rpc DeleteBrainEpisode(DeleteBrainEpisodeRequest) returns (DeleteBrainEpisodeReply) {
    option (google.api.http) = { delete: "/api/admin/moe/brain/episodes/{id}" };
  }
  rpc RefineBrainEpisode(RefineBrainEpisodeRequest) returns (RefineBrainEpisodeReply) {
    option (google.api.http) = { post: "/api/admin/moe/brain/episodes/{id}/refine" body: "*" };
  }
  rpc CurateBrain(CurateBrainRequest) returns (CurateBrainReply) {
    option (google.api.http) = {
      post: "/api/admin/moe/runtimes/{agent_key}/brain/curate"
      body: "*"
    };
  }
  rpc GetBotFlow(GetBotFlowRequest) returns (BotFlowReply) {
    option (google.api.http) = { get: "/api/admin/moe/runtimes/{agent_key}/flow" };
  }
  rpc UpsertBotFlow(UpsertBotFlowRequest) returns (BotFlowReply) {
    option (google.api.http) = {
      put: "/api/admin/moe/runtimes/{agent_key}/flow"
      body: "*"
    };
  }
  rpc DeleteBotFlow(DeleteBotFlowRequest) returns (BotFlowReply) {
    option (google.api.http) = { delete: "/api/admin/moe/runtimes/{agent_key}/flow" };
  }
  rpc GetInferenceStatus(GetInferenceStatusRequest) returns (GetInferenceStatusReply) {
    option (google.api.http) = { get: "/api/admin/moe/inference/status" };
  }
  rpc GetToolsSchema(GetToolsSchemaRequest) returns (GetToolsSchemaReply) {
    option (google.api.http) = { get: "/api/admin/moe/tools/schema" };
  }
  rpc QueryToolStats(QueryToolStatsRequest) returns (QueryToolStatsReply) {
    option (google.api.http) = { get: "/api/admin/moe/tools/stats" };
  }
  rpc ListToolCalls(ListToolCallsRequest) returns (ListToolCallsReply) {
    option (google.api.http) = { get: "/api/admin/moe/tools/calls" };
  }
}
