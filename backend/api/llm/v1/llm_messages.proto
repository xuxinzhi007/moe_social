syntax = "proto3";
package llm.v1;

import "google/api/annotations.proto";

option go_package = "backend/api/llm/v1;llmv1";

// P6: extracted from rpc/defs/common.proto (28 messages)

message DeleteUserMemoryReq {
  string user_id = 1;
  string key = 2;
}

message DeleteUserMemoryResp {
}

message GetAiUserConfigReq {
  string user_id = 1;
}

message GetAiUserConfigResp {
  string user_persona = 1;
  string preferences_json = 2;
}

message GetUserMemoriesReq {
  string user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetUserMemoriesResp {
  repeated UserMemory memories = 1;
  int64 total = 2;
  int32 limit = 3;
  int32 offset = 4;
  bool has_more = 5;
}

message GetUserMemoryProfilesReq {
  string user_id = 1;
  int32 limit = 2;
}

message GetUserMemoryProfilesResp {
  repeated UserMemoryProfile profiles = 1;
}

message ListUserMemoryEmbeddingsReq {
  string user_id = 1;
}

message ListUserMemoryEmbeddingsResp {
  repeated UserMemoryEmbeddingItem items = 1;
}

message ListUserMemoryRelationsReq {
  string user_id = 1;
}

message ListUserMemoryRelationsResp {
  repeated UserMemoryRelationItem items = 1;
}

message RebuildUserMemoryEmbeddingsReq {
  string user_id = 1;
}

message RebuildUserMemoryEmbeddingsResp {
  int32 indexed = 1;
  string provider = 2;
  string model = 3;
}

message RecordLlmChatTurnReq {
  uint64 user_id = 1;
  string session_id = 2;
  string source_msg_id = 3;
  string model = 4;
  string role = 5;
  string content = 6;
}

message RecordLlmChatTurnResp {
  bool ok = 1;
}

message SubmitUserMemoryFeedbackReq {
  string user_id = 1;
  string key = 2;
  // accept | reject | correct
  string feedback_type = 3;
  string corrected_value = 4;
  string reason = 5;
}

message SubmitUserMemoryFeedbackResp {
  UserMemory memory = 1;
}

message UpsertAiUserConfigReq {
  string user_id = 1;
  string user_persona = 2;
  bool has_user_persona = 3;
  string preferences_json = 4;
}

message UpsertAiUserConfigResp {
  string user_persona = 1;
  string preferences_json = 2;
}

message UpsertUserMemoryEmbeddingReq {
  string user_id = 1;
  string memory_key = 2;
  repeated float values = 3;
  string provider = 4;
  string model = 5;
  string chunk_text = 6;
}

message UpsertUserMemoryEmbeddingResp {
}

message UpsertUserMemoryReq {
  string user_id = 1;
  string key = 2;
  string value = 3;
  string memory_type = 4;
  double confidence = 5;
  string source = 6;
  string source_msg_id = 7;
  string session_id = 8;
}

message UpsertUserMemoryResp {
  UserMemory memory = 1;
}

message UserMemory {
  string id = 1;
  string user_id = 2;
  string key = 3;
  string value = 4;
  string memory_type = 5;
  double confidence = 6;
  string source = 7;
  string created_at = 8;
  string updated_at = 9;
  string source_msg_id = 10;
  string session_id = 11;
}

message UserMemoryEmbeddingItem {
  string memory_key = 1;
  repeated float values = 2;
  string provider = 3;
  string model = 4;
}

message UserMemoryProfile {
  string memory_type = 1;
  string summary = 2;
  int32 item_count = 3;
  double confidence = 4;
}

message UserMemoryRelationItem {
  string from_key = 1;
  string to_key = 2;
  string relation = 3;
  double weight = 4;
}

message GetUserMemoriesDisplayReq {
  string user_id = 1;
}

message UserMemoryDisplayProfile {
  string title = 1;
  string summary = 2;
  int32 item_count = 3;
}

message UserMemoryDisplayItem {
  string id = 1;
  string key = 2;
  string title = 3;
  string content = 4;
  string category = 5;
  string updated_at = 6;
}

message UserMemoryDisplayData {
  string headline = 1;
  repeated UserMemoryDisplayProfile profiles = 2;
  repeated UserMemoryDisplayItem items = 3;
  int32 total = 4;
}

message GetUserMemoriesDisplayResp {
  UserMemoryDisplayData data = 1;
}

message SearchUserMemoriesReq {
  string user_id = 1;
  string q = 2;
  int32 limit = 3;
}

message SearchUserMemoriesData {
  string query = 1;
  repeated UserMemoryDisplayItem items = 2;
  int32 total = 3;
}

message SearchUserMemoriesResp {
  SearchUserMemoriesData data = 1;
}

message GetAiMemorySettingsReq {}

message GetAiMemorySettingsResp {
  bool auto_learn = 1;
}

message PutAiMemorySettingsReq {
  bool auto_learn = 1;
}

message PutAiMemorySettingsResp {
  bool auto_learn = 1;
}

message ListLlmModelsReq {}

message ListLlmModelsResp {
  repeated string models = 1;
}

message LlmLocalModelCatalogItem {
  string id = 1;
  string name = 2;
  string filename = 3;
  int64 size_bytes = 4;
  string sha256 = 5;
  string description = 6;
  double parameters_b = 7;
  bool recommended = 8;
  string download_path = 9;
}

message ListLlmLocalModelsCatalogReq {}

message ListLlmLocalModelsCatalogResp {
  repeated LlmLocalModelCatalogItem items = 1;
}

service LlmChat {
  rpc RecordLlmChatTurn(RecordLlmChatTurnReq) returns (RecordLlmChatTurnResp) {
    option (google.api.http) = { post: "/api/llm/chat/turn" body: "*" };
  }
  rpc UpsertUserMemory(UpsertUserMemoryReq) returns (UpsertUserMemoryResp) {
    option (google.api.http) = {
      post: "/api/user/{user_id}/memories"
      body: "*"
    };
  }
  rpc GetUserMemories(GetUserMemoriesReq) returns (GetUserMemoriesResp) {
    option (google.api.http) = { get: "/api/user/{user_id}/memories" };
  }
  rpc DeleteUserMemory(DeleteUserMemoryReq) returns (DeleteUserMemoryResp) {
    option (google.api.http) = {
      delete: "/api/user/{user_id}/memories"
      body: "*"
    };
  }
  rpc GetUserMemoriesDisplay(GetUserMemoriesDisplayReq) returns (GetUserMemoriesDisplayResp) {
    option (google.api.http) = { get: "/api/user/{user_id}/memories/display" };
  }
  rpc SubmitUserMemoryFeedback(SubmitUserMemoryFeedbackReq) returns (SubmitUserMemoryFeedbackResp) {
    option (google.api.http) = {
      post: "/api/user/{user_id}/memories/feedback"
      body: "*"
    };
  }
  rpc GetUserMemoryProfiles(GetUserMemoryProfilesReq) returns (GetUserMemoryProfilesResp) {
    option (google.api.http) = { get: "/api/user/{user_id}/memories/profiles" };
  }
  rpc RebuildUserMemoryEmbeddings(RebuildUserMemoryEmbeddingsReq) returns (RebuildUserMemoryEmbeddingsResp) {
    option (google.api.http) = {
      post: "/api/user/{user_id}/memories/reindex"
      body: "*"
    };
  }
  rpc SearchUserMemories(SearchUserMemoriesReq) returns (SearchUserMemoriesResp) {
    option (google.api.http) = { get: "/api/user/{user_id}/memories/search" };
  }
  rpc GetAiUserConfig(GetAiUserConfigReq) returns (GetAiUserConfigResp) {
    option (google.api.http) = { get: "/api/ai/config" };
  }
  rpc UpsertAiUserConfig(UpsertAiUserConfigReq) returns (UpsertAiUserConfigResp) {
    option (google.api.http) = { put: "/api/ai/config" body: "*" };
  }
  rpc GetAiMemorySettings(GetAiMemorySettingsReq) returns (GetAiMemorySettingsResp) {
    option (google.api.http) = { get: "/api/ai/memory/settings" };
  }
  rpc PutAiMemorySettings(PutAiMemorySettingsReq) returns (PutAiMemorySettingsResp) {
    option (google.api.http) = { put: "/api/ai/memory/settings" body: "*" };
  }
  rpc ListLlmModels(ListLlmModelsReq) returns (ListLlmModelsResp) {
    option (google.api.http) = { get: "/api/llm/models" };
  }
  rpc ListLlmLocalModelsCatalog(ListLlmLocalModelsCatalogReq) returns (ListLlmLocalModelsCatalogResp) {
    option (google.api.http) = { get: "/api/llm/local-models/catalog" };
  }
}
