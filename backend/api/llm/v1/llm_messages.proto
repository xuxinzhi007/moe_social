syntax = "proto3";
package llm.v1;

import "google/api/annotations.proto";

option go_package = "backend/api/llm/v1;llmv1";

// 2026-09-17（#42 死接口清理）：这里原先有 15 个 RPC、39 个 message，其中 12 个 RPC 与
// 全部「用户记忆 / 聊天记录 / 离线模型清单」相关的 message 都已删除。
//
// 删除依据（三条同时成立，逐条实测）：
//   1. 后端实现早在提交 14edac0e「移除了一些不需要的能力」(2026-06-29) 就被整文件删掉了
//      （internal/biz/llm/memory_*.go、chat_turn.go、catalog.go、ollama_write.go 共 ~1900 行），
//      只剩 proto 壳；没有适配方法，内嵌的 UnimplementedLlmChatServer 顶上，线上永远回 501。
//   2. 前端零调用方：lib/ moe-admin/src/ website/ moe-avatar/ 全量扫描
//      /api/llm/chat/turn、/api/ai/memory/settings、/api/user/*/memories*、
//      /api/llm/local-models 命中数均为 0（阳性对照：同期 /api/ 命中 256+94+3 条）。
//   3. 非生成代码零引用：39 个待删 message 类型在 *.pb.go 之外的 Go 文件里引用数为 0，
//      适配层只实现了下面留下的 3 个 RPC。
//
// 保留的 3 个 RPC 都是活的：GetAiUserConfig / UpsertAiUserConfig（角色卡云端同步，
// 含 Provider API Key 密文）与 ListLlmModels（客户端真的在打，曾漏实现，已补齐）。
//
// 注意 LlmCreateAgent（POST /api/llm/agents）不在本文件、也不在删除范围内：它属于
// platform.v1，前端有两个活调用点，只是 biz 层是 501 桩 —— 那是「活接口坏掉」而非
// 「死接口」，已单独登记为 #51。

message GetAiUserConfigReq {
  string user_id = 1;
}

message GetAiUserConfigResp {
  string user_persona = 1;
  string preferences_json = 2;
  // 已明确开启账号同步的 Provider API Key；服务端只保存密文。
  string provider_api_keys_json = 3;
}

message UpsertAiUserConfigReq {
  string user_id = 1;
  string user_persona = 2;
  bool has_user_persona = 3;
  string preferences_json = 4;
  // 单个 Provider 密钥的增量写入；key 为空表示删除云端密钥。
  string provider_api_key_profile_id = 5;
  string provider_api_key = 6;
  bool has_provider_api_key = 7;
}

message UpsertAiUserConfigResp {
  string user_persona = 1;
  string preferences_json = 2;
  string provider_api_keys_json = 3;
}

message ListLlmModelsReq {}

message ListLlmModelsResp {
  repeated string models = 1;
}

service LlmChat {
  rpc GetAiUserConfig(GetAiUserConfigReq) returns (GetAiUserConfigResp) {
    option (google.api.http) = { get: "/api/ai/config" };
  }
  rpc UpsertAiUserConfig(UpsertAiUserConfigReq) returns (UpsertAiUserConfigResp) {
    option (google.api.http) = { put: "/api/ai/config" body: "*" };
  }
  rpc ListLlmModels(ListLlmModelsReq) returns (ListLlmModelsResp) {
    option (google.api.http) = { get: "/api/llm/models" };
  }
}
