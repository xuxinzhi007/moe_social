syntax = "proto3";

package gift.v1;

import "google/api/annotations.proto";

option go_package = "backend/api/gift/v1;giftv1";

// Gift — 域 HTTP/gRPC 契约 SSOT（P6-0）。
// HTTP: GET /api/gifts, GET /api/gifts/:gift_id
// HTTP: POST /api/user/:user_id/gifts/send|purchase, GET records

message Gift {
  uint64 id = 1;
  string name = 2;
  int32 price = 3;
  string icon = 4;
  string description = 5;
  string created_at = 6;
  string updated_at = 7;
  int32 owned_quantity = 8;
  string category = 9;
  int32 sort_order = 10;
}

message GiftRecord {
  uint64 id = 1;
  uint64 from_user_id = 2;
  string from_user_name = 3;
  uint64 to_user_id = 4;
  string to_user_name = 5;
  uint64 gift_id = 6;
  Gift gift = 7;
  int32 quantity = 8;
  string created_at = 9;
}

message AchievementUnlock {
  string badge_id = 1;
  string name = 2;
  int32 exp_granted = 3;
  bool level_up = 4;
  int32 new_level = 5;
}

message GetGiftsRequest {
  int32 page = 1;
  int32 page_size = 2;
  string viewer_user_id = 3;
}

message GetGiftsReply {
  repeated Gift gifts = 1;
  int32 total = 2;
}

message GetGiftRequest {
  string gift_id = 1;
}

message GetGiftReply {
  bool success = 1;
  string message = 2;
  Gift gift = 3;
}

message SendGiftRequest {
  string from_user_id = 1;
  string to_user_id = 2;
  string gift_id = 3;
  int32 quantity = 4;
}

message SendGiftReply {
  bool success = 1;
  string message = 2;
  GiftRecord record = 3;
  repeated AchievementUnlock new_achievements = 4;
}

message GetGiftRecordsRequest {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message GetGiftRecordsReply {
  repeated GiftRecord records = 1;
  int32 total = 2;
}

message PurchaseGiftRequest {
  string user_id = 1;
  string gift_id = 2;
  int32 quantity = 3;
}

message PurchaseGiftReply {
  bool success = 1;
  string message = 2;
  double new_balance = 3;
  int32 owned_quantity = 4;
  string order_no = 5;
}

message GiftPurchaseOrder {
  string id = 1;
  string user_id = 2;
  string order_no = 3;
  string gift_id = 4;
  string gift_name = 5;
  int32 quantity = 6;
  double unit_price = 7;
  double total_amount = 8;
  string pay_method = 9;
  string status = 10;
  string created_at = 11;
}

message GetGiftPurchaseOrdersRequest {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message GetGiftPurchaseOrdersReply {
  repeated GiftPurchaseOrder orders = 1;
  int32 total = 2;
}

service GiftService {
  rpc GetGifts(GetGiftsRequest) returns (GetGiftsReply) {
    option (google.api.http) = { get: "/api/gifts" };
  }
  rpc GetGift(GetGiftRequest) returns (GetGiftReply) {
    option (google.api.http) = { get: "/api/gifts/{gift_id}" };
  }
  rpc SendGift(SendGiftRequest) returns (SendGiftReply) {
    option (google.api.http) = { post: "/api/user/{from_user_id}/gifts/send" body: "*" };
  }
  rpc PurchaseGift(PurchaseGiftRequest) returns (PurchaseGiftReply) {
    option (google.api.http) = { post: "/api/user/{user_id}/gifts/purchase" body: "*" };
  }
  rpc GetGiftRecords(GetGiftRecordsRequest) returns (GetGiftRecordsReply) {
    option (google.api.http) = { get: "/api/user/{user_id}/gifts/records" };
  }
  rpc GetGiftPurchaseOrders(GetGiftPurchaseOrdersRequest) returns (GetGiftPurchaseOrdersReply) {
    option (google.api.http) = { get: "/api/user/{user_id}/gifts/purchase-orders" };
  }
}
