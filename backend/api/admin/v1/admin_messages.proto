  string created_at = 4;
}

message User {
  string id = 1;
  string username = 2;
  string email = 3;
  string avatar = 4;
  string signature = 5;   // 个性签名
  string gender = 6;      // 性别
  string birthday = 7;    // 生日
  string created_at = 8;
  string updated_at = 9;
  bool is_vip = 10;
  string vip_expires_at = 11;
  bool auto_renew = 12;
  float balance = 13; // 钱包余额
  string inventory = 14;
  string equipped_frame_id = 15;
  string moe_no = 16;
  // 收到他人赠送礼物累计：魅力点（与礼物标价挂钩）与面值总和（展示用）
  int32 gift_charm = 17;
  double received_gift_value = 18;
  // 与 moe_no 相同，个人中心等「对外展示账号」请用本字段或 moe_no；业务主键仍为 id
  string display_user_id = 19;
  // 0=自动（YAML+VIP）；7 或 30 为用户在设置里自选的私信保留天数（仅影响新消息）
  int32 message_retention_choice = 20;
  // 绑定的企业飞书邮箱（receive_id_type=email）
  string feishu_email = 21;
  // 飞书 OAuth 显示名（通知卡片「操作者」会附带）
  string feishu_name = 22;
  // 是否已通过飞书 OAuth 绑定
  bool feishu_bound = 23;
  string role = 24; // App 用户角色 user | admin | super_admin
  // 微信 OAuth 昵称
  string wechat_nickname = 25;
  // 是否已通过微信 OAuth 绑定
  bool wechat_bound = 26;
  // 社区 AI Bot 账号（由 moe_agent_runtimes 绑定）
  bool is_bot = 27;
  string bot_agent_key = 28;
}

