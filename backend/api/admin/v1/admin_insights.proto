// Admin Insights — PK-3 域 SSOT（试点 HTTP 见 moekratospilot/admin_insights_compat.go）。
// HTTP 路径与 api/defs/admin.api 一致；灰度 moe.kratos_admin_insights_http_enabled
syntax = "proto3";

package admin.v1;

option go_package = "backend/api/admin/v1;adminv1";

message AdminListAiChatSessionsReq {}
message AdminListAiChatSessionsResp {}
message AdminListAiChatMessagesReq {}
message AdminListAiChatMessagesResp {}
message AdminExportAiChatMessagesReq {}
message AdminExportAiChatMessagesResp {}
message AdminGetMemoryStatsReq {}
message AdminAnalyticsOverviewResp {}
message AdminListTopicTagsReq {}
message AdminListTopicTagsResp {}

service AdminInsights {
  rpc AdminListAiChatSessions(AdminListAiChatSessionsReq) returns (AdminListAiChatSessionsResp);
  rpc AdminListAiChatMessages(AdminListAiChatMessagesReq) returns (AdminListAiChatMessagesResp);
  rpc AdminExportAiChatMessages(AdminExportAiChatMessagesReq) returns (AdminExportAiChatMessagesResp);
  rpc AdminAnalyticsOverview(AdminGetMemoryStatsReq) returns (AdminAnalyticsOverviewResp);
  rpc AdminListTopicTags(AdminListTopicTagsReq) returns (AdminListTopicTagsResp);
}
