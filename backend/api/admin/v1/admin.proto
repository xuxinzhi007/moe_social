syntax = "proto3";

package admin.v1;

option go_package = "backend/api/admin/v1;adminv1";

// AdminApp — 管理后台域 SSOT（CRUD 与 api/defs/admin.api 对齐；Moe Brain/Flow 仍走 moeadmin service）。
// 实现：internal/service/admin + api/moehttp/admin_service_compat.go

message PingRequest {}
message PingReply {}

service AdminApp {
  rpc Ping(PingRequest) returns (PingReply);
}
