syntax = "proto3";

package user.v1;

option go_package = "backend/api/user/v1;userv1";

// User — 域 gRPC SSOT（P4-C；与 Super 并存）。
// HTTP: POST /api/auth/login, register; GET/PATCH /api/users/:user_id

message User {
  string id = 1;
  string username = 2;
  string email = 3;
  string avatar = 4;
  string signature = 5;
  string gender = 6;
  string birthday = 7;
  string created_at = 8;
  string updated_at = 9;
  bool is_vip = 10;
  string vip_expires_at = 11;
  bool auto_renew = 12;
  float balance = 13;
  string inventory = 14;
  string equipped_frame_id = 15;
  string moe_no = 16;
  int32 gift_charm = 17;
  double received_gift_value = 18;
  string display_user_id = 19;
  int32 message_retention_choice = 20;
  string feishu_email = 21;
  string feishu_name = 22;
  bool feishu_bound = 23;
  string role = 24;
  string wechat_nickname = 25;
  bool wechat_bound = 26;
  bool is_bot = 27;
  string bot_agent_key = 28;
}

message LoginRequest {
  string username = 1;
  string email = 2;
  string password = 3;
}

message LoginReply {
  User user = 1;
  string token = 2;
}

message RegisterRequest {
  string username = 1;
  string password = 2;
  string email = 3;
}

message RegisterReply {
  User user = 1;
  string token = 2;
}

message GetUserInfoRequest {
  string user_id = 1;
}

message GetUserInfoReply {
  User user = 1;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserReply {
  User user = 1;
}

message UpdateUserInfoRequest {
  string user_id = 1;
  string username = 2;
  string email = 3;
  string avatar = 4;
  string signature = 5;
  string gender = 6;
  string birthday = 7;
  string inventory = 8;
  string equipped_frame_id = 9;
  bool clear_equipped_frame = 10;
  string message_retention = 11;
}

message UpdateUserInfoReply {
  User user = 1;
}

service UserService {
  rpc Login(LoginRequest) returns (LoginReply);
  rpc Register(RegisterRequest) returns (RegisterReply);
  rpc GetUserInfo(GetUserInfoRequest) returns (GetUserInfoReply);
  rpc GetUser(GetUserRequest) returns (GetUserReply);
  rpc UpdateUserInfo(UpdateUserInfoRequest) returns (UpdateUserInfoReply);
}
