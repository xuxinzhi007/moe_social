}

message GetTransactionsReq {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message GetTransactionsResp {
  repeated Transaction transactions = 1;
  int32 total = 2;
}

message GetUnreadCountReq {
  string user_id = 1;
}

message GetUnreadCountResp {
  int32 count = 1;
}

message GetUserAvatarReq {
  string user_id = 1;
}

message GetUserAvatarResp {
