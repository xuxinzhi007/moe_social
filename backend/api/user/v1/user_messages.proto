}

message GetUserByEmailReq {
  string email = 1;
}

message GetUserByEmailResp {
  User user = 1;
}

message GetUserCountReq {
}

message GetUserCountResp {
  int32 count = 1;
}

message GetUserInfoReq {
  string user_id = 1;
}

message GetUserInfoResp {
  User user = 1;
}

message GetUserMemoriesReq {
  string user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetUserMemoriesResp {
  repeated UserMemory memories = 1;
  int64 total = 2;
  int32 limit = 3;
  int32 offset = 4;
  bool has_more = 5;
}

message GetUserReq {
  string user_id = 1;
}

message GetUserResp {
  User user = 1;
}

message GetUserUnlockedAchievementsReq {
  string user_id = 1;
}

message GetUserUnlockedAchievementsResp {
  repeated AchievementBadgeItem badges = 1;
}

message GetUsersReq {
  int32 page = 1;
  int32 page_size = 2;
}

message GetUsersResp {
  repeated User users = 1;
  int32 total = 2;
}

message ListFriendsReq {
