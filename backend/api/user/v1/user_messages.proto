syntax = "proto3";
package user.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

option go_package = "backend/api/user/v1;userv1";

// P6: extracted from rpc/defs/common.proto (105 messages)

message AcceptFriendRequestReq {
  string actor_user_id = 1;
  string request_id = 2;
  // HTTP path `/api/user/{user_id}/...` 绑定；服务层会回填 actor_user_id。
  string user_id = 3;
}

message AcceptFriendRequestResp {
  bool ok = 1;
}

message AchievementBadgeItem {
  string id = 1;
  string name = 2;
  string description = 3;
  string category = 4;
  string rarity = 5;
  string condition = 6;
  int32 required_count = 7;
  int32 current_count = 8;
  double progress = 9;
  bool is_unlocked = 10;
  string unlocked_at = 11;
}

message AvatarBaseConfig {
  string face_shape = 1;
  string skin_color = 2;
  string eye_type = 3;
  string hair_style = 4;
  string hair_color = 5;
}

message AvatarOutfitConfig {
  string clothes = 1;
  repeated string accessories = 2;
  string background = 3;
}

message BindFeishuReq {
  string user_id = 1;
  string feishu_email = 2;
}

message BindFeishuResp {
