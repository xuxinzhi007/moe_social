  string user_id = 2;
}

message ListFriendsResp {
  repeated User users = 1;
}

message ListIncomingFriendRequestsReq {
  string actor_user_id = 1;
  string user_id = 2;
}

message ListIncomingFriendRequestsResp {
  repeated FriendRequestView data = 1;
}

message ListOutgoingFriendRequestsReq {
  string actor_user_id = 1;
  string user_id = 2;
}

message ListOutgoingFriendRequestsResp {
  repeated FriendRequestView data = 1;
}

message ListPrivateConversationsReq {
  string viewer_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListPrivateConversationsResp {
  repeated PrivateConversation conversations = 1;
  int32 total = 2;
  int32 limit = 3;
  int32 offset = 4;
  bool has_more = 5;
}

message ListPrivateMessagesReq {
  string viewer_id = 1;
  string peer_id = 2;
  string before_id = 3;
  int32 limit = 4;
}

message ListPrivateMessagesResp {
  repeated PrivateMessage messages = 1;
  bool has_more = 2;
}

message ListUserDevicesReq {
  string user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListUserDevicesResp {
  repeated UserDeviceRecord devices = 1;
  int64 total = 2;
  int32 limit = 3;
  int32 offset = 4;
  bool has_more = 5;
}

message LoginReq {
  string username = 1;
  string email = 2;
  string password = 3;
}

message LoginResp {
  User user = 1;
  string token = 2;
}

message Notification {
  string id = 1;
  string user_id = 2;
  string sender_id = 3;
  string sender_name = 4;
  string sender_avatar = 5;
  int32 type = 6;
  string post_id = 7;
  string content = 8;
  bool is_read = 9;
  string created_at = 10;
}

message PrivateConversation {
  string peer_id = 1;
  string peer_name = 2;
  string peer_avatar = 3;
  string peer_moe_no = 4;
  string peer_display_user_id = 5;
  PrivateMessage last_message = 6;
  int32 unread_count = 7;
}

message PrivateMessage {
  string id = 1;
  string sender_id = 2;
  string receiver_id = 3;
  string body = 4;
  repeated string image_paths = 5;
  int32 retention_days = 6;
  string created_at = 7;
  string expires_at = 8;
  // 展示用 Moe 号（10 位）；查询入参仍用 sender_id/receiver_id 主键
  string sender_moe_no = 9;
  string receiver_moe_no = 10;
}

message ReadAllNotificationsReq {
  string user_id = 1;
}

message ReadAllNotificationsResp {
}

message ReadNotificationReq {
  string id = 1;
  string user_id = 2;
}

message ReadNotificationResp {
}

message RechargeReq {
  string user_id = 1;
  float amount = 2;
  string description = 3;
}

message RechargeResp {
  string message = 1;
  float new_balance = 2;
}

message RegisterReq {
  string username = 1;
  string password = 2;
  string email = 3;
}

message RegisterResp {
  User user = 1;
  string token = 2;
}

message RejectFriendRequestReq {
  string actor_user_id = 1;
  string request_id = 2;
  string user_id = 3;
}

message RejectFriendRequestResp {
  bool ok = 1;
}

message ResetPasswordReq {
  string email = 1;
  string new_password = 2;
}

message ResetPasswordResp {
}

message SendFeishuTestCardReq {
  string user_id = 1;
}

message SendFeishuTestCardResp {}

message SendFriendRequestReq {
  string actor_user_id = 1;
  string to_user_id = 2;
  string to_moe_no = 3;
  string user_id = 4;
}

message SendFriendRequestResp {
  FriendRequestView data = 1;
}

message SendPrivateMessageReq {
  string sender_id = 1;
  string receiver_id = 2;
  string body = 3;
  repeated string image_paths = 4;
}

message SendPrivateMessageResp {
  PrivateMessage message = 1;
}

message SyncUserDeviceReq {
  string user_id = 1;
  string device_id = 2;
  string platform = 3;
  string os_version = 4;
  string app_version = 5;
  string device_name = 6;
  string payload_json = 7;
  string last_seen = 8;
}

message SyncUserDeviceResp {
  UserDeviceRecord device = 1;
}

message Transaction {
  string id = 1;
  string user_id = 2;
  float amount = 3;
  string type = 4;
  string status = 5;
  string description = 6;
  string created_at = 7;
}

message UnbindFeishuReq {
  string user_id = 1;
}

message UnbindFeishuResp {
  User user = 1;
}

message UnfollowUserReq {
  string user_id = 1;
  string following_id = 2;
}

message UpdateUserAvatarReq {
  string user_id = 1;
  AvatarBaseConfig base_config = 2;
  AvatarOutfitConfig current_outfit = 3;
}

message UpdateUserAvatarResp {
  UserAvatarData avatar = 1;
}

message UpdateUserInfoReq {
  string user_id = 1;
  string username = 2;
  string email = 3;
  string avatar = 4;
  string signature = 5;   // 个性签名
  string gender = 6;      // 性别
  string birthday = 7;    // 生日
  string inventory = 8;
  string equipped_frame_id = 9;
  bool clear_equipped_frame = 10;
  // 空=不修改。auto=恢复自动；7 / 30 为自选保存天数（写入 users.message_retention_choice）
  string message_retention = 11;
}

message UpdateUserInfoResp {
  User user = 1;
}

message UpdateUserPasswordReq {
  string user_id = 1;
  string old_password = 2;
  string new_password = 3;
}

message UpdateUserPasswordResp {
}

message User {
  string id = 1;
  string username = 2;
  string email = 3;
  string avatar = 4;
  string signature = 5;   // 个性签名
  string gender = 6;      // 性别
  string birthday = 7;    // 生日
  string created_at = 8;
  string updated_at = 9;
  bool is_vip = 10;
  string vip_expires_at = 11;
  bool auto_renew = 12;
  float balance = 13; // 钱包余额
  string inventory = 14;
  string equipped_frame_id = 15;
  string moe_no = 16;
  // 收到他人赠送礼物累计：魅力点（与礼物标价挂钩）与面值总和（展示用）
  int32 gift_charm = 17;
  double received_gift_value = 18;
  // 与 moe_no 相同，个人中心等「对外展示账号」请用本字段或 moe_no；业务主键仍为 id
  string display_user_id = 19;
  // 0=自动（YAML+VIP）；7 或 30 为用户在设置里自选的私信保留天数（仅影响新消息）
  int32 message_retention_choice = 20;
  // 绑定的企业飞书邮箱（receive_id_type=email）
  string feishu_email = 21;
  // 飞书 OAuth 显示名（通知卡片「操作者」会附带）
  string feishu_name = 22;
  // 是否已通过飞书 OAuth 绑定
  bool feishu_bound = 23;
  string role = 24; // App 用户角色 user | admin | super_admin
  // 微信 OAuth 昵称
  string wechat_nickname = 25;
  // 是否已通过微信 OAuth 绑定
  bool wechat_bound = 26;
  // 社区 AI Bot 账号（由 moe_agent_runtimes 绑定）
  bool is_bot = 27;
  string bot_agent_key = 28;
}

message UserAvatarData {
  string user_id = 1;
  AvatarBaseConfig base_config = 2;
  AvatarOutfitConfig current_outfit = 3;
  repeated string owned_outfits = 4;
}

message UserDeviceRecord {
  string id = 1;
  string user_id = 2;
  string device_id = 3;
  string platform = 4;
  string os_version = 5;
  string app_version = 6;
  string device_name = 7;
  string payload_json = 8;
  string last_seen = 9;
  string created_at = 10;
  string updated_at = 11;
}

message UserMemory {
  string id = 1;
  string user_id = 2;
  string key = 3;
  string value = 4;
  string memory_type = 5;
  double confidence = 6;
  string source = 7;
  string created_at = 8;
  string updated_at = 9;
  string source_msg_id = 10;
  string session_id = 11;
}

message OutfitPart {
  string id = 1;
  string type = 2;
  string image_url = 3;
}

message AvatarOutfit {
  string id = 1;
  string name = 2;
  string description = 3;
  string category = 4;
  string style = 5;
  double price = 6;
  bool is_free = 7;
  string image_url = 8;
  repeated OutfitPart parts = 9;
  string created_at = 10;
}

message GetAvatarOutfitsReq {
  string category = 1;
  string style = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetAvatarOutfitsResp {
  repeated AvatarOutfit data = 1;
  int32 total = 2;
}

message GetAvatarOutfitReq {
  string outfit_id = 1;
}

message GetAvatarOutfitResp {
  AvatarOutfit data = 1;
}

message PurchaseAvatarOutfitReq {
  string outfit_id = 1;
  string user_id = 2;
}

message PurchaseAvatarOutfitResp {
  string data = 1;
}

message Emoji {
  string id = 1;
  string image_url = 2;
  repeated string tags = 3;
  bool is_animated = 4;
}

message EmojiPack {
  string id = 1;
  string name = 2;
  string description = 3;
  string author_name = 4;
  string category = 5;
  double price = 6;
  bool is_free = 7;
  string cover_image = 8;
  repeated Emoji emojis = 9;
  int32 download_count = 10;
}

message GetEmojiPacksReq {
  string category = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message GetEmojiPacksResp {
  repeated EmojiPack data = 1;
  int32 total = 2;
}

message GetEmojiPackReq {
  string pack_id = 1;
}

message GetEmojiPackResp {
  EmojiPack data = 1;
}

message FavoriteEmojiPackReq {
  string pack_id = 1;
  string user_id = 2;
}

message FavoriteEmojiPackResp {}

message PurchaseEmojiPackReq {
  string pack_id = 1;
  string user_id = 2;
}

message PurchaseEmojiPackResp {
  string data = 1;
}

message GetUserEmojiPacksReq {
  string user_id = 1;
}

message GetUserEmojiPacksResp {
  repeated EmojiPack data = 1;
}

message WechatAuthorizeURLReq {
  string state = 1;
  // website=开放平台网站应用扫码；mp=公众号网页授权（仅微信内）
  string flow = 2;
}

message WechatAuthorizeURLResp {
  string authorize_url = 1;
}

message WechatLoginReq {
  string code = 1;
  // app=移动应用 SDK；website=网站应用扫码；mp=公众号
  string flow = 2;
}

message WechatLoginResp {
  User user = 1;
  string token = 2;
  bool is_new_user = 3;
}

message RefreshTokenReq {}

message RefreshTokenResp {
  string token = 1;
}

message FeishuPublicConfigResp {
  string invite_url = 1;
  string help_text = 2;
  bool enabled = 3;
}

message DeleteMyAccountReq {}

message DeleteMyAccountResp {}

service UserService {
  rpc Login(LoginReq) returns (LoginResp) {
    option (google.api.http) = { post: "/api/user/login" body: "*" };
  }
  rpc Register(RegisterReq) returns (RegisterResp) {
    option (google.api.http) = { post: "/api/user/register" body: "*" };
  }
  rpc GetUserInfo(GetUserInfoReq) returns (GetUserInfoResp) {
    option (google.api.http) = { get: "/api/user/{user_id}" };
  }
  rpc GetUser(GetUserReq) returns (GetUserResp) {
    option (google.api.http) = { get: "/api/user/{user_id}/detail" };
  }
  rpc UpdateUserInfo(UpdateUserInfoReq) returns (UpdateUserInfoResp) {
    option (google.api.http) = { put: "/api/user/{user_id}" body: "*" };
  }
  rpc SyncUserDevice(SyncUserDeviceReq) returns (SyncUserDeviceResp) {
    option (google.api.http) = {
      post: "/api/user/{user_id}/devices/sync"
      body: "*"
    };
  }
  rpc ListUserDevices(ListUserDevicesReq) returns (ListUserDevicesResp) {
    option (google.api.http) = { get: "/api/user/{user_id}/devices" };
  }
  rpc ListFriends(ListFriendsReq) returns (ListFriendsResp) {
    option (google.api.http) = { get: "/api/user/{user_id}/friends" };
  }
  rpc GetFriendRelation(GetFriendRelationReq) returns (GetFriendRelationResp) {
    option (google.api.http) = {
      get: "/api/user/{user_id}/friends/status/{other_user_id}"
    };
  }
  rpc SendFriendRequest(SendFriendRequestReq) returns (SendFriendRequestResp) {
    option (google.api.http) = {
      post: "/api/user/{user_id}/friend-requests"
      body: "*"
    };
  }
  rpc AcceptFriendRequest(AcceptFriendRequestReq) returns (AcceptFriendRequestResp) {
    option (google.api.http) = {
      post: "/api/user/{user_id}/friend-requests/{request_id}/accept"
      body: "*"
    };
  }
  rpc RejectFriendRequest(RejectFriendRequestReq) returns (RejectFriendRequestResp) {
    option (google.api.http) = {
      post: "/api/user/{user_id}/friend-requests/{request_id}/reject"
      body: "*"
    };
  }
  rpc ListIncomingFriendRequests(ListIncomingFriendRequestsReq)
      returns (ListIncomingFriendRequestsResp) {
    option (google.api.http) = {
      get: "/api/user/{user_id}/friend-requests/incoming"
    };
  }
  rpc ListOutgoingFriendRequests(ListOutgoingFriendRequestsReq)
      returns (ListOutgoingFriendRequestsResp) {
    option (google.api.http) = {
      get: "/api/user/{user_id}/friend-requests/outgoing"
    };
  }
  rpc FeishuAuthorizeURL(FeishuAuthorizeURLReq) returns (FeishuAuthorizeURLResp) {
    option (google.api.http) = { get: "/api/auth/feishu/authorize-url" };
  }
  rpc FeishuLogin(FeishuLoginReq) returns (FeishuLoginResp) {
    option (google.api.http) = { post: "/api/auth/feishu/login" body: "*" };
  }
  rpc FeishuPublicConfig(google.protobuf.Empty) returns (FeishuPublicConfigResp) {
    option (google.api.http) = { get: "/api/auth/feishu/public-config" };
  }
  rpc WechatAuthorizeURL(WechatAuthorizeURLReq) returns (WechatAuthorizeURLResp) {
    option (google.api.http) = { get: "/api/auth/wechat/authorize-url" };
  }
  rpc WechatLogin(WechatLoginReq) returns (WechatLoginResp) {
    option (google.api.http) = { post: "/api/auth/wechat/login" body: "*" };
  }
  rpc RefreshToken(RefreshTokenReq) returns (RefreshTokenResp) {
    option (google.api.http) = { post: "/api/user/refresh-token" body: "*" };
  }
  rpc GetTransaction(GetTransactionReq) returns (GetTransactionResp) {
    option (google.api.http) = { get: "/api/transactions/{id}" };
  }
  rpc CheckFollow(CheckFollowReq) returns (CheckFollowResp) {
    option (google.api.http) = {
      get: "/api/user/{follower_id}/follow/{following_id}/check"
    };
  }
  rpc DeleteUser(DeleteUserReq) returns (DeleteUserResp) {
    option (google.api.http) = { delete: "/api/user/{user_id}" };
  }
  rpc FollowUser(FollowUserReq) returns (FollowUserResp) {
    option (google.api.http) = { post: "/api/user/{user_id}/follow" body: "*" };
  }
  rpc UnfollowUser(UnfollowUserReq) returns (FollowUserResp) {
    option (google.api.http) = { delete: "/api/user/{user_id}/follow" };
  }
  rpc GetFollowers(GetFollowersReq) returns (GetFollowersResp) {
    option (google.api.http) = { get: "/api/user/{user_id}/followers" };
  }
  rpc GetFollowings(GetFollowingsReq) returns (GetFollowingsResp) {
    option (google.api.http) = { get: "/api/user/{user_id}/following" };
  }
  rpc UpdateUserPassword(UpdateUserPasswordReq) returns (UpdateUserPasswordResp) {
    option (google.api.http) = { put: "/api/user/{user_id}/password" body: "*" };
  }
  rpc GetTransactions(GetTransactionsReq) returns (GetTransactionsResp) {
    option (google.api.http) = { get: "/api/user/{user_id}/transactions" };
  }
  rpc Recharge(RechargeReq) returns (RechargeResp) {
    option (google.api.http) = {
      post: "/api/user/{user_id}/wallet/recharge"
      body: "*"
    };
  }
  rpc GetUserByEmail(GetUserByEmailReq) returns (GetUserByEmailResp) {
    option (google.api.http) = { post: "/api/user/check-email" body: "*" };
  }
  rpc ResetPassword(ResetPasswordReq) returns (ResetPasswordResp) {
    option (google.api.http) = { post: "/api/user/reset-password" body: "*" };
  }
  rpc GetUsers(GetUsersReq) returns (GetUsersResp) {
    option (google.api.http) = { get: "/api/users" };
  }
  rpc GetUserCount(GetUserCountReq) returns (GetUserCountResp) {
    option (google.api.http) = { get: "/api/users/count" };
  }
  rpc DeleteMyAccount(DeleteMyAccountReq) returns (DeleteMyAccountResp) {
    option (google.api.http) = { delete: "/api/user/account" };
  }
  rpc BindFeishu(BindFeishuReq) returns (BindFeishuResp) {
    option (google.api.http) = { put: "/api/user/feishu/bind" body: "*" };
  }
  rpc UnbindFeishu(UnbindFeishuReq) returns (UnbindFeishuResp) {
    option (google.api.http) = { delete: "/api/user/feishu/bind" };
  }
  rpc SendFeishuTestCard(SendFeishuTestCardReq) returns (SendFeishuTestCardResp) {
    option (google.api.http) = { post: "/api/user/feishu/test-card" body: "*" };
  }
  rpc GetUserAvatar(GetUserAvatarReq) returns (GetUserAvatarResp) {
    option (google.api.http) = { get: "/api/avatar/{user_id}" };
  }
  rpc UpdateUserAvatar(UpdateUserAvatarReq) returns (UpdateUserAvatarResp) {
    option (google.api.http) = {
      put: "/api/avatar/{user_id}"
      body: "*"
    };
  }
  rpc GetAvatarOutfits(GetAvatarOutfitsReq) returns (GetAvatarOutfitsResp) {
    option (google.api.http) = { get: "/api/avatar/outfits" };
  }
  rpc GetAvatarOutfit(GetAvatarOutfitReq) returns (GetAvatarOutfitResp) {
    option (google.api.http) = { get: "/api/avatar/outfits/{outfit_id}" };
  }
  rpc PurchaseAvatarOutfit(PurchaseAvatarOutfitReq) returns (PurchaseAvatarOutfitResp) {
    option (google.api.http) = {
      post: "/api/avatar/outfits/{outfit_id}/purchase"
      body: "*"
    };
  }
  rpc GetEmojiPacks(GetEmojiPacksReq) returns (GetEmojiPacksResp) {
    option (google.api.http) = { get: "/api/emoji/packs" };
  }
  rpc GetEmojiPack(GetEmojiPackReq) returns (GetEmojiPackResp) {
    option (google.api.http) = { get: "/api/emoji/packs/{pack_id}" };
  }
  rpc FavoriteEmojiPack(FavoriteEmojiPackReq) returns (FavoriteEmojiPackResp) {
    option (google.api.http) = {
      post: "/api/emoji/packs/{pack_id}/favorite"
      body: "*"
    };
  }
  rpc PurchaseEmojiPack(PurchaseEmojiPackReq) returns (PurchaseEmojiPackResp) {
    option (google.api.http) = {
      post: "/api/emoji/packs/{pack_id}/purchase"
      body: "*"
    };
  }
  rpc GetUserEmojiPacks(GetUserEmojiPacksReq) returns (GetUserEmojiPacksResp) {
    option (google.api.http) = { get: "/api/user/{user_id}/emoji/packs" };
  }
}
