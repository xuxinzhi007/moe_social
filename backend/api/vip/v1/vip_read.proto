syntax = "proto3";

package vip.v1;

import "google/api/annotations.proto";

option go_package = "backend/api/vip/v1;vipv1";

// VipReadAdmin — PK-1 域 SSOT（勿再扩 api/defs/common.api）。
// HTTP: GET /api/admin/vip/plans?page=&page_size=&keyword=&include_deleted=
// 试点: make moe-kratos → :19032；生产灰度: moe.kratos_vip_http_enabled
message VipPlanView {
  uint64 id = 1;
  string name = 2;
  double price = 3;
  int32 duration_days = 4;
}

message ListPlansRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
}

message ListPlansReply {
  repeated VipPlanView items = 1;
  int64 total = 2;
}

service VipReadAdmin {
  rpc ListPlans(ListPlansRequest) returns (ListPlansReply) {
    option (google.api.http) = { get: "/api/admin/vip/plans" };
  }
}
