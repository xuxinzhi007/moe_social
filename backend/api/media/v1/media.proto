syntax = "proto3";

package media.v1;

import "google/api/annotations.proto";
import "google/api/httpbody.proto";

option go_package = "backend/api/media/v1;mediav1";

// Media — 用户图片上传/列表/静态服务（multipart + binary HTTP）。
// HTTP: GET    /api/images
// HTTP: DELETE /api/images/{filename}
// HTTP: GET    /api/images/{filename}
// HTTP: POST   /api/upload

message ImageInfo {
  string id = 1;
  string filename = 2;
  string url = 3;
  int64 size = 4;
  string created_at = 5;
}

message ListImagesRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListImagesReply {
  repeated ImageInfo images = 1;
  int32 total = 2;
}

message DeleteImageRequest {
  string filename = 1;
}

message DeleteImageReply {}

message UploadImageRequest {}

message UploadImageReply {
  string id = 1;
  string filename = 2;
  string url = 3;
  int64 size = 4;
  string created_at = 5;
}

message ServeImageRequest {
  string filename = 1;
}

service Media {
  rpc ListImages(ListImagesRequest) returns (ListImagesReply) {
    option (google.api.http) = { get: "/api/images" };
  }
  rpc DeleteImage(DeleteImageRequest) returns (DeleteImageReply) {
    option (google.api.http) = { delete: "/api/images/{filename}" };
  }
  rpc UploadImage(UploadImageRequest) returns (UploadImageReply) {
    option (google.api.http) = { post: "/api/upload" body: "*" };
  }
  rpc ServeImage(ServeImageRequest) returns (google.api.HttpBody) {
    option (google.api.http) = { get: "/api/images/{filename}" };
  }
}
