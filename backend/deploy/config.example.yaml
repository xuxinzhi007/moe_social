# Deploy Agent 配置（复制为 config.yaml 后修改，勿提交密钥）

listen: "127.0.0.1:9100"
token: "change-me-to-a-long-random-string"

# 本机路径：相对 backend/deploy/config.yaml 解析，换电脑/目录只要仓库结构不变即可
# 也可用绝对路径，或环境变量 MOE_DEPLOY_WORKSPACE 覆盖
workspace_root: "../.."
backend_dir: "backend"
compose_file: "docker-compose.binary.yml"

# 任务默认超时（秒）
job_timeout_seconds: 1800

# 部署目标：本机 Agent（Flutter/编译）+ 云平台 SSH（仅 Docker compose）
targets:
  - id: local
    label: "本机（运行 Agent 的电脑）"
    kind: local
  - id: cloud
    label: "云平台 47.106.175.49"
    kind: ssh
    host: "47.106.175.49"
    port: 22
    user: "root"
    password: "123456xxZ."
    # 认证二选一（推荐密钥；password 仅写在 config.yaml，勿提交 Git）
    # identity_file: "~/.ssh/id_ed25519"
    # password: "你的root密码"
    # VPS 上 backend 绝对路径（必须与服务器实际目录一致）
    backend_dir: "/root/gowork/moe_social/backend"
    compose_file: "docker-compose.binary.yml"
    api_base_url: "http://47.106.175.49:8888"

github:
  owner: "xuxinzhi007"
  repo: "moe_social"
  # 可选：用于触发 workflow_dispatch、查询 Release
  token: ""
  workflow_id: "flutter-release.yml"
