# Deploy Agent 配置（复制为 config.yaml 后修改，勿提交密钥）
# 端口规范：docs/dev/ports.md（Moe 专属 19010–19019）

listen: "127.0.0.1:19010"
token: "change-me-to-a-long-random-string"

# 本机路径：相对 backend/deploy/config.yaml 解析，换电脑/目录只要仓库结构不变即可
# 也可用绝对路径，或环境变量 MOE_DEPLOY_WORKSPACE 覆盖
workspace_root: "../.."
backend_dir: "backend"
compose_file: "docker-compose.binary.yml"

# 任务默认超时（秒）
job_timeout_seconds: 1800

# RPC debug API（make rpc-debug 后 :19011）；Agent 将 /debug/* 转发到此地址
rpc_debug_upstream: "http://127.0.0.1:19011"

# Windows 本机任务 shell：auto（已装 Git 则用 Git Bash，与「Git Bash 终端」PATH 一致）| git-bash | cmd
# 也可用环境变量 MOE_DEPLOY_WINDOWS_SHELL=git-bash
windows_shell: auto

# 本机任务额外 PATH（可选）。Win 分号分隔，Mac 冒号。无 Git 且 cmd 找不到 go 时可填 Go/flutter 的 bin
# local_path_extra: "C:\\Go\\bin;C:\\src\\flutter\\bin"

# 运维台本机构建专用缓存（Go GOCACHE + 临时目录），默认 backend/deploy/.moe-build-cache
# 可改为绝对路径（如 D:/moe-deploy-cache），或环境变量 MOE_DEPLOY_BUILD_CACHE
# build_cache_dir: ".moe-build-cache"

# 私密覆盖（可选）：复制 config.local.example.yaml → config.local.yaml（同样 gitignore）
# 与 config.yaml 合并，便于 Win/Mac 只同步一小段 token/SSH，见 docs/dev/deploy-platform.md

# 部署目标：本机开发/编二进制 · 云 VPS 仅 backend + docker compose（前端 APK 走 GitHub tag）
targets:
  - id: local
    label: "本机 · 开发 / 编 Linux 包"
    kind: local
    api_base_url: "http://127.0.0.1:8888"
  - id: cloud
    label: "云 VPS · /root/gowork/backend"
    kind: ssh
    host: "47.106.175.49"
    port: 22
    user: "root"
    # 认证二选一（仅写在 config.yaml，勿提交 Git）
    # identity_file: "~/.ssh/id_ed25519"
    # password: "你的root密码"
    # VPS：仅 backend 目录（二进制 + docker-compose.binary.yml），镜像数据在 /root/gowork/moe_images
    backend_dir: "/root/gowork/backend"
    compose_file: "docker-compose.binary.yml"
    api_base_url: "http://47.106.175.49:8888"

github:
  owner: "xuxinzhi007"
  repo: "moe_social"
  # 可选：用于触发 workflow_dispatch、查询 Release
  token: ""
  workflow_id: "flutter-release.yml"
