/* Moe Social Brand Design System — 萌系梦幻柔和 */
/* Extracted from Flutter project tokens: moe_tokens.dart, moe_theme_extension.dart, ai_brand_tokens.dart */

:root {
  /* ===== Primary Palette — 糖果渐变色系 ===== */
  --color-primary: #7F7FD5;
  --color-primary-light: #9B9FE3;
  --color-primary-lighter: #B7BAF0;
  --color-primary-lightest: #D4D5F6;
  --color-primary-dark: #5F5FBB;
  --color-primary-darker: #3F3FA1;

  --color-secondary: #86A8E7;
  --color-secondary-light: #A0BFEF;
  --color-secondary-lighter: #BBD5F6;
  --color-secondary-darker: #5E88C8;

  --color-tertiary: #91EAE4;
  --color-tertiary-light: #ADF0EC;
  --color-tertiary-lighter: #C8F5F2;
  --color-tertiary-darker: #6DD5CF;

  /* ===== Neutrals ===== */
  --color-bg: #F5F7FA;
  --color-bg-elevated: #FFFFFF;
  --color-bg-sunken: #EEEEF2;

  --color-text-primary: #333333;
  --color-text-secondary: #666666;
  --color-text-hint: #9E9E9E;
  --color-text-disabled: #BDBDBD;

  --color-text-inverse: #FFFFFF;

  /* ===== Semantic Colors ===== */
  --state-success: #00A86B;
  --state-warning: #E6A700;
  --state-error: #E94057;
  --state-info: #2563EB;

  --state-success-bg: #F0FDF4;
  --state-error-bg: #FEF2F2;
  --state-info-bg: #EFF6FF;
  --state-warning-bg: #FFFBEB;

  /* ===== Interaction Colors ===== */
  --color-like: #FF4757;
  --color-online: #00C853;
  --color-offline: #BDBDBD;

  /* ===== Gradients ===== */
  --gradient-primary: linear-gradient(135deg, #7F7FD5 0%, #86A8E7 100%);
  --gradient-hero: linear-gradient(135deg, #7F7FD5 0%, #86A8E7 50%, #91EAE4 100%);
  --gradient-aurora: linear-gradient(135deg, #E0C3FC 0%, #8EC5FC 50%, #91EAE4 100%);
  --gradient-ai-bubble: linear-gradient(135deg, #8A2387 0%, #E94057 100%);

  /* ===== Radius Scale — 圆润萌系 ===== */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-3xl: 28px;
  --radius-full: 9999px;
  --radius-button: 25px;
  --radius-input: 15px;

  /* ===== Shadows — 彩色柔和阴影 ===== */
  --shadow-card: 0 8px 16px rgba(127, 127, 213, 0.08);
  --shadow-card-lg: 0 10px 24px rgba(127, 127, 213, 0.08);
  --shadow-float: 0 20px 40px rgba(127, 127, 213, 0.12);
  --shadow-button: 0 4px 12px rgba(127, 127, 213, 0.4);
  --shadow-bottom-bar: 0 -5px 20px rgba(0, 0, 0, 0.05), 0 4px 12px rgba(127, 127, 213, 0.1);
  --shadow-compact: 0 5px 10px rgba(127, 127, 213, 0.08);

  /* ===== Typography ===== */
  --font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;

  --text-display: 700 28px/1.2 var(--font-family);
  --text-title: 700 22px/1.3 var(--font-family);
  --text-subtitle: 600 18px/1.4 var(--font-family);
  --text-body: 400 15px/1.6 var(--font-family);
  --text-body-sm: 400 14px/1.5 var(--font-family);
  --text-caption: 400 12px/1.35 var(--font-family);
  --text-overline: 500 11px/1.2 var(--font-family);
  --text-mono: 500 13px/1.4 'SF Mono', 'Fira Code', 'Roboto Mono', monospace;

  /* ===== Spacing ===== */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;

  /* ===== Motion ===== */
  --duration-fast: 200ms;
  --duration-normal: 300ms;
  --duration-slow: 500ms;
  --duration-breath: 1200ms;
  --ease-bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
  --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1);

  /* ===== Component specifics ===== */
  --bottom-bar-radius: 32px;
  --bottom-bar-padding: 8px 20px;
  --card-padding: 20px;
  --section-gap: 12px;
  --page-padding: 16px;

  /* ===== Dark mode ===== */
  --dark-bg: #121212;
  --dark-card: #1E1E1E;
  --dark-surface: #2C2C2C;
  --dark-text-primary: #E0E0E0;
  --dark-text-secondary: #AAAAAA;
  --dark-shadow-card: 0 8px 16px rgba(0, 0, 0, 0.3);
}

/* ===== Utility Classes ===== */
.text-gradient-primary {
  background: var(--gradient-hero);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.bg-primary-gradient {
  background: var(--gradient-primary);
}

.bg-hero-gradient {
  background: var(--gradient-hero);
}

.bg-aurora-gradient {
  background: var(--gradient-aurora);
}

.card-moe {
  background: var(--color-bg-elevated);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
}

.btn-moe-primary {
  background: var(--color-primary);
  color: var(--color-text-inverse);
  border-radius: var(--radius-button);
  height: 50px;
  font-weight: 600;
  font-size: 15px;
  box-shadow: var(--shadow-button);
  transition: transform 200ms var(--ease-bounce), box-shadow 200ms var(--ease-smooth);
}

.btn-moe-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(127, 127, 213, 0.5);
}

.input-moe {
  background: #F5F5F5;
  border-radius: var(--radius-input);
  border: 2px solid transparent;
  padding: 16px 20px;
  font-size: 15px;
  transition: border-color 200ms var(--ease-smooth);
}

.input-moe:focus {
  border-color: var(--color-primary);
  outline: none;
}

.bottom-bar-moe {
  background: var(--color-bg-elevated);
  border-radius: var(--bottom-bar-radius);
  box-shadow: var(--shadow-bottom-bar);
  padding: var(--bottom-bar-padding);
}

.fade-in-up {
  animation: fadeInUp var(--duration-normal) var(--ease-smooth) both;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes breathe {
  0%, 100% { transform: scale(0.85); opacity: 0.6; }
  50% { transform: scale(1.0); opacity: 1.0; }
}

@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 8px rgba(127, 127, 213, 0.3); }
  50% { box-shadow: 0 0 20px rgba(127, 127, 213, 0.6); }
}

    <style>
    /* ===== Reset & Base ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font: var(--text-body);
      background: var(--color-bg);
      color: var(--color-text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      min-height: 100vh;
    }
    a { text-decoration: none; color: inherit; }
    button { border: none; background: none; cursor: pointer; font: inherit; color: inherit; }
    img { display: block; max-width: 100%; }
    main { padding-bottom: 88px; }

    /* ===== Profile Header — SliverAppBar(expandedHeight: 340, backgroundColor: moe.primary) ===== */
    .profile-header {
      position: relative;
      min-height: 340px;
      overflow: hidden;
    }
    .profile-header__bg {
      position: absolute;
      inset: 0;
      background: var(--gradient-hero);
    }
    .profile-header__overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 45%, rgba(0,0,0,0.12) 100%);
    }

    /* Pinned AppBar row — centered title, white icons */
    .profile-header__appbar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px var(--page-padding, 16px);
      padding-top: env(safe-area-inset-top, 48px);
    }
    .profile-header__appbar-spacer {
      width: 44px;
      flex-shrink: 0;
    }
    .profile-header__appbar-title {
      /* Flutter: TextStyle(color: white, fontWeight: bold, fontSize: 18) */
      font: 700 18px/1.2 var(--font-family);
      color: #FFFFFF;
      text-align: center;
    }
    .profile-header__appbar-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }
    .profile-header__action-btn {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      border-radius: 50%;
      transition: background var(--duration-fast);
    }
    .profile-header__action-btn:active {
      background: rgba(255,255,255,0.15);
    }

    /* Header content area */
    .profile-header__content {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 20px 24px;
    }

    /* Avatar — DynamicAvatar(size: 78) with white border ring (padding: 3.5) */
    .profile-header__avatar-area {
      position: relative;
      margin-bottom: 10px;
    }
    .profile-header__avatar-glow {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: var(--color-primary);
      opacity: 0.38;
      filter: blur(18px);
    }
    .profile-header__avatar-ring {
      position: relative;
      width: 85px;
      height: 85px;
      border-radius: 50%;
      background: #FFFFFF;
      padding: 3.5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .profile-header__avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 600;
      color: var(--color-text-inverse);
    }

    /* Username */
    .profile-header__username {
      /* Flutter: fontSize 22, fontWeight w800, white */
      font-size: 22px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: 0.3px;
      margin-bottom: 8px;
      text-align: center;
    }

    /* Signature — white 0.7 opacity */
    .profile-header__signature {
      font-size: 13px;
      line-height: 1.35;
      color: rgba(255, 255, 255, 0.7);
      text-align: center;
      max-width: 280px;
      margin-bottom: 12px;
    }

    /* Moe-No + Level pills — glass morphism style */
    .profile-header__pills {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .profile-header__pill {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: 9999px;
      /* Glass morphism: white 0.18 alpha background */
      background: rgba(255, 255, 255, 0.18);
      cursor: pointer;
      transition: background var(--duration-fast);
    }
    .profile-header__pill:active {
      background: rgba(255, 255, 255, 0.28);
    }
    .profile-header__pill-text {
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Stats row — glass morphism BackdropFilter */
    .profile-header__stats-bar {
      width: 100%;
      border-radius: 22px;
      /* Glass morphism effect */
      background: rgba(255, 255, 255, 0.26);
      border: 1px solid rgba(255, 255, 255, 0.42);
      /* BackdropFilter blur simulation */
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 11px 8px;
      display: flex;
      align-items: center;
    }
    .profile-header__stat-item {
      flex: 1;
      text-align: center;
      padding: 4px 8px;
    }
    .profile-header__stat-value {
      /* Flutter: fontSize 19, fontWeight w800, Color(0xFF1E1E2E) */
      font-size: 19px;
      font-weight: 800;
      color: #1E1E2E;
      line-height: 1.05;
    }
    .profile-header__stat-label {
      /* Flutter: fontSize 11, fontWeight w600, Color(0xFF1E1E2E) 0.52 alpha */
      font-size: 11px;
      font-weight: 600;
      color: rgba(30, 30, 46, 0.52);
      margin-top: 4px;
    }
    .profile-header__stat-divider {
      width: 1px;
      height: 32px;
      background: rgba(255, 255, 255, 0.35);
      flex-shrink: 0;
    }

    /* ===== Below SliverAppBar body ===== */
    .profile-body {
      padding: 10px 16px 84px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* ===== Quick Actions Row — 4 cards ~120px ===== */
    .quick-actions-row {
      /* Flutter: Container(padding: 8, color: white 0.65, borderRadius: 24) */
      background: rgba(255, 255, 255, 0.65);
      border-radius: 24px;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
    }
    .quick-action-card {
      /* Each card: white, borderRadius: 20, height 120 */
      background: #FFFFFF;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 4px;
      height: 120px;
      cursor: pointer;
      transition: transform var(--duration-fast);
      position: relative;
    }
    .quick-action-card:active {
      transform: scale(0.96);
    }
    .quick-action-card__icon-circle {
      /* Flutter: Container(color: iconColor 0.14 alpha, shape: circle, 40x40) */
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .quick-action-card__text {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 7px;
      width: 100%;
    }
    .quick-action-card__label {
      /* Flutter: fontSize 12, fontWeight w700, Color(0xFF2F3142) */
      font-size: 12px;
      font-weight: 700;
      color: #2F3142;
      line-height: 1.25;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .quick-action-card__subtitle {
      /* Flutter: fontSize 10.5, fontWeight w600, Color(0xFF76798D) */
      font-size: 10.5px;
      font-weight: 600;
      color: #76798D;
      line-height: 1.2;
      margin-top: 3px;
      text-align: center;
    }

    /* ===== Menu Sections ===== */
    .menu-section {
      display: flex;
      flex-direction: column;
    }
    .menu-section__title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      padding-left: 4px;
    }
    .menu-section__title-bar {

      width: 4px;
      height: 16px;
      border-radius: 2px;
      background: var(--color-primary);
      flex-shrink: 0;
    }
    .menu-section__title span {
      /* Flutter: fontSize 15, fontWeight w800, Color(0xFF2D2D3D) */
      font-size: 15px;
      font-weight: 800;
      color: #2D2D3D;
      letter-spacing: 0.2px;
    }

    /* MoeMenuCard — 24px radius, cardShadow */
    .menu-section__card {
      background: #FFFFFF;
      border-radius: 24px;
      box-shadow: 0 6px 16px rgba(127, 127, 213, 0.07);
      overflow: hidden;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px 20px;
      cursor: pointer;
      transition: background var(--duration-fast);
    }
    .menu-item:active {
      background: var(--color-bg, #F5F7FA);
    }
    .menu-item__icon-wrap {
      /* Flutter: Container(padding: 9, color: item.color 0.12 alpha, borderRadius: 13) */
      width: 39px;
      height: 39px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .menu-item__text {
      flex: 1;
      min-width: 0;
    }
    .menu-item__title {
      /* Flutter: fontWeight w600, fontSize 15, Color(0xFF333333) */
      font-size: 15px;
      font-weight: 600;
      color: #333333;
    }
    .menu-item__title--destructive {
      color: #E94057;
    }
    .menu-item__subtitle {
      /* Flutter: fontSize 12, color: Colors.grey[400] */
      font-size: 12px;
      color: #9E9E9E;
      margin-top: 2px;
    }
    .menu-item__chevron {
      flex-shrink: 0;
      opacity: 0.6;
    }
    .menu-item__divider {
      /* Flutter: Padding(left: 60, right: 20), Divider(height: 1, color: grey 0.08 alpha) */
      margin-left: 60px;
      margin-right: 20px;
      height: 1px;
      background: rgba(0, 0, 0, 0.06);
    }

    /* ===== Tab Shell Styles ===== */
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 48px;
      text-decoration: none;
      color: var(--color-text-hint, #9E9E9E);
      transition: color var(--duration-fast, 200ms) var(--ease-smooth, cubic-bezier(0.4, 0, 0.2, 1));
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .tab-label {
      font-size: 10px;
      line-height: 1;
      margin-top: 3px;
      font-weight: 400;
      font-family: var(--font-family, 'Roboto', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif);
      transition: font-weight var(--duration-fast, 200ms) var(--ease-smooth, cubic-bezier(0.4, 0, 0.2, 1));
    }
    .tab-icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }
    .tab-item .tab-icon--outline { display: block; }
    .tab-item .tab-icon--filled { display: none; }
    .tab-item.is-active { color: var(--color-primary, #7F7FD5); }
    .tab-item.is-active .tab-label { font-weight: 500; }
    .tab-item.is-active .tab-icon--outline { display: none; }
    .tab-item.is-active .tab-icon--filled { display: block; }
    nav[data-active-tab="home"]    .tab-item[data-tab="home"],
    nav[data-active-tab="messages"] .tab-item[data-tab="messages"],
    nav[data-active-tab="ai"]       .tab-item[data-tab="ai"],
    nav[data-active-tab="profile"] .tab-item[data-tab="profile"] {
      color: var(--color-primary, #7F7FD5);
      font-weight: 500;
    }
    nav[data-active-tab="home"]    .tab-item[data-tab="home"] .tab-label,
    nav[data-active-tab="messages"] .tab-item[data-tab="messages"] .tab-label,
    nav[data-active-tab="ai"]       .tab-item[data-tab="ai"] .tab-label,
    nav[data-active-tab="profile"] .tab-item[data-tab="profile"] .tab-label {
      font-weight: 500;
    }
    nav[data-active-tab="home"]    .tab-item[data-tab="home"] .tab-icon--outline,
    nav[data-active-tab="messages"] .tab-item[data-tab="messages"] .tab-icon--outline,
    nav[data-active-tab="ai"]       .tab-item[data-tab="ai"] .tab-icon--outline,
    nav[data-active-tab="profile"] .tab-item[data-tab="profile"] .tab-icon--outline {
      display: none;
    }
    nav[data-active-tab="home"]    .tab-item[data-tab="home"] .tab-icon--filled,
    nav[data-active-tab="messages"] .tab-item[data-tab="messages"] .tab-icon--filled,
    nav[data-active-tab="ai"]       .tab-item[data-tab="ai"] .tab-icon--filled,
    nav[data-active-tab="profile"] .tab-item[data-tab="profile"] .tab-icon--filled {
      display: block;
    }
  </style>
