<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 萌社</title>
    <style id="theme-vars">
/* Moe Social Brand Design System — 萌系梦幻柔和 */
/* Extracted from Flutter project tokens: moe_tokens.dart, moe_theme_extension.dart, ai_brand_tokens.dart */

:root {
  /* ===== Primary Palette — 糖果渐变色系 ===== */
  --color-primary: #7F7FD5;
  --color-primary-light: #9B9FE3;
  --color-primary-lighter: #B7BAF0;
  --color-primary-lightest: #D4D5F6;
  --color-primary-dark: #5F5FBB;
  --color-primary-darker: #3F3FA1;

  --color-secondary: #86A8E7;
  --color-secondary-light: #A0BFEF;
  --color-secondary-lighter: #BBD5F6;
  --color-secondary-darker: #5E88C8;

  --color-tertiary: #91EAE4;
  --color-tertiary-light: #ADF0EC;
  --color-tertiary-lighter: #C8F5F2;
  --color-tertiary-darker: #6DD5CF;

  /* ===== Neutrals ===== */
  --color-bg: #F5F7FA;
  --color-bg-elevated: #FFFFFF;
  --color-bg-sunken: #EEEEF2;

  --color-text-primary: #333333;
  --color-text-secondary: #666666;
  --color-text-hint: #9E9E9E;
  --color-text-disabled: #BDBDBD;

  --color-text-inverse: #FFFFFF;

  /* ===== Semantic Colors ===== */
  --state-success: #00A86B;
  --state-warning: #E6A700;
  --state-error: #E94057;
  --state-info: #2563EB;

  --state-success-bg: #F0FDF4;
  --state-error-bg: #FEF2F2;
  --state-info-bg: #EFF6FF;
  --state-warning-bg: #FFFBEB;

  /* ===== Interaction Colors ===== */
  --color-like: #FF4757;
  --color-online: #00C853;
  --color-offline: #BDBDBD;

  /* ===== Gradients ===== */
  --gradient-primary: linear-gradient(135deg, #7F7FD5 0%, #86A8E7 100%);
  --gradient-hero: linear-gradient(135deg, #7F7FD5 0%, #86A8E7 50%, #91EAE4 100%);
  --gradient-aurora: linear-gradient(135deg, #E0C3FC 0%, #8EC5FC 50%, #91EAE4 100%);
  --gradient-ai-bubble: linear-gradient(135deg, #8A2387 0%, #E94057 100%);

  /* ===== Radius Scale — 圆润萌系 ===== */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-3xl: 28px;
  --radius-full: 9999px;
  --radius-button: 25px;
  --radius-input: 15px;

  /* ===== Shadows — 彩色柔和阴影 ===== */
  --shadow-card: 0 8px 16px rgba(127, 127, 213, 0.08);
  --shadow-card-lg: 0 10px 24px rgba(127, 127, 213, 0.08);
  --shadow-float: 0 20px 40px rgba(127, 127, 213, 0.12);
  --shadow-button: 0 4px 12px rgba(127, 127, 213, 0.4);
  --shadow-bottom-bar: 0 -5px 20px rgba(0, 0, 0, 0.05), 0 4px 12px rgba(127, 127, 213, 0.1);
  --shadow-compact: 0 5px 10px rgba(127, 127, 213, 0.08);

  /* ===== Typography ===== */
  --font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;

  --text-display: 700 28px/1.2 var(--font-family);
  --text-title: 700 22px/1.3 var(--font-family);
  --text-subtitle: 600 18px/1.4 var(--font-family);
  --text-body: 400 15px/1.6 var(--font-family);
  --text-body-sm: 400 14px/1.5 var(--font-family);
  --text-caption: 400 12px/1.35 var(--font-family);
  --text-overline: 500 11px/1.2 var(--font-family);
  --text-mono: 500 13px/1.4 'SF Mono', 'Fira Code', 'Roboto Mono', monospace;

  /* ===== Spacing ===== */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;

  /* ===== Motion ===== */
  --duration-fast: 200ms;
  --duration-normal: 300ms;
  --duration-slow: 500ms;
  --duration-breath: 1200ms;
  --ease-bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
  --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1);

  /* ===== Component specifics ===== */
  --bottom-bar-radius: 32px;
  --bottom-bar-padding: 8px 20px;
  --card-padding: 20px;
  --section-gap: 12px;
  --page-padding: 16px;

  /* ===== Dark mode ===== */
  --dark-bg: #121212;
  --dark-card: #1E1E1E;
  --dark-surface: #2C2C2C;
  --dark-text-primary: #E0E0E0;
  --dark-text-secondary: #AAAAAA;
  --dark-shadow-card: 0 8px 16px rgba(0, 0, 0, 0.3);
}

/* ===== Utility Classes ===== */
.text-gradient-primary {
  background: var(--gradient-hero);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.bg-primary-gradient {
  background: var(--gradient-primary);
}

.bg-hero-gradient {
  background: var(--gradient-hero);
}

.bg-aurora-gradient {
  background: var(--gradient-aurora);
}

.card-moe {
  background: var(--color-bg-elevated);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
}

.btn-moe-primary {
  background: var(--color-primary);
  color: var(--color-text-inverse);
  border-radius: var(--radius-button);
  height: 50px;
  font-weight: 600;
  font-size: 15px;
  box-shadow: var(--shadow-button);
  transition: transform 200ms var(--ease-bounce), box-shadow 200ms var(--ease-smooth);
}

.btn-moe-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(127, 127, 213, 0.5);
}

.input-moe {
  background: #F5F5F5;
  border-radius: var(--radius-input);
  border: 2px solid transparent;
  padding: 16px 20px;
  font-size: 15px;
  transition: border-color 200ms var(--ease-smooth);
}

.input-moe:focus {
  border-color: var(--color-primary);
  outline: none;
}

.bottom-bar-moe {
  background: var(--color-bg-elevated);
  border-radius: var(--bottom-bar-radius);
  box-shadow: var(--shadow-bottom-bar);
  padding: var(--bottom-bar-padding);
}

.fade-in-up {
  animation: fadeInUp var(--duration-normal) var(--ease-smooth) both;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes breathe {
  0%, 100% { transform: scale(0.85); opacity: 0.6; }
  50% { transform: scale(1.0); opacity: 1.0; }
}

@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 8px rgba(127, 127, 213, 0.3); }
  50% { box-shadow: 0 0 20px rgba(127, 127, 213, 0.6); }
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-secondary: var(--color-secondary);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">

  <!-- AuthBackground: white base + subtle gradient + 3 animated gradient circles -->
  <main class="relative min-h-screen overflow-hidden" style="background: linear-gradient(to bottom, #FDFBFD, #F4F7F9);">

    <!-- Animated gradient circle 1: top-left (light purple) -->
    <div class="auth-circle auth-circle--1"></div>
    <!-- Animated gradient circle 2: right-center (light blue) -->
    <div class="auth-circle auth-circle--2"></div>
    <!-- Animated gradient circle 3: bottom-left (mint) -->
    <div class="auth-circle auth-circle--3"></div>

    <!-- Content layer -->
    <div class="relative min-h-screen">

      <!-- Back button: top-left -->
      <a href="#login" data-dom-id="back-login"
        style="
          position: absolute;
          top: 10px;
          left: 10px;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          width: 40px;
          height: 40px;
          z-index: 10;
          text-decoration: none;
          cursor: pointer;
          border-radius: 50%;
        ">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" fill="rgba(0,0,0,0.54)"/>
        </svg>
      </a>

      <!-- Centered form -->
      <div class="flex flex-col items-center" style="padding: 60px 32px 40px 32px; min-height: 100vh;">

        <!-- Title -->
        <div class="fade-in-up" style="animation-delay: 0ms;">
          <h1 style="
            font-size: 28px;
            font-weight: 900;
            color: #333333;
            letter-spacing: 1px;
            margin: 0;
            text-align: center;
            font-family: var(--font-family);
          ">创建账号</h1>
          <p style="
            font-size: 15px;
            color: #9E9E9E;
            letter-spacing: 1px;
            margin: 8px 0 0 0;
            text-align: center;
            font-family: var(--font-family);
          ">开始你的萌系社交之旅</p>
        </div>

        <div style="height: 40px;"></div>

        <!-- Form fields: MoeInputField style (white bg, rounded 24px, shadow) -->
        <div class="fade-in-up" style="width: 100%; animation-delay: 200ms;">

          <!-- Username input with person icon -->
          <div style="margin-bottom: 20px;">
            <div class="moe-input-field">
              <svg class="moe-input-field__icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="rgba(127, 127, 213, 0.6)"/>
              </svg>
              <input type="text" placeholder="用户名" />
            </div>
          </div>

          <!-- Email input with email icon -->
          <div style="margin-bottom: 20px;">
            <div class="moe-input-field">
              <svg class="moe-input-field__icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" fill="rgba(127, 127, 213, 0.6)"/>
              </svg>
              <input type="email" placeholder="电子邮箱" />
            </div>
          </div>

          <!-- Password input with lock icon -->
          <div style="margin-bottom: 20px;">
            <div class="moe-input-field">
              <svg class="moe-input-field__icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM12 17c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z" fill="rgba(127, 127, 213, 0.6)"/>
              </svg>
              <input type="password" placeholder="设置密码" />
              <button class="moe-input-field__eye" onclick="toggleRegPassword('password-reg-1', this)">
                <i data-lucide="eye-off" style="width: 20px; height: 20px; color: #BDBDBD;"></i>
              </button>
            </div>
          </div>

          <!-- Confirm password input with lock icon -->
          <div style="margin-bottom: 40px;">
            <div class="moe-input-field">
              <svg class="moe-input-field__icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM12 17c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z" fill="rgba(127, 127, 213, 0.6)"/>
              </svg>
              <input type="password" id="password-reg-1" placeholder="确认密码" />
              <button class="moe-input-field__eye" onclick="toggleRegPassword('password-reg-2', this)">
                <i data-lucide="eye-off" style="width: 20px; height: 20px; color: #BDBDBD;"></i>
              </button>
            </div>
          </div>

          <!-- Register button: solid #7F7FD5, height 56, radius 28, elevation 8 -->
          <button data-dom-id="register-submit" style="
            width: 100%;
            height: 56px;
            border: none;
            border-radius: 28px;
            background-color: #7F7FD5;
            color: #FFFFFF;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(127, 127, 213, 0.4);
            font-family: var(--font-family);
            transition: transform 200ms var(--ease-bounce), box-shadow 200ms var(--ease-smooth);
          ">注 册</button>

        </div>

        <div style="height: 30px;"></div>

        <!-- Bottom: already have account? -->
        <div class="fade-in-up" style="animation-delay: 400ms;">
          <p style="
            margin: 0;
            font-size: 14px;
            font-family: var(--font-family);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
          ">
            <span style="color: #9E9E9E;">已有账户?</span>
            <a href="#login" style="
              color: #7F7FD5;
              font-weight: bold;
              text-decoration: none;
              padding: 6px;
              border-radius: 14px;
              margin-left: 6px;
            ">直接登录</a>
          </p>
        </div>

        <div style="height: 40px;"></div>
      </div>
    </div>
  </main>

  <style>
    /* ===== Auth Background Animated Circles ===== */
    .auth-circle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }
    .auth-circle--1 {
      top: -100px;
      left: -50px;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(224, 195, 252, 0.4) 0%, transparent 70%);
      animation: authCircleFloat1 10s ease-in-out infinite alternate;
    }
    .auth-circle--2 {
      top: 200px;
      right: -100px;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(142, 197, 252, 0.4) 0%, transparent 60%);
      animation: authCircleFloat2 10s ease-in-out infinite alternate;
    }
    .auth-circle--3 {
      bottom: -50px;
      left: -50px;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(145, 234, 228, 0.4) 0%, transparent 70%);
      animation: authCircleFloat3 10s ease-in-out infinite alternate;
    }
    @keyframes authCircleFloat1 {
      0% { transform: translate(0, 0); }
      100% { transform: translate(30px, 30px); }
    }
    @keyframes authCircleFloat2 {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-20px, 40px); }
    }
    @keyframes authCircleFloat3 {
      0% { transform: translate(0, 0); }
      100% { transform: translate(20px, -30px); }
    }

    /* ===== MoeInputField: white bg, rounded 24px, shadow ===== */
    .moe-input-field {
      position: relative;
      display: flex;
      align-items: center;
      background: #FFFFFF;
      border-radius: 24px;
      box-shadow: 0 8px 24px rgba(127, 127, 213, 0.08);
    }
    .moe-input-field__icon {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      flex-shrink: 0;
    }
    .moe-input-field input {
      width: 100%;
      padding: 18px 20px 18px 52px;
      border: none;
      background: transparent;
      font-size: 15px;
      color: rgba(0, 0, 0, 0.87);
      font-family: var(--font-family);
      box-sizing: border-box;
      outline: none;
    }
    .moe-input-field input::placeholder {
      color: #BDBDBD;
      font-size: 15px;
    }
    .moe-input-field__eye {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>

  <script>
    function toggleRegPassword(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-lucide', 'eye');
      } else {
        input.type = 'password';
        icon.setAttribute('data-lucide', 'eye-off');
      }
      lucide.createIcons();
    }
  </script>

  <script>lucide.createIcons();</script>
</body>
</html>
