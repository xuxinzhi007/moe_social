    <style id="theme-vars">
/* Moe Social Brand Design System — 萌系梦幻柔和 */
/* Extracted from Flutter project tokens: moe_tokens.dart, moe_theme_extension.dart, ai_brand_tokens.dart */

:root {
  /* ===== Primary Palette — 糖果渐变色系 ===== */
  --color-primary: #7F7FD5;
  --color-primary-light: #9B9FE3;
  --color-primary-lighter: #B7BAF0;
  --color-primary-lightest: #D4D5F6;
  --color-primary-dark: #5F5FBB;
  --color-primary-darker: #3F3FA1;

  --color-secondary: #86A8E7;
  --color-secondary-light: #A0BFEF;
  --color-secondary-lighter: #BBD5F6;
  --color-secondary-darker: #5E88C8;

  --color-tertiary: #91EAE4;
  --color-tertiary-light: #ADF0EC;
  --color-tertiary-lighter: #C8F5F2;
  --color-tertiary-darker: #6DD5CF;

  /* ===== Neutrals ===== */
  --color-bg: #F5F7FA;
  --color-bg-elevated: #FFFFFF;
  --color-bg-sunken: #EEEEF2;

  --color-text-primary: #333333;
  --color-text-secondary: #666666;
  --color-text-hint: #9E9E9E;
  --color-text-disabled: #BDBDBD;

  --color-text-inverse: #FFFFFF;

  /* ===== Semantic Colors ===== */
  --state-success: #00A86B;
  --state-warning: #E6A700;
  --state-error: #E94057;
  --state-info: #2563EB;

  --state-success-bg: #F0FDF4;
  --state-error-bg: #FEF2F2;
  --state-info-bg: #EFF6FF;
  --state-warning-bg: #FFFBEB;

  /* ===== Interaction Colors ===== */
  --color-like: #FF4757;
  --color-online: #00C853;
  --color-offline: #BDBDBD;

  /* ===== Gradients ===== */
  --gradient-primary: linear-gradient(135deg, #7F7FD5 0%, #86A8E7 100%);
  --gradient-hero: linear-gradient(135deg, #7F7FD5 0%, #86A8E7 50%, #91EAE4 100%);
  --gradient-aurora: linear-gradient(135deg, #E0C3FC 0%, #8EC5FC 50%, #91EAE4 100%);
  --gradient-ai-bubble: linear-gradient(135deg, #8A2387 0%, #E94057 100%);

  /* ===== Radius Scale — 圆润萌系 ===== */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-3xl: 28px;
  --radius-full: 9999px;
  --radius-button: 25px;
  --radius-input: 15px;

  /* ===== Shadows — 彩色柔和阴影 ===== */
  --shadow-card: 0 8px 16px rgba(127, 127, 213, 0.08);
  --shadow-card-lg: 0 10px 24px rgba(127, 127, 213, 0.08);
  --shadow-float: 0 20px 40px rgba(127, 127, 213, 0.12);
  --shadow-button: 0 4px 12px rgba(127, 127, 213, 0.4);
  --shadow-bottom-bar: 0 -5px 20px rgba(0, 0, 0, 0.05), 0 4px 12px rgba(127, 127, 213, 0.1);
  --shadow-compact: 0 5px 10px rgba(127, 127, 213, 0.08);

  /* ===== Typography ===== */
  --font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;

  --text-display: 700 28px/1.2 var(--font-family);
  --text-title: 700 22px/1.3 var(--font-family);
  --text-subtitle: 600 18px/1.4 var(--font-family);
  --text-body: 400 15px/1.6 var(--font-family);
  --text-body-sm: 400 14px/1.5 var(--font-family);
  --text-caption: 400 12px/1.35 var(--font-family);
  --text-overline: 500 11px/1.2 var(--font-family);
  --text-mono: 500 13px/1.4 'SF Mono', 'Fira Code', 'Roboto Mono', monospace;

  /* ===== Spacing ===== */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;

  /* ===== Motion ===== */
  --duration-fast: 200ms;
  --duration-normal: 300ms;
  --duration-slow: 500ms;
  --duration-breath: 1200ms;
  --ease-bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
  --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1);

  /* ===== Component specifics ===== */
  --bottom-bar-radius: 32px;
  --bottom-bar-padding: 8px 20px;
  --card-padding: 20px;
  --section-gap: 12px;
  --page-padding: 16px;

  /* ===== Dark mode ===== */
  --dark-bg: #121212;
  --dark-card: #1E1E1E;
  --dark-surface: #2C2C2C;
  --dark-text-primary: #E0E0E0;
  --dark-text-secondary: #AAAAAA;
  --dark-shadow-card: 0 8px 16px rgba(0, 0, 0, 0.3);
}

/* ===== Utility Classes ===== */
.text-gradient-primary {
  background: var(--gradient-hero);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.bg-primary-gradient {
  background: var(--gradient-primary);
}

.bg-hero-gradient {
  background: var(--gradient-hero);
}

.bg-aurora-gradient {
  background: var(--gradient-aurora);
}

.card-moe {
  background: var(--color-bg-elevated);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
}

.btn-moe-primary {
  background: var(--color-primary);
  color: var(--color-text-inverse);
  border-radius: var(--radius-button);
  height: 50px;
  font-weight: 600;
  font-size: 15px;
  box-shadow: var(--shadow-button);
  transition: transform 200ms var(--ease-bounce), box-shadow 200ms var(--ease-smooth);
}

.btn-moe-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(127, 127, 213, 0.5);
}

.input-moe {
  background: #F5F5F5;
  border-radius: var(--radius-input);
  border: 2px solid transparent;
  padding: 16px 20px;
  font-size: 15px;
  transition: border-color 200ms var(--ease-smooth);
}

.input-moe:focus {
  border-color: var(--color-primary);
  outline: none;
}

.bottom-bar-moe {
  background: var(--color-bg-elevated);
  border-radius: var(--bottom-bar-radius);
  box-shadow: var(--shadow-bottom-bar);
  padding: var(--bottom-bar-padding);
}

.fade-in-up {
  animation: fadeInUp var(--duration-normal) var(--ease-smooth) both;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes breathe {
  0%, 100% { transform: scale(0.85); opacity: 0.6; }
  50% { transform: scale(1.0); opacity: 1.0; }
}

@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 8px rgba(127, 127, 213, 0.3); }
  50% { box-shadow: 0 0 20px rgba(127, 127, 213, 0.6); }
}

  <style>
    /* ===== Reset & Base ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font: var(--text-body);
      background: #F5F7FA;
      color: var(--color-text-primary);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      padding-bottom: 110px;
    }
    a { text-decoration: none; color: inherit; }
    button { border: none; background: none; cursor: pointer; font: inherit; color: inherit; }
    img { display: block; max-width: 100%; }
    textarea { font: inherit; resize: none; }

    /* ===== App Bar ===== */
    .app-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px var(--page-padding, 16px);
      background: var(--color-bg-elevated);
      position: sticky;
      top: 0;
      z-index: 100;
      position: relative;
    }
    .close-btn {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .close-icon-circle {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-full);
      background: var(--color-bg-elevated);
      border: 1px solid #E0E0E0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .app-bar-title {
      font: var(--text-subtitle);
      color: var(--color-text-primary);
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }
    .publish-grad-btn {
      height: 32px;
      padding: 0 16px;
      border-radius: var(--radius-button);
      background: var(--gradient-primary);
      color: var(--color-text-inverse);
      font: 600 14px/1 var(--font-family);
      box-shadow: var(--shadow-button);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 200ms var(--ease-bounce);
    }
    .publish-grad-btn:active {
      transform: scale(0.95);
    }

    /* ===== Create Post Page ===== */
    .create-post-page {
      padding: var(--page-padding, 16px);
    }

    /* Date Row */
    .date-row {
      display: flex;
      align-items: center;
      gap: var(--space-md, 12px);
      margin-bottom: var(--space-lg, 16px);
    }
    .date-text {
      font: 900 24px/1.2 var(--font-family);
      color: var(--color-text-primary);
    }
    .weather-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      background: #FFF3E0;
      font: var(--text-caption);
      color: #E65100;
    }
    .weather-emoji {
      font-size: 14px;
      line-height: 1;
    }

    /* Text Area - plain, no border, no grey bg */
    .text-area-wrapper {
      margin-bottom: var(--space-lg, 16px);
    }
    .post-textarea {
      width: 100%;
      min-height: 120px;
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 0;
      font-size: 15px;
      line-height: 1.6;
      color: var(--color-text-primary);
      outline: none;
    }
    .post-textarea::placeholder {
      color: var(--color-text-hint);
    }

    /* Mood Selector - FilterChip style */
    .mood-selector {
      display: flex;
      gap: var(--space-sm, 8px);
      margin-bottom: var(--space-xl, 20px);
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .mood-selector::-webkit-scrollbar { display: none; }
    .mood-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      border: 1.5px solid var(--color-bg-sunken);
      background: var(--color-bg-elevated);
      font: var(--text-body-sm);
      color: var(--color-text-secondary);
      flex-shrink: 0;
      transition: all var(--duration-fast) var(--ease-smooth);
      cursor: pointer;
    }
    .mood-chip:active {
      transform: scale(0.96);
    }
    .mood-chip.active {
      border-color: var(--color-primary);
      background: rgba(127, 127, 213, 0.08);
      color: var(--color-primary);
      font-weight: 600;
    }

    /* Polaroid-style Images */
    .polaroid-row {
      display: flex;
      gap: var(--space-md, 12px);
      margin-bottom: var(--space-xl, 20px);
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .polaroid-row::-webkit-scrollbar { display: none; }
    .polaroid-card {
      flex-shrink: 0;
      width: 100px;
      background: var(--color-bg-elevated);
      padding: 4px;
      border-radius: 4px;
      box-shadow: var(--shadow-compact);
    }
    .polaroid-photo {
      width: 100%;
      height: 100px;
      border-radius: 2px;
      overflow: hidden;
    }
    .polaroid-label {
      padding: 6px 2px 4px;
      font: var(--text-caption);
      color: var(--color-text-secondary);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .add-polaroid {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--color-bg-sunken);
      cursor: pointer;
      height: 140px;
      color: var(--color-text-hint);
      transition: all var(--duration-fast) var(--ease-smooth);
    }
    .add-polaroid:active {
      color: var(--color-primary);
      background: rgba(127, 127, 213, 0.1);
    }

    /* Topic Tags - selected pills with delete X */
    .topic-tags-section {
      margin-bottom: var(--space-xl, 20px);
    }
    .topic-tags-list {
      display: flex;
