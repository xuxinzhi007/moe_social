<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">

    <title>登录 - 萌社</title>
    <style id="theme-vars">
/* Moe Social Brand Design System — 萌系梦幻柔和 */
/* Extracted from Flutter project tokens: moe_tokens.dart, moe_theme_extension.dart, ai_brand_tokens.dart */

:root {
  /* ===== Primary Palette — 糖果渐变色系 ===== */
  --color-primary: #7F7FD5;
  --color-primary-light: #9B9FE3;
  --color-primary-lighter: #B7BAF0;
  --color-primary-lightest: #D4D5F6;
  --color-primary-dark: #5F5FBB;
  --color-primary-darker: #3F3FA1;

  --color-secondary: #86A8E7;
  --color-secondary-light: #A0BFEF;
  --color-secondary-lighter: #BBD5F6;
  --color-secondary-darker: #5E88C8;

  --color-tertiary: #91EAE4;
  --color-tertiary-light: #ADF0EC;
  --color-tertiary-lighter: #C8F5F2;
  --color-tertiary-darker: #6DD5CF;

  /* ===== Neutrals ===== */
  --color-bg: #F5F7FA;
  --color-bg-elevated: #FFFFFF;
  --color-bg-sunken: #EEEEF2;

  --color-text-primary: #333333;
  --color-text-secondary: #666666;
  --color-text-hint: #9E9E9E;
  --color-text-disabled: #BDBDBD;

  --color-text-inverse: #FFFFFF;

  /* ===== Semantic Colors ===== */
  --state-success: #00A86B;
  --state-warning: #E6A700;
  --state-error: #E94057;
  --state-info: #2563EB;

  --state-success-bg: #F0FDF4;
  --state-error-bg: #FEF2F2;
  --state-info-bg: #EFF6FF;
  --state-warning-bg: #FFFBEB;

  /* ===== Interaction Colors ===== */
  --color-like: #FF4757;
  --color-online: #00C853;
  --color-offline: #BDBDBD;

  /* ===== Gradients ===== */
  --gradient-primary: linear-gradient(135deg, #7F7FD5 0%, #86A8E7 100%);
  --gradient-hero: linear-gradient(135deg, #7F7FD5 0%, #86A8E7 50%, #91EAE4 100%);
  --gradient-aurora: linear-gradient(135deg, #E0C3FC 0%, #8EC5FC 50%, #91EAE4 100%);
  --gradient-ai-bubble: linear-gradient(135deg, #8A2387 0%, #E94057 100%);

  /* ===== Radius Scale — 圆润萌系 ===== */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-3xl: 28px;
  --radius-full: 9999px;
  --radius-button: 25px;
  --radius-input: 15px;

  /* ===== Shadows — 彩色柔和阴影 ===== */
  --shadow-card: 0 8px 16px rgba(127, 127, 213, 0.08);
  --shadow-card-lg: 0 10px 24px rgba(127, 127, 213, 0.08);
  --shadow-float: 0 20px 40px rgba(127, 127, 213, 0.12);
  --shadow-button: 0 4px 12px rgba(127, 127, 213, 0.4);
  --shadow-bottom-bar: 0 -5px 20px rgba(0, 0, 0, 0.05), 0 4px 12px rgba(127, 127, 213, 0.1);
  --shadow-compact: 0 5px 10px rgba(127, 127, 213, 0.08);

  /* ===== Typography ===== */
  --font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;

  --text-display: 700 28px/1.2 var(--font-family);
  --text-title: 700 22px/1.3 var(--font-family);
  --text-subtitle: 600 18px/1.4 var(--font-family);
  --text-body: 400 15px/1.6 var(--font-family);
  --text-body-sm: 400 14px/1.5 var(--font-family);
  --text-caption: 400 12px/1.35 var(--font-family);
  --text-overline: 500 11px/1.2 var(--font-family);
  --text-mono: 500 13px/1.4 'SF Mono', 'Fira Code', 'Roboto Mono', monospace;

  /* ===== Spacing ===== */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;

  /* ===== Motion ===== */
  --duration-fast: 200ms;
  --duration-normal: 300ms;
  --duration-slow: 500ms;
  --duration-breath: 1200ms;
  --ease-bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
  --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1);

  /* ===== Component specifics ===== */
  --bottom-bar-radius: 32px;
  --bottom-bar-padding: 8px 20px;
  --card-padding: 20px;
  --section-gap: 12px;
  --page-padding: 16px;

  /* ===== Dark mode ===== */
  --dark-bg: #121212;
  --dark-card: #1E1E1E;
  --dark-surface: #2C2C2C;
  --dark-text-primary: #E0E0E0;
  --dark-text-secondary: #AAAAAA;
  --dark-shadow-card: 0 8px 16px rgba(0, 0, 0, 0.3);
}

/* ===== Utility Classes ===== */
.text-gradient-primary {
  background: var(--gradient-hero);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.bg-primary-gradient {
  background: var(--gradient-primary);
}

.bg-hero-gradient {
  background: var(--gradient-hero);
}

.bg-aurora-gradient {
  background: var(--gradient-aurora);
}

.card-moe {
  background: var(--color-bg-elevated);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
}

.btn-moe-primary {
  background: var(--color-primary);
  color: var(--color-text-inverse);
  border-radius: var(--radius-button);
  height: 50px;
  font-weight: 600;
  font-size: 15px;
  box-shadow: var(--shadow-button);
  transition: transform 200ms var(--ease-bounce), box-shadow 200ms var(--ease-smooth);
}

.btn-moe-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(127, 127, 213, 0.5);
}

.input-moe {
  background: #F5F5F5;
  border-radius: var(--radius-input);
  border: 2px solid transparent;
  padding: 16px 20px;
  font-size: 15px;
  transition: border-color 200ms var(--ease-smooth);
}

.input-moe:focus {
  border-color: var(--color-primary);
  outline: none;
}

.bottom-bar-moe {
  background: var(--color-bg-elevated);
  border-radius: var(--bottom-bar-radius);
  box-shadow: var(--shadow-bottom-bar);
  padding: var(--bottom-bar-padding);
}

.fade-in-up {
  animation: fadeInUp var(--duration-normal) var(--ease-smooth) both;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes breathe {
  0%, 100% { transform: scale(0.85); opacity: 0.6; }
  50% { transform: scale(1.0); opacity: 1.0; }
}

@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 8px rgba(127, 127, 213, 0.3); }
  50% { box-shadow: 0 0 20px rgba(127, 127, 213, 0.6); }
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-secondary: var(--color-secondary);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="margin: 0; padding: 0;">
  <main>

    <!-- AuthBackground: Scaffold backgroundColor white, Stack with base gradient + 3 animated radial circles -->
    <div class="auth-bg">

      <!-- 3 animated radial gradient circles (AuthBackground sin/cos movement, 10s cycle) -->
      <div class="auth-bg-circle auth-bg-circle-1"></div>
      <div class="auth-bg-circle auth-bg-circle-2"></div>
      <div class="auth-bg-circle auth-bg-circle-3"></div>

      <!-- Content: Center > SingleChildScrollView padding horizontal 32 > Column mainAxisAlignment.center -->
      <div style="
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        box-sizing: border-box;
      ">
        <div style="
          display: flex;
          flex-direction: column;
          align-items: center;
          width: 100%;
          max-width: 400px;
        ">

          <!-- ===== LOGO AREA ===== (FadeInUp, duration 800ms) -->
          <div class="login-fade-1" style="display: flex; flex-direction: column; align-items: center;">

            <!-- White circle container: padding 20, circle shape, shadow primary 20% alpha blur 30 offset (0,10) -->
            <div style="
              padding: 20px;
              background: #FFFFFF;
              border-radius: 50%;
              box-shadow: 0 30px rgba(127, 127, 213, 0.2);
              display: flex;
              align-items: center;
              justify-content: center;
            ">
              <!-- favorite_rounded icon, size 64, primary color -->
              <svg width="64" height="64" viewBox="0 0 24 24" fill="#7F7FD5" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
              </svg>
            </div>

            <!-- SizedBox(height: 24) -->
            <div style="height: 24px;"></div>

            <!-- "Moe Social" text: 28px, w900, #333333, letterSpacing 1 -->
            <h1 style="
              font-family: var(--font-family);
              font-size: 28px;
              font-weight: 900;
              color: #333333;
              letter-spacing: 1px;
              margin: 0;
            ">Moe Social</h1>

            <!-- SizedBox(height: 8) -->
            <div style="height: 8px;"></div>

            <!-- "发现更可爱的世界": 15px, grey[500], letterSpacing 2 -->
            <p style="
              font-family: var(--font-family);
              font-size: 15px;
              color: #9E9E9E;
              letter-spacing: 2px;
              margin: 0;
            ">发现更可爱的世界</p>

          </div>

          <!-- SizedBox(height: 48) -->
          <div style="height: 48px;"></div>

          <!-- ===== FORM AREA ===== (FadeInUp, delay 200ms, duration 800ms) -->
          <div class="login-fade-2" style="width: 100%;">

            <!-- Input 1: MoeInputField with "邮箱或 10 位 Moe 号", alternate_email icon -->
            <div class="moe-input-field">
              <!-- Prefix icon: alternate_email_rounded -->
              <svg class="input-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
              </svg>
              <input type="text" placeholder="邮箱或 10 位 Moe 号" />
            </div>

            <!-- SizedBox(height: 20) -->
            <div style="height: 20px;"></div>

            <!-- Input 2: MoeInputField with "密码", lock icon, password toggle -->
            <div class="moe-input-field">
              <!-- Prefix icon: lock_outline -->
              <svg class="input-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/>
              </svg>
              <input type="password" placeholder="密码" id="password-input-login" />
              <button class="toggle-password" onclick="toggleLoginPassword()" type="button" aria-label="Toggle password visibility">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="eye-icon-login">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                  <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>

            <!-- SizedBox(height: 12) -->
            <div style="height: 12px;"></div>

            <!-- "忘记密码?" aligned right, grey[400] (NOT primary) -->
            <div style="text-align: right;">
              <a href="#" style="
                font-family: var(--font-family);
                font-size: 14px;
                color: #BDBDBD;
                text-decoration: none;
              ">忘记密码？</a>
            </div>

            <!-- SizedBox(height: 32) -->
            <div style="height: 32px;"></div>

            <!-- Login button: Solid #7F7FD5, height 56, borderRadius 28, elevation 8, shadow primary 40%. "登 录" 18px bold letterSpacing 2 -->
            <button data-dom-id="login-submit" style="
              width: 100%;
              height: 56px;
              border: none;
              border-radius: 28px;
              background-color: #7F7FD5;
              color: #FFFFFF;
              font-family: var(--font-family);
              font-size: 18px;
              font-weight: bold;
              letter-spacing: 2px;
              cursor: pointer;
              box-shadow: 0 8px rgba(127, 127, 213, 0.4);
              transition: transform 200ms var(--ease-bounce), box-shadow 200ms var(--ease-smooth);
            ">登 录</button>

            <!-- SizedBox(height: 16) -->
            <div style="height: 16px;"></div>

            <!-- WeChat OutlinedButton: #07C160 border/text, wechat icon, "微信登录 / 注册", height 52, radius 28 -->
            <button class="social-outlined-btn" style="
              background: transparent;
              border: 2px solid #07C160;
              color: #07C160;
            ">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="#07C160" xmlns="http://www.w3.org/2000/svg">
                <path d="M8.5 11a1 1 0 100-2 1 1 0 000 2zm5 0a1 1 0 100-2 1 1 0 000 2z"/>
                <path d="M9.5 4C5.36 4 2 6.69 2 10c0 1.89 1.08 3.57 2.78 4.72L4.25 17l2.5-1.25C7.93 16.25 8.72 16.5 9.5 16.5c.34 0 .67-.03 1-.08A5.96 5.96 0 0110 14.5C10 11.46 12.69 9 16 9c.34 0 .67.03 1 .08C16.48 6.22 13.25 4 9.5 4zM22 14.5c0-2.76-2.69-5-6-5s-6 2.24-6 5 2.69 5 6 5c.78 0 1.53-.13 2.22-.36L21.25 21l-.53-2.28C21.52 17.57 22 16.1 22 14.5z"/>
              </svg>
              <span>微信登录 / 注册</span>
            </button>

            <!-- SizedBox(height: 16) -->
            <div style="height: 16px;"></div>

            <!-- Feishu OutlinedButton: #3370FF border/text, hub_outlined icon, "飞书登录 / 注册", height 52, radius 28 -->
            <button class="social-outlined-btn" style="
              background: transparent;
              border: 2px solid #3370FF;
              color: #3370FF;
            ">
              <!-- hub_outlined icon (simplified as connected nodes) -->
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3370FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="5" r="2"/>
                <circle cx="5" cy="19" r="2"/>
                <circle cx="19" cy="19" r="2"/>
                <line x1="12" y1="7" x2="5" y2="17"/>
                <line x1="12" y1="7" x2="19" y2="17"/>
                <line x1="7" y1="19" x2="17" y2="19"/>
              </svg>
              <span>飞书登录 / 注册</span>
            </button>

          </div>

          <!-- SizedBox(height: 40) -->
          <div style="height: 40px;"></div>

          <!-- ===== BOTTOM REGISTER LINK ===== (FadeInUp, delay 400ms, duration 800ms) -->
          <div class="login-fade-3" style="display: flex; align-items: center; justify-content: center;">
            <!-- "还没有账号?" grey[500] -->
            <span style="
              font-family: var(--font-family);
              font-size: 14px;
              color: #9E9E9E;
            ">还没有账号？</span>
            <!-- "立即注册" primary bold -->
            <a href="#" data-dom-id="login-to-register" style="
              font-family: var(--font-family);
              font-size: 14px;
              color: #7F7FD5;
              font-weight: bold;
              text-decoration: none;
              padding: 4px 6px;
              margin-left: 2px;
            ">立即注册</a>
          </div>

        </div>
      </div>

    </div>

    <!-- Password toggle script -->
    <script>
      function toggleLoginPassword() {
        const input = document.getElementById('password-input-login');
        if (input.type === 'password') {
          input.type = 'text';
        } else {
          input.type = 'password';
        }
      }
    </script>

  </main>
  <script>lucide.createIcons();</script>

    <style>
      /* AuthBackground: 3 animated radial gradient circles using sin/cos, 10s cycle */
      .auth-bg {
        position: fixed;
        inset: 0;
        background: linear-gradient(to bottom, #FDFBFD, #F4F7F9);
        overflow: hidden;
      }

      .auth-bg-circle {
        position: absolute;
        border-radius: 50%;
      }

      .auth-bg-circle-1 {
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, rgba(224, 195, 252, 0.4) 0%, transparent 70%);
        top: -100px;
        left: -50px;
        animation: authCircle1 10s ease-in-out infinite;
      }

      .auth-bg-circle-2 {
        width: 300px;
        height: 300px;
        background: radial-gradient(circle, rgba(142, 197, 252, 0.4) 0%, transparent 60%);
        top: 200px;
        right: -100px;
        animation: authCircle2 10s ease-in-out infinite;
      }

      .auth-bg-circle-3 {
        width: 350px;
        height: 350px;
        background: radial-gradient(circle, rgba(145, 234, 228, 0.4) 0%, transparent 70%);
        bottom: -50px;
        left: -50px;
        animation: authCircle3 10s ease-in-out infinite;
      }

      @keyframes authCircle1 {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(30px, 30px); }
      }

      @keyframes authCircle2 {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-20px, -40px); }
      }

      @keyframes authCircle3 {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(20px, -30px); }
      }

      /* MoeInputField: white background, borderRadius 24, shadow primary 8% alpha blur 24 offset (0,8) */
      .moe-input-field {
        background: #FFFFFF;
        border-radius: 24px;
        border: none;
        box-shadow: 0 24px rgba(127, 127, 213, 0.08);
        box-shadow: 0 8px 24px rgba(127, 127, 213, 0.08);
        display: flex;
        align-items: center;
        padding: 0 20px;
        height: auto;
        min-height: 56px;
      }

      .moe-input-field input {
        flex: 1;
        border: none;
        outline: none;
        background: transparent;
        font-size: 15px;
        color: rgba(0, 0, 0, 0.87);
        padding: 18px 12px;
        font-family: var(--font-family);
        box-sizing: border-box;
      }

      .moe-input-field input::placeholder {
        color: #BDBDBD;
        font-size: 15px;
      }

      .moe-input-field .input-icon {
        color: rgba(127, 127, 213, 0.6);
        flex-shrink: 0;
      }

      .moe-input-field .toggle-password {
        background: none;
        border: none;
        cursor: pointer;
        color: #E0E0E0;
        padding: 4px;
        display: flex;
        align-items: center;
        flex-shrink: 0;
      }

      /* OutlinedButton style */
      .social-outlined-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        height: 52px;
        border-radius: 28px;
        font-family: var(--font-family);
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 200ms ease;
        text-decoration: none;
      }

      .social-outlined-btn:hover {
        opacity: 0.85;
      }

      /* FadeInUp staggered animations */
      .login-fade-1 {
        animation: fadeInUp 800ms var(--ease-smooth) both;
      }
      .login-fade-2 {
        animation: fadeInUp 800ms var(--ease-smooth) 200ms both;
      }
      .login-fade-3 {
        animation: fadeInUp 800ms var(--ease-smooth) 400ms both;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
