<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>萌社 - AI 聊天</title>
    <style id="theme-vars">
/* Moe Social Brand Design System — 萌系梦幻柔和 */
/* Extracted from Flutter project tokens: moe_tokens.dart, moe_theme_extension.dart, ai_brand_tokens.dart */

:root {
  /* ===== Primary Palette — 糖果渐变色系 ===== */
  --color-primary: #7F7FD5;
  --color-primary-light: #9B9FE3;
  --color-primary-lighter: #B7BAF0;
  --color-primary-lightest: #D4D5F6;
  --color-primary-dark: #5F5FBB;
  --color-primary-darker: #3F3FA1;

  --color-secondary: #86A8E7;
  --color-secondary-light: #A0BFEF;
  --color-secondary-lighter: #BBD5F6;
  --color-secondary-darker: #5E88C8;

  --color-tertiary: #91EAE4;
  --color-tertiary-light: #ADF0EC;
  --color-tertiary-lighter: #C8F5F2;
  --color-tertiary-darker: #6DD5CF;

  /* ===== Neutrals ===== */
  --color-bg: #F5F7FA;
  --color-bg-elevated: #FFFFFF;
  --color-bg-sunken: #EEEEF2;

  --color-text-primary: #333333;
  --color-text-secondary: #666666;
  --color-text-hint: #9E9E9E;
  --color-text-disabled: #BDBDBD;

  --color-text-inverse: #FFFFFF;

  /* ===== Semantic Colors ===== */
  --state-success: #00A86B;
  --state-warning: #E6A700;
  --state-error: #E94057;
  --state-info: #2563EB;

  --state-success-bg: #F0FDF4;
  --state-error-bg: #FEF2F2;
  --state-info-bg: #EFF6FF;
  --state-warning-bg: #FFFBEB;

  /* ===== Interaction Colors ===== */
  --color-like: #FF4757;
  --color-online: #00C853;
  --color-offline: #BDBDBD;

  /* ===== Gradients ===== */
  --gradient-primary: linear-gradient(135deg, #7F7FD5 0%, #86A8E7 100%);
  --gradient-hero: linear-gradient(135deg, #7F7FD5 0%, #86A8E7 50%, #91EAE4 100%);
  --gradient-aurora: linear-gradient(135deg, #E0C3FC 0%, #8EC5FC 50%, #91EAE4 100%);
  --gradient-ai-bubble: linear-gradient(135deg, #8A2387 0%, #E94057 100%);

  /* ===== Radius Scale — 圆润萌系 ===== */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-3xl: 28px;
  --radius-full: 9999px;
  --radius-button: 25px;
  --radius-input: 15px;

  /* ===== Shadows — 彩色柔和阴影 ===== */
  --shadow-card: 0 8px 16px rgba(127, 127, 213, 0.08);
  --shadow-card-lg: 0 10px 24px rgba(127, 127, 213, 0.08);
  --shadow-float: 0 20px 40px rgba(127, 127, 213, 0.12);
  --shadow-button: 0 4px 12px rgba(127, 127, 213, 0.4);
  --shadow-bottom-bar: 0 -5px 20px rgba(0, 0, 0, 0.05), 0 4px 12px rgba(127, 127, 213, 0.1);
  --shadow-compact: 0 5px 10px rgba(127, 127, 213, 0.08);

  /* ===== Typography ===== */
  --font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;

  --text-display: 700 28px/1.2 var(--font-family);
  --text-title: 700 22px/1.3 var(--font-family);
  --text-subtitle: 600 18px/1.4 var(--font-family);
  --text-body: 400 15px/1.6 var(--font-family);
  --text-body-sm: 400 14px/1.5 var(--font-family);
  --text-caption: 400 12px/1.35 var(--font-family);
  --text-overline: 500 11px/1.2 var(--font-family);
  --text-mono: 500 13px/1.4 'SF Mono', 'Fira Code', 'Roboto Mono', monospace;

  /* ===== Spacing ===== */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;

  /* ===== Motion ===== */
  --duration-fast: 200ms;
  --duration-normal: 300ms;
  --duration-slow: 500ms;
  --duration-breath: 1200ms;
  --ease-bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
  --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1);

  /* ===== Component specifics ===== */
  --bottom-bar-radius: 32px;
  --bottom-bar-padding: 8px 20px;
  --card-padding: 20px;
  --section-gap: 12px;
  --page-padding: 16px;

  /* ===== Dark mode ===== */
  --dark-bg: #121212;
  --dark-card: #1E1E1E;
  --dark-surface: #2C2C2C;
  --dark-text-primary: #E0E0E0;
  --dark-text-secondary: #AAAAAA;
  --dark-shadow-card: 0 8px 16px rgba(0, 0, 0, 0.3);
}

/* ===== Utility Classes ===== */
.text-gradient-primary {
  background: var(--gradient-hero);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.bg-primary-gradient {
  background: var(--gradient-primary);
}

.bg-hero-gradient {
  background: var(--gradient-hero);
}

.bg-aurora-gradient {
  background: var(--gradient-aurora);
}

.card-moe {
  background: var(--color-bg-elevated);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
}

.btn-moe-primary {
  background: var(--color-primary);
  color: var(--color-text-inverse);
  border-radius: var(--radius-button);
  height: 50px;
  font-weight: 600;
  font-size: 15px;
  box-shadow: var(--shadow-button);
  transition: transform 200ms var(--ease-bounce), box-shadow 200ms var(--ease-smooth);
}

.btn-moe-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(127, 127, 213, 0.5);
}

.input-moe {
  background: #F5F5F5;
  border-radius: var(--radius-input);
  border: 2px solid transparent;
  padding: 16px 20px;
  font-size: 15px;
  transition: border-color 200ms var(--ease-smooth);
}

.input-moe:focus {
  border-color: var(--color-primary);
  outline: none;
}

.bottom-bar-moe {
  background: var(--color-bg-elevated);
  border-radius: var(--bottom-bar-radius);
  box-shadow: var(--shadow-bottom-bar);
  padding: var(--bottom-bar-padding);
}

.fade-in-up {
  animation: fadeInUp var(--duration-normal) var(--ease-smooth) both;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes breathe {
  0%, 100% { transform: scale(0.85); opacity: 0.6; }
  50% { transform: scale(1.0); opacity: 1.0; }
}

@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 8px rgba(127, 127, 213, 0.3); }
  50% { box-shadow: 0 0 20px rgba(127, 127, 213, 0.6); }
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>

    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-secondary: var(--color-secondary);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body>
  <!-- ===== Chat Header (WHITE background) ===== -->
  <div class="chat-header">
    <a class="nav-back" href="ai-tavern.html" data-dom-id="back-tavern">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="chat-header-info">
      <div class="ai-avatar-wrapper">
        <div class="ai-avatar-ring"></div>
        <div class="ai-avatar" style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#7F7FD5,#91EAE4);display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:14px;">夜</div>
      </div>
      <div class="ai-name-block">
        <span class="ai-name">小夜</span>
        <span class="ai-status">在线</span>
      </div>
    </div>
    <button class="drawer-btn" data-dom-id="session-drawer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
    </button>
  </div>

  <main class="chat-page">
    <!-- ===== AI Identity Hero Card (collapsible) ===== -->
    <div class="ai-hero-card" data-dom-id="ai-identity">
      <div class="hero-avatar-wrapper">
        <div class="hero-avatar" style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#7F7FD5,#86A8E7,#91EAE4);display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:24px;">夜</div>
      </div>
      <h2 class="hero-name">小夜</h2>
      <p class="hero-tagline">温柔的夜之精灵，喜欢倾听你的心事</p>
      <div class="hero-collapse-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-hint)" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </div>

    <!-- ===== Chat Messages ===== -->
    <div class="chat-messages">
      <!-- AI Message 1 -->
      <div class="message-row ai-message">
        <div class="msg-avatar">
          <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#7F7FD5,#91EAE4);display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:14px;">夜</div>
        </div>
        <div class="msg-bubble ai-bubble">
          <p>晚上好呀~ 今天过得怎么样呢？有没有什么开心的事情想和我分享？</p>
        </div>
      </div>

      <!-- User Message 1 -->
      <div class="message-row user-message">
        <div class="msg-bubble user-bubble">
          <p>今天看了《葬送的芙莉莲》，感觉好治愈！特别是那段回忆的剧情，哭了好久</p>
        </div>
      </div>

      <!-- AI Message 2 -->
      <div class="message-row ai-message">
        <div class="msg-avatar">
          <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#7F7FD5,#91EAE4);display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:14px;">夜</div>
        </div>
        <div class="msg-bubble ai-bubble">
          <p>啊！芙莉莲真的很棒呢~ 那种跨越时间的情感，确实很容易让人感动。你觉得芙莉莲和辛美尔之间的感情，是友情还是更深的羁绊呢？</p>
        </div>
      </div>

      <!-- User Message 2 -->
      <div class="message-row user-message">
        <div class="msg-bubble user-bubble">
          <p>我觉得是一种无法用语言定义的感情吧，辛美尔教会了她什么是"喜欢"，这种感觉太美好了</p>
        </div>
      </div>

      <!-- AI Message 3 - Typing Indicator -->
      <div class="message-row ai-message">
        <div class="msg-avatar">
          <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#7F7FD5,#91EAE4);display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:14px;">夜</div>
        </div>
        <div class="msg-bubble ai-bubble">
          <div class="typing-indicator" data-dom-id="typing-indicator">
            <span class="dot"></span>
            <span class="dot"></span>

          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- ===== Bottom Input Bar (WHITE background) ===== -->
  <div class="bottom-input-bar">
    <div class="input-wrapper">
      <input type="text" class="chat-input" placeholder="输入消息..." data-dom-id="chat-input">
      <button class="send-btn" data-dom-id="send-message">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

  <style>
    /* ===== Reset & Base ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font: var(--text-body);
      background: #F5F7FA;
      color: var(--color-text-primary);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      padding-bottom: 90px;
      overflow-x: hidden;
    }
    a { text-decoration: none; color: inherit; }
    button { border: none; background: none; cursor: pointer; font: inherit; color: inherit; }
    img { display: block; max-width: 100%; }
    input { font: inherit; }

    /* ===== Chat Header (WHITE, elevation 0) ===== */
    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px var(--page-padding, 16px);
      background: #FFFFFF;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: none;
      border-bottom: 1px solid var(--color-bg-sunken);
    }
    .chat-header { position: relative; }
    .nav-back {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: var(--radius-full);
      transition: background var(--duration-fast) var(--ease-smooth);
    }
    .nav-back:active { background: var(--color-bg-sunken); }
    .chat-header-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .ai-avatar-wrapper {
      position: relative;
      flex-shrink: 0;
    }
    .ai-avatar {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-full);
      object-fit: cover;
    }
    .ai-avatar-ring {
      position: absolute;
      inset: -2px;
      border-radius: var(--radius-full);
      background: var(--gradient-primary);
      z-index: -1;
    }
    .ai-name-block {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ai-name {
      font: var(--text-subtitle);
      color: var(--color-text-primary);
    }
    .ai-status {
      font: var(--text-caption);
      color: var(--color-online);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .ai-status::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-online);
    }
    .drawer-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: var(--radius-full);
      transition: background var(--duration-fast) var(--ease-smooth);
    }
    .drawer-btn:active { background: var(--color-bg-sunken); }

    /* ===== Chat Page ===== */
    .chat-page {
      padding: 0 var(--page-padding, 16px);
      position: relative;
      z-index: 1;
    }

    /* ===== AI Identity Hero Card ===== */
    .ai-hero-card {
      background: rgba(127, 127, 213, 0.06);
      border: 1px solid rgba(127, 127, 213, 0.12);
      border-radius: var(--radius-xl, 20px);
      padding: var(--space-xl, 20px);
      margin-top: var(--page-padding, 16px);
      margin-bottom: var(--space-xl, 20px);
      position: relative;
      text-align: center;
    }
    .hero-avatar-wrapper {
      width: 64px;
      height: 64px;
      margin: 0 auto var(--space-md, 12px);
      border-radius: var(--radius-full);
      padding: 2px;
      background: var(--gradient-hero);
    }
    .hero-avatar {
      width: 100%;
      height: 100%;
      border-radius: var(--radius-full);
      border: 2px solid #FFFFFF;
    }
    .hero-name {
      font: var(--text-title);
      color: var(--color-text-primary);
      margin-bottom: var(--space-xs, 4px);
    }
    .hero-tagline {
      font: var(--text-body-sm);
      color: var(--color-text-secondary);
      line-height: 1.5;
    }
    .hero-collapse-btn {
      position: absolute;
      bottom: 8px;
      right: var(--space-lg, 16px);
      width: 24px;
      height: 24px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-bg-elevated);
      box-shadow: var(--shadow-compact);
    }

    /* ===== Chat Messages ===== */
    .chat-messages {
      display: flex;
      flex-direction: column;
      gap: var(--space-lg, 16px);
    }
    .message-row {
      display: flex;
      align-items: flex-end;
      gap: var(--space-sm, 8px);
      max-width: 85%;
    }
    .ai-message { align-self: flex-start; }
    .user-message { align-self: flex-end; }
    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-full);
      overflow: hidden;
      flex-shrink: 0;
    }
    .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .msg-bubble {
      padding: 14px 18px;
      font: var(--text-body);
      line-height: 1.6;
    }
    .ai-bubble {
      background: var(--color-bg-elevated);
      color: var(--color-text-primary);
      border-radius: 18px 18px 18px 4px;
      box-shadow: var(--shadow-compact);
    }
    .user-bubble {
      background: #7F7FD5;
      color: #FFFFFF;
      border-radius: 18px 18px 4px 18px;
    }

    /* ===== Typing Indicator ===== */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 2px 0;
    }
    .typing-indicator .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-text-hint);
      animation: typingBounce 1.4s ease-in-out infinite;
    }
    .typing-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* ===== Bottom Input Bar (WHITE) ===== */
    .bottom-input-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px var(--page-padding, 16px);
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      background: #FFFFFF;
      border-top: 1px solid var(--color-bg-sunken);
      z-index: 100;
    }
    .input-wrapper {
      display: flex;
      align-items: center;
      gap: var(--space-sm, 8px);
    }
    .chat-input {
      flex: 1;
      height: 44px;
      border-radius: 20px;
      background: var(--color-bg);
      border: 1.5px solid var(--color-bg-sunken);
      padding: 0 16px;
      color: var(--color-text-primary);
      font-size: 14px;
      outline: none;
      transition: border-color var(--duration-fast) var(--ease-smooth);
    }
    .chat-input::placeholder { color: var(--color-text-hint); }
    .chat-input:focus { border-color: var(--color-primary); }
    .send-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-full);
      background: var(--color-primary);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform var(--duration-fast) var(--ease-bounce);
      box-shadow: var(--shadow-button);
    }
    .send-btn:active {
      transform: scale(0.93);
    }
  </style>
</body>
