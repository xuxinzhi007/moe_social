/* Moe Social Brand Design System — 萌系梦幻柔和 */
/* Extracted from Flutter project tokens: moe_tokens.dart, moe_theme_extension.dart, ai_brand_tokens.dart */

:root {
  /* ===== Primary Palette — 糖果渐变色系 ===== */
  --color-primary: #7F7FD5;
  --color-primary-light: #9B9FE3;
  --color-primary-lighter: #B7BAF0;
  --color-primary-lightest: #D4D5F6;
  --color-primary-dark: #5F5FBB;
  --color-primary-darker: #3F3FA1;

  --color-secondary: #86A8E7;
  --color-secondary-light: #A0BFEF;
  --color-secondary-lighter: #BBD5F6;
  --color-secondary-darker: #5E88C8;

  --color-tertiary: #91EAE4;
  --color-tertiary-light: #ADF0EC;
  --color-tertiary-lighter: #C8F5F2;
  --color-tertiary-darker: #6DD5CF;

  /* ===== Neutrals ===== */
  --color-bg: #F5F7FA;
  --color-bg-elevated: #FFFFFF;
  --color-bg-sunken: #EEEEF2;

  --color-text-primary: #333333;
  --color-text-secondary: #666666;
  --color-text-hint: #9E9E9E;
  --color-text-disabled: #BDBDBD;

  --color-text-inverse: #FFFFFF;

  /* ===== Semantic Colors ===== */
  --state-success: #00A86B;
  --state-warning: #E6A700;
  --state-error: #E94057;
  --state-info: #2563EB;

  --state-success-bg: #F0FDF4;
  --state-error-bg: #FEF2F2;
  --state-info-bg: #EFF6FF;
  --state-warning-bg: #FFFBEB;

  /* ===== Interaction Colors ===== */
  --color-like: #FF4757;
  --color-online: #00C853;
  --color-offline: #BDBDBD;

  /* ===== Gradients ===== */
  --gradient-primary: linear-gradient(135deg, #7F7FD5 0%, #86A8E7 100%);
  --gradient-hero: linear-gradient(135deg, #7F7FD5 0%, #86A8E7 50%, #91EAE4 100%);
  --gradient-aurora: linear-gradient(135deg, #E0C3FC 0%, #8EC5FC 50%, #91EAE4 100%);
  --gradient-ai-bubble: linear-gradient(135deg, #8A2387 0%, #E94057 100%);

  /* ===== Radius Scale — 圆润萌系 ===== */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-3xl: 28px;
  --radius-full: 9999px;
  --radius-button: 25px;
  --radius-input: 15px;

  /* ===== Shadows — 彩色柔和阴影 ===== */
  --shadow-card: 0 8px 16px rgba(127, 127, 213, 0.08);
  --shadow-card-lg: 0 10px 24px rgba(127, 127, 213, 0.08);
  --shadow-float: 0 20px 40px rgba(127, 127, 213, 0.12);
  --shadow-button: 0 4px 12px rgba(127, 127, 213, 0.4);
  --shadow-bottom-bar: 0 -5px 20px rgba(0, 0, 0, 0.05), 0 4px 12px rgba(127, 127, 213, 0.1);
  --shadow-compact: 0 5px 10px rgba(127, 127, 213, 0.08);

  /* ===== Typography ===== */
  --font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;

  --text-display: 700 28px/1.2 var(--font-family);
  --text-title: 700 22px/1.3 var(--font-family);
  --text-subtitle: 600 18px/1.4 var(--font-family);
  --text-body: 400 15px/1.6 var(--font-family);
  --text-body-sm: 400 14px/1.5 var(--font-family);
  --text-caption: 400 12px/1.35 var(--font-family);
  --text-overline: 500 11px/1.2 var(--font-family);
  --text-mono: 500 13px/1.4 'SF Mono', 'Fira Code', 'Roboto Mono', monospace;

  /* ===== Spacing ===== */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;

  /* ===== Motion ===== */
  --duration-fast: 200ms;
  --duration-normal: 300ms;
  --duration-slow: 500ms;
  --duration-breath: 1200ms;
  --ease-bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
  --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1);

  /* ===== Component specifics ===== */
  --bottom-bar-radius: 32px;
  --bottom-bar-padding: 8px 20px;
  --card-padding: 20px;
  --section-gap: 12px;
  --page-padding: 16px;

  /* ===== Dark mode ===== */
  --dark-bg: #121212;
  --dark-card: #1E1E1E;
  --dark-surface: #2C2C2C;
  --dark-text-primary: #E0E0E0;
  --dark-text-secondary: #AAAAAA;
  --dark-shadow-card: 0 8px 16px rgba(0, 0, 0, 0.3);
}

/* ===== Utility Classes ===== */
.text-gradient-primary {
  background: var(--gradient-hero);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.bg-primary-gradient {
  background: var(--gradient-primary);
}

.bg-hero-gradient {
  background: var(--gradient-hero);
}

.bg-aurora-gradient {
  background: var(--gradient-aurora);
}

.card-moe {
  background: var(--color-bg-elevated);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
}

.btn-moe-primary {
  background: var(--color-primary);
  color: var(--color-text-inverse);
  border-radius: var(--radius-button);
  height: 50px;
  font-weight: 600;
  font-size: 15px;
  box-shadow: var(--shadow-button);
  transition: transform 200ms var(--ease-bounce), box-shadow 200ms var(--ease-smooth);
}

.btn-moe-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(127, 127, 213, 0.5);
}

.input-moe {
  background: #F5F5F5;
  border-radius: var(--radius-input);
  border: 2px solid transparent;
  padding: 16px 20px;
  font-size: 15px;
  transition: border-color 200ms var(--ease-smooth);
}

.input-moe:focus {
  border-color: var(--color-primary);
  outline: none;
}

.bottom-bar-moe {
  background: var(--color-bg-elevated);
  border-radius: var(--bottom-bar-radius);
  box-shadow: var(--shadow-bottom-bar);
  padding: var(--bottom-bar-padding);
}

.fade-in-up {
  animation: fadeInUp var(--duration-normal) var(--ease-smooth) both;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes breathe {
  0%, 100% { transform: scale(0.85); opacity: 0.6; }
  50% { transform: scale(1.0); opacity: 1.0; }
}

@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 8px rgba(127, 127, 213, 0.3); }
  50% { box-shadow: 0 0 20px rgba(127, 127, 213, 0.6); }
}

    }
    .nav-spacer { width: 36px; }
    .app-bar-title {
      font: 700 18px/1.2 var(--font-family);
      color: var(--color-text-primary);
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }
    .popup-menu-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: var(--radius-full);
      transition: background var(--duration-fast) var(--ease-smooth);
    }
    .popup-menu-btn:active { background: var(--color-bg-sunken); }

    /* ===== Tab Bar ===== */
    .tab-bar {
      display: flex;
      background: #FFFFFF;
      padding: 0 var(--page-padding, 16px);
      gap: 0;
      border-bottom: 1px solid var(--color-bg-sunken);
    }
    .tab-bar .tab {
      flex: 1;
      text-align: center;
      padding: 12px 0;
      font: var(--text-body-sm);
      color: var(--color-text-secondary);
      border-bottom: 2px solid transparent;
      transition: all var(--duration-fast) var(--ease-smooth);
      cursor: pointer;
    }
    .tab-bar .tab.active {
      color: var(--color-primary);
      font-weight: 600;
      border-bottom-color: var(--color-primary);
    }

    /* ===== Tavern Page ===== */
    .tavern-page {
      padding-bottom: 88px;
    }

    /* ===== Hero Featured Card ===== */
    .hero-card {
      margin: var(--space-lg, 16px) 0;
    }
    .hero-inner {
      background: var(--color-bg-elevated);
      border-radius: var(--radius-xl, 20px);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      position: relative;
    }
    .hero-card-accent {
      height: 4px;
      background: var(--gradient-primary);
    }
    .hero-card-content {
      display: flex;
      align-items: center;
      gap: var(--space-md, 12px);
      padding: var(--space-lg, 16px);
    }
    .hero-card-avatar-wrap {
      flex-shrink: 0;
    }
    .hero-card-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
      color: #FFFFFF;
    }
    .hero-card-info {
      flex: 1;
      min-width: 0;
    }
    .hero-card-name {
      font: 700 16px/1.3 var(--font-family);
      color: var(--color-text-primary);
      display: block;
    }
    .hero-card-desc {
      font: var(--text-caption);
      color: var(--color-text-hint);
      display: block;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hero-card-action {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--gradient-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: var(--shadow-button);
    }

    /* ===== Agent List (ListTile-style) ===== */
    .agent-list {
      padding: 0 var(--page-padding, 16px);
    }
    .agent-list-item {
      display: flex;
      align-items: center;
      gap: var(--space-md, 12px);
      padding: 14px 16px;
      background: var(--color-bg-elevated);
      border-radius: var(--radius-lg, 16px);
      margin-bottom: var(--space-sm, 8px);
      box-shadow: var(--shadow-card);
      transition: background var(--duration-fast) var(--ease-smooth);
      cursor: pointer;
    }
    .agent-list-item:active { background: var(--color-bg-sunken); }
    .agent-item-avatar-wrap {
      position: relative;
      flex-shrink: 0;
    }
    .agent-item-avatar-border {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .agent-item-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 600;
      color: #FFFFFF;
      border: 2px solid #FFFFFF;
    }
    .agent-online-dot {
      position: absolute;
      bottom: 1px;
      right: 1px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--color-online);
      border: 2px solid #FFFFFF;
    }
    .agent-online-dot.offline {
      background: var(--color-offline);
    }
    .agent-item-content {
      flex: 1;
      min-width: 0;
    }
    .agent-item-top {
      display: flex;
      align-items: center;
      gap: var(--space-sm, 8px);
      margin-bottom: 2px;
    }
    .agent-item-name {
      font: 700 15px/1.3 var(--font-family);
      color: var(--color-text-primary);
    }
    .agent-item-status {
      font: var(--text-caption);
      padding: 1px 6px;
      border-radius: var(--radius-full);
    }
    .agent-item-status.online {
      color: var(--color-online);
      background: #E8F5E9;
    }
    .agent-item-status.offline {
      color: var(--color-offline);
      background: var(--color-bg-sunken);
    }
    .agent-item-desc {
      font: var(--text-caption);
      color: var(--color-text-hint);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }
    .agent-more-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background var(--duration-fast) var(--ease-smooth);
    }
    .agent-more-btn:active { background: var(--color-bg-sunken); }

    /* ===== FAB ===== */
    .fab-create {
      position: fixed;
      bottom: 90px;
      right: 24px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--gradient-primary);
      box-shadow: var(--shadow-button);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99;
      transition: transform var(--duration-fast) var(--ease-bounce);
    }
    .fab-create:active { transform: scale(0.9); }

    /* ===== Tab Shell Styles ===== */
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 48px;
      text-decoration: none;
      color: var(--color-text-hint, #9E9E9E);
      transition: color var(--duration-fast, 200ms) var(--ease-smooth, cubic-bezier(0.4, 0, 0.2, 1));
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .tab-label {
      font-size: 10px;
      line-height: 1;
      margin-top: 3px;
      font-weight: 400;
      font-family: var(--font-family, 'Roboto', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif);
      transition: font-weight var(--duration-fast, 200ms) var(--ease-smooth, cubic-bezier(0.4, 0, 0.2, 1));
    }
    .tab-icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }
    .tab-item .tab-icon--outline { display: block; }
    .tab-item .tab-icon--filled { display: none; }
    .tab-item.is-active { color: var(--color-primary, #7F7FD5); }
    .tab-item.is-active .tab-label { font-weight: 500; }
    .tab-item.is-active .tab-icon--outline { display: none; }
    .tab-item.is-active .tab-icon--filled { display: block; }
    nav[data-active-tab="home"]    .tab-item[data-tab="home"],
    nav[data-active-tab="messages"] .tab-item[data-tab="messages"],
    nav[data-active-tab="ai"]       .tab-item[data-tab="ai"],
    nav[data-active-tab="profile"] .tab-item[data-tab="profile"] {
      color: var(--color-primary);
      font-weight: 500;
    }
    nav[data-active-tab="home"]    .tab-item[data-tab="home"] .tab-label,
    nav[data-active-tab="messages"] .tab-item[data-tab="messages"] .tab-label,
    nav[data-active-tab="ai"]       .tab-item[data-tab="ai"] .tab-label,
    nav[data-active-tab="profile"] .tab-item[data-tab="profile"] .tab-label {
      font-weight: 500;
    }
    nav[data-active-tab="home"]    .tab-item[data-tab="home"] .tab-icon--outline,
    nav[data-active-tab="messages"] .tab-item[data-tab="messages"] .tab-icon--outline,
    nav[data-active-tab="ai"]       .tab-item[data-tab="ai"] .tab-icon--outline,
    nav[data-active-tab="profile"] .tab-item[data-tab="profile"] .tab-icon--outline {
      display: none;
    }
    nav[data-active-tab="home"]    .tab-item[data-tab="home"] .tab-icon--filled,
    nav[data-active-tab="messages"] .tab-item[data-tab="messages"] .tab-icon--filled,
    nav[data-active-tab="ai"]       .tab-item[data-tab="ai"] .tab-icon--filled,
    nav[data-active-tab="profile"] .tab-item[data-tab="profile"] .tab-icon--filled {
      display: block;
    }
  </style>
</body>
</html>
