/* Moe Social Brand Design System — 萌系梦幻柔和 */
/* Extracted from Flutter project tokens: moe_tokens.dart, moe_theme_extension.dart, ai_brand_tokens.dart */

:root {
  /* ===== Primary Palette — 糖果渐变色系 ===== */
  --color-primary: #7F7FD5;
  --color-primary-light: #9B9FE3;
  --color-primary-lighter: #B7BAF0;
  --color-primary-lightest: #D4D5F6;
  --color-primary-dark: #5F5FBB;
  --color-primary-darker: #3F3FA1;

  --color-secondary: #86A8E7;
  --color-secondary-light: #A0BFEF;
  --color-secondary-lighter: #BBD5F6;
  --color-secondary-darker: #5E88C8;

  --color-tertiary: #91EAE4;
  --color-tertiary-light: #ADF0EC;
  --color-tertiary-lighter: #C8F5F2;
  --color-tertiary-darker: #6DD5CF;

  /* ===== Neutrals ===== */
  --color-bg: #F5F7FA;
  --color-bg-elevated: #FFFFFF;
  --color-bg-sunken: #EEEEF2;

  --color-text-primary: #333333;
  --color-text-secondary: #666666;
  --color-text-hint: #9E9E9E;
  --color-text-disabled: #BDBDBD;

  --color-text-inverse: #FFFFFF;

  /* ===== Semantic Colors ===== */
  --state-success: #00A86B;
  --state-warning: #E6A700;
  --state-error: #E94057;
  --state-info: #2563EB;

  --state-success-bg: #F0FDF4;
  --state-error-bg: #FEF2F2;
  --state-info-bg: #EFF6FF;
  --state-warning-bg: #FFFBEB;

  /* ===== Interaction Colors ===== */
  --color-like: #FF4757;
  --color-online: #00C853;
  --color-offline: #BDBDBD;

  /* ===== Gradients ===== */
  --gradient-primary: linear-gradient(135deg, #7F7FD5 0%, #86A8E7 100%);
  --gradient-hero: linear-gradient(135deg, #7F7FD5 0%, #86A8E7 50%, #91EAE4 100%);
  --gradient-aurora: linear-gradient(135deg, #E0C3FC 0%, #8EC5FC 50%, #91EAE4 100%);
  --gradient-ai-bubble: linear-gradient(135deg, #8A2387 0%, #E94057 100%);

  /* ===== Radius Scale — 圆润萌系 ===== */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-3xl: 28px;
  --radius-full: 9999px;
  --radius-button: 25px;
  --radius-input: 15px;

  /* ===== Shadows — 彩色柔和阴影 ===== */
  --shadow-card: 0 8px 16px rgba(127, 127, 213, 0.08);
  --shadow-card-lg: 0 10px 24px rgba(127, 127, 213, 0.08);
  --shadow-float: 0 20px 40px rgba(127, 127, 213, 0.12);
  --shadow-button: 0 4px 12px rgba(127, 127, 213, 0.4);
  --shadow-bottom-bar: 0 -5px 20px rgba(0, 0, 0, 0.05), 0 4px 12px rgba(127, 127, 213, 0.1);
  --shadow-compact: 0 5px 10px rgba(127, 127, 213, 0.08);

  /* ===== Typography ===== */
  --font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;

  --text-display: 700 28px/1.2 var(--font-family);
  --text-title: 700 22px/1.3 var(--font-family);
  --text-subtitle: 600 18px/1.4 var(--font-family);
  --text-body: 400 15px/1.6 var(--font-family);
  --text-body-sm: 400 14px/1.5 var(--font-family);
  --text-caption: 400 12px/1.35 var(--font-family);
  --text-overline: 500 11px/1.2 var(--font-family);
  --text-mono: 500 13px/1.4 'SF Mono', 'Fira Code', 'Roboto Mono', monospace;

  /* ===== Spacing ===== */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;

  /* ===== Motion ===== */
  --duration-fast: 200ms;
  --duration-normal: 300ms;
  --duration-slow: 500ms;
  --duration-breath: 1200ms;
  --ease-bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
  --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1);

  /* ===== Component specifics ===== */
  --bottom-bar-radius: 32px;
  --bottom-bar-padding: 8px 20px;
  --card-padding: 20px;
  --section-gap: 12px;
  --page-padding: 16px;

  /* ===== Dark mode ===== */
  --dark-bg: #121212;
  --dark-card: #1E1E1E;
  --dark-surface: #2C2C2C;
  --dark-text-primary: #E0E0E0;
  --dark-text-secondary: #AAAAAA;
  --dark-shadow-card: 0 8px 16px rgba(0, 0, 0, 0.3);
}

/* ===== Utility Classes ===== */
.text-gradient-primary {
  background: var(--gradient-hero);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.bg-primary-gradient {
  background: var(--gradient-primary);
}

.bg-hero-gradient {
  background: var(--gradient-hero);
}

.bg-aurora-gradient {
  background: var(--gradient-aurora);
}

.card-moe {
  background: var(--color-bg-elevated);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
}

.btn-moe-primary {
  background: var(--color-primary);
  color: var(--color-text-inverse);
  border-radius: var(--radius-button);
  height: 50px;
  font-weight: 600;
  font-size: 15px;
  box-shadow: var(--shadow-button);
  transition: transform 200ms var(--ease-bounce), box-shadow 200ms var(--ease-smooth);
}

.btn-moe-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(127, 127, 213, 0.5);
}

.input-moe {
  background: #F5F5F5;
  border-radius: var(--radius-input);
  border: 2px solid transparent;
  padding: 16px 20px;
  font-size: 15px;
  transition: border-color 200ms var(--ease-smooth);
}

.input-moe:focus {
  border-color: var(--color-primary);
  outline: none;
}

.bottom-bar-moe {
  background: var(--color-bg-elevated);
  border-radius: var(--bottom-bar-radius);
  box-shadow: var(--shadow-bottom-bar);
  padding: var(--bottom-bar-padding);
}

.fade-in-up {
  animation: fadeInUp var(--duration-normal) var(--ease-smooth) both;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes breathe {
  0%, 100% { transform: scale(0.85); opacity: 0.6; }
  50% { transform: scale(1.0); opacity: 1.0; }
}

@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 8px rgba(127, 127, 213, 0.3); }
  50% { box-shadow: 0 0 20px rgba(127, 127, 213, 0.6); }
}

<script>
(function() {
  const tabBtns = document.querySelectorAll('#internalTabBar .tab-btn');
  const panels = document.querySelectorAll('.tab-panel');
  const indicator = document.getElementById('tabIndicator');
  const tabBar = document.getElementById('internalTabBar');

  function activateTab(btn) {
    // Remove active from all buttons
    tabBtns.forEach(b => b.classList.remove('is-active'));
    // Add active to clicked button
    btn.classList.add('is-active');

    // Move indicator
    const barRect = tabBar.getBoundingClientRect();
    const btnRect = btn.getBoundingClientRect();
    const indicatorX = btnRect.left - barRect.left + btnRect.width / 2 - 16;
    indicator.style.transform = 'translateX(' + indicatorX + 'px)';

    // Show/hide panels
    const tabName = btn.getAttribute('data-tab');
    panels.forEach(p => p.classList.remove('is-active'));
    const targetPanel = document.getElementById('panel-' + tabName);
    if (targetPanel) {
      targetPanel.classList.add('is-active');
    }
  }

  // Click handlers
  tabBtns.forEach(btn => {
    btn.addEventListener('click', function() {
      activateTab(this);
    });
  });

  // Initialize first tab on load
  if (tabBtns.length > 0) {
    activateTab(tabBtns[0]);
  }
})();
</script>

  background: #7F7FD5;
  border-radius: 1px;
  transition: transform 300ms cubic-bezier(0.4, 0, 0.2, 1);
}

/* ===== TAB PANELS ===== */
.tab-panel {
  display: none;
}
.tab-panel.is-active {
  display: block;
}

/* ===== TAB: FEED (Grid) ===== */
.feed-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 3px;
  padding: 0 16px 16px;
}
.feed-cell {
  border-radius: 4px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform 300ms ease;
}
.feed-cell:hover {
  transform: scale(1.03);
}
.feed-cell--tall {
  grid-row: span 2;
  min-height: 200px;
  aspect-ratio: auto;
}
.feed-cell--square {
  aspect-ratio: 1;
}
.feed-cell-bg {
  width: 100%;
  height: 100%;
}
.feed-cell-bg--1 { background: linear-gradient(135deg, #E8E0F0, #D4D5F6); }
.feed-cell-bg--2 { background: linear-gradient(135deg, #D4E7F7, #BBD5F6); }
.feed-cell-bg--3 { background: linear-gradient(135deg, #D0F0ED, #C8F5F2); }
.feed-cell-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 60%);
  display: flex;
  align-items: flex-end;
  justify-content: flex-end;
  padding: 8px;
  opacity: 0;
  transition: opacity 250ms ease;
}
.feed-cell:hover .feed-cell-overlay {
  opacity: 1;
}
.feed-like {
  display: flex;
  align-items: center;
  gap: 4px;
  color: #fff;
  font-size: 12px;
  font-weight: 500;
}
.feed-like svg {
  width: 14px;
  height: 14px;
}
.feed-end {
  text-align: center;
  font-size: 12px;
  color: #BDBDBD;
  padding: 16px 0 8px;
}

/* ===== TAB: FAVORITES ===== */
.favorites-section {
  padding: 16px;
}
.fav-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.fav-title {
  font-size: 16px;
  font-weight: 700;
  color: #333;
}
.fav-view-all {
  font-size: 13px;
  color: #7F7FD5;
  cursor: pointer;
}
.fav-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.fav-card {
  background: #fff;
  border-radius: 16px;
  padding: 14px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
  display: flex;
  align-items: center;
  gap: 12px;
  animation: fadeInUp 400ms ease both;
}
.fav-card:nth-child(1) { animation-delay: 0ms; }
.fav-card:nth-child(2) { animation-delay: 120ms; }
.fav-card:nth-child(3) { animation-delay: 240ms; }
.fav-thumb {
  width: 56px;
  height: 56px;
  border-radius: 10px;
  flex-shrink: 0;
}
.fav-thumb--1 { background: linear-gradient(135deg, #E8E0F0, #D4D5F6); }
.fav-thumb--2 { background: linear-gradient(135deg, #D4E7F7, #BBD5F6); }
.fav-thumb--3 { background: linear-gradient(135deg, #D0F0ED, #C8F5F2); }
.fav-info {
  flex: 1;
  min-width: 0;
}
.fav-info-title {
  font-size: 14px;
  font-weight: 500;
  color: #333;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.fav-info-user {
  font-size: 12px;
  color: #9E9E9E;
  margin-top: 4px;
}
.fav-info-time {
  font-size: 11px;
  color: #BDBDBD;
  margin-top: 2px;
}
.fav-bookmark {
  flex-shrink: 0;
  color: #7F7FD5;
}
.fav-bookmark svg {
  width: 20px;
  height: 20px;
}

/* ===== TAB: MORE ===== */
.more-section {
  margin-bottom: 24px;
}
.more-section-title {
  font-size: 13px;
  font-weight: 600;
  color: #999;
  padding: 16px 16px 8px;
}
.services-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  justify-items: center;
  padding: 0 24px;
}
.service-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.service-item:active {
  transform: scale(0.9);
  transition: transform 150ms ease;
}
.service-circle {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 150ms ease;
}
.service-item:active .service-circle {
  transform: scale(0.9);
}
.service-circle svg {
  width: 22px;
  height: 22px;
  color: #fff;
}
.service-circle--contacts { background: linear-gradient(135deg, #FF6B6B, #FF8E8E); }
.service-circle--community { background: linear-gradient(135deg, #5B8DEF, #7BA8F7); }
.service-circle--games { background: linear-gradient(135deg, #26A69A, #4DB6AC); }
.service-circle--gacha { background: linear-gradient(135deg, #F38181, #F6A0A0); }
.service-circle--gallery { background: linear-gradient(135deg, #86A8E7, #A0BFEF); }
.service-circle--qrcode { background: linear-gradient(135deg, #4ECDC4, #7EDDD6); }
.service-label {
  font-size: 11px;
  color: #666;
  margin-top: 6px;
  text-align: center;
}

.system-card {
  background: #fff;
  border-radius: 20px;
  padding: 4px 0;
  margin: 0 16px;
}
.system-row {
  display: flex;
  align-items: center;
  height: 52px;
  padding: 0 16px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background 150ms ease;
}
.system-row:active {
  background: rgba(0, 0, 0, 0.02);
}
.system-row + .system-row {
  border-top: 1px solid #F0F0F0;
}
.system-icon-wrap {
  width: 30px;
  height: 30px;
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-right: 12px;
}
.system-icon-wrap svg {
  width: 18px;
  height: 18px;
}
.system-icon-wrap--ai { background: rgba(255, 179, 71, 0.1); color: #FFB347; }
.system-icon-wrap--settings { background: rgba(144, 164, 174, 0.1); color: #90A4AE; }
.system-icon-wrap--logout { background: rgba(233, 64, 87, 0.1); color: #E94057; }
.system-row-text {
  flex: 1;
  font-size: 15px;
  color: #333;
}
.system-row-text--logout {
  color: #E94057;
}
.system-chevron {
  color: #BDBDBD;
  flex-shrink: 0;
}
.system-chevron svg {
  width: 20px;
  height: 20px;
}

.bottom-bar-moe {
  background: var(--color-bg-elevated);
  border-radius: var(--bottom-bar-radius);
  box-shadow: var(--shadow-bottom-bar);

  flex-direction: column;

  justify-content: center;

  transition: color var(--duration-fast, 200ms) var(--ease-smooth, cubic-bezier(0.4, 0, 0.2, 1));
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.tab-label {
  font-size: 10px;
  line-height: 1;
  margin-top: 3px;
  font-weight: 400;
  font-family: var(--font-family, 'Roboto', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif);
  transition: font-weight var(--duration-fast, 200ms) var(--ease-smooth, cubic-bezier(0.4, 0, 0.2, 1));
}
.tab-icon {
  width: 24px;
  height: 24px;
  flex-shrink: 0;
}
.tab-item .tab-icon--outline { display: block; }
.tab-item .tab-icon--filled { display: none; }
.tab-item.is-active { color: var(--color-primary, #7F7FD5); }
.tab-item.is-active .tab-label { font-weight: 500; }
