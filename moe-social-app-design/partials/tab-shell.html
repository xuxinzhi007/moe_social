<!-- tab-shell.html — Shared bottom tab bar partial for Moe Social -->
<!-- Include at the bottom of the 4 main tab pages (home, messages, AI tavern, profile) -->
<!-- Set [data-active-tab] to indicate which tab is active: "home" | "messages" | "ai" | "profile" -->

<!-- Bottom safe-area spacer -->
<div style="height: 88px;" aria-hidden="true"></div>

<!-- Floating capsule bottom navigation bar -->
<nav class="bottom-bar-moe" style="position: fixed; bottom: 16px; left: 16px; right: 16px; z-index: 1000; display: flex; align-items: center; justify-content: space-around;" data-active-tab="home" aria-label="Main navigation">

  <!-- 首页 (Home) -->
  <a href="#home" class="tab-item" data-tab="home" aria-label="首页">
    <!-- Outline icon (inactive state) -->
    <svg class="tab-icon tab-icon--outline" data-tab-icon="home" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
      <path d="M12 5.69l5 4.5V18h-2v-6H9v6H7v-7.81l5-4.5M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z" fill="currentColor"/>
    </svg>
    <!-- Filled icon (active state) -->
    <svg class="tab-icon tab-icon--filled" data-tab-icon="home" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" style="display: none;">
      <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" fill="currentColor"/>
    </svg>
    <span class="tab-label">首页</span>
  </a>

  <!-- 消息 (Messages) -->
  <a href="#messages" class="tab-item" data-tab="messages" aria-label="消息">
    <!-- Outline icon (inactive state) -->
    <svg class="tab-icon tab-icon--outline" data-tab-icon="messages" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
      <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z" fill="currentColor"/>
    </svg>
    <!-- Filled icon (active state) -->
    <svg class="tab-icon tab-icon--filled" data-tab-icon="messages" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" style="display: none;">
      <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z" fill="currentColor"/>
    </svg>
    <span class="tab-label">消息</span>
  </a>

  <!-- AI (AI Tavern) -->
  <a href="#ai" class="tab-item" data-tab="ai" aria-label="AI 酒馆">
    <!-- Outline icon (inactive state) -->
    <svg class="tab-icon tab-icon--outline" data-tab-icon="ai" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
      <path d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z" fill="currentColor"/>
    </svg>
    <!-- Filled icon (active state) -->
    <svg class="tab-icon tab-icon--filled" data-tab-icon="ai" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" style="display: none;">
      <path d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z" fill="currentColor"/>
    </svg>
    <span class="tab-label">AI</span>
  </a>

  <!-- 我的 (Profile) -->
  <a href="#profile" class="tab-item" data-tab="profile" aria-label="我的">
    <!-- Outline icon (inactive state) -->
    <svg class="tab-icon tab-icon--outline" data-tab-icon="profile" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
      <path d="M12 5.9c1.16 0 2.1.94 2.1 2.1s-.94 2.1-2.1 2.1S9.9 9.16 9.9 8s.94-2.1 2.1-2.1m0 9c2.97 0 6.1 1.46 6.1 2.1v1.1H5.9V16.9c0-.64 3.13-2.1 6.1-2.1M12 4C9.79 4 8 5.79 8 8s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm0 9c-2.67 0-8 1.34-8 4v3h16v-3c0-2.66-5.33-4-8-4z" fill="currentColor"/>
    </svg>
    <!-- Filled icon (active state) -->
    <svg class="tab-icon tab-icon--filled" data-tab-icon="profile" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" style="display: none;">
      <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="currentColor"/>
    </svg>
    <span class="tab-label">我的</span>
  </a>

</nav>

<style>
  /* ===== Tab Shell Styles ===== */
  /* Requires colors_and_type.css to be loaded for CSS custom properties */

  /* Tab item base */
  .tab-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 48px;
    text-decoration: none;
    color: var(--color-text-hint, #9E9E9E);
    transition: color var(--duration-fast, 200ms) var(--ease-smooth, cubic-bezier(0.4, 0, 0.2, 1));
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  /* Tab label */
  .tab-label {
    font-size: 10px;
    line-height: 1;
    margin-top: 3px;
    font-weight: 400;
    font-family: var(--font-family, 'Roboto', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif);
    transition: font-weight var(--duration-fast, 200ms) var(--ease-smooth, cubic-bezier(0.4, 0, 0.2, 1));
  }

  /* Tab icon base */
  .tab-icon {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
  }

  /* Inactive state (default) */
  .tab-item .tab-icon--outline {
    display: block;
  }
  .tab-item .tab-icon--filled {
    display: none;
  }

  /* Active state */
  .tab-item.is-active {
    color: var(--color-primary, #7F7FD5);
  }
  .tab-item.is-active .tab-label {
    font-weight: 500;
  }
  .tab-item.is-active .tab-icon--outline {
    display: none;
  }
  .tab-item.is-active .tab-icon--filled {
    display: block;
  }

  /* Active tab determined by data attribute on the nav */
  nav[data-active-tab="home"]    .tab-item[data-tab="home"],
  nav[data-active-tab="messages"] .tab-item[data-tab="messages"],
  nav[data-active-tab="ai"]       .tab-item[data-tab="ai"],
  nav[data-active-tab="profile"] .tab-item[data-tab="profile"] {
    color: var(--color-primary, #7F7FD5);
    font-weight: 500;
  }
  nav[data-active-tab="home"]    .tab-item[data-tab="home"] .tab-label,
  nav[data-active-tab="messages"] .tab-item[data-tab="messages"] .tab-label,
  nav[data-active-tab="ai"]       .tab-item[data-tab="ai"] .tab-label,
  nav[data-active-tab="profile"] .tab-item[data-tab="profile"] .tab-label {
    font-weight: 500;
  }
  nav[data-active-tab="home"]    .tab-item[data-tab="home"] .tab-icon--outline,
  nav[data-active-tab="messages"] .tab-item[data-tab="messages"] .tab-icon--outline,
  nav[data-active-tab="ai"]       .tab-item[data-tab="ai"] .tab-icon--outline,
  nav[data-active-tab="profile"] .tab-item[data-tab="profile"] .tab-icon--outline {
    display: none;
  }
  nav[data-active-tab="home"]    .tab-item[data-tab="home"] .tab-icon--filled,
  nav[data-active-tab="messages"] .tab-item[data-tab="messages"] .tab-icon--filled,
  nav[data-active-tab="ai"]       .tab-item[data-tab="ai"] .tab-icon--filled,
  nav[data-active-tab="profile"] .tab-item[data-tab="profile"] .tab-icon--filled {
    display: block;
  }
</style>
