# LAN 静态托管：moe-admin + 反代云 API
# 小主机：/etc/nginx/sites-available/moe-admin
# 静态目录：/var/www/html/ops
# 同步：cd moe-admin && npm run deploy:lan

upstream moe_cloud_api {
    server 47.106.175.49:8888;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html;
    index index.html;

    location = / {
        return 302 /ops/;
    }

    location /ops/ {
        try_files $uri $uri/ /ops/index.html;
    }

    location /api/deploy/admin/ {
        proxy_pass http://moe_cloud_api/api/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host 47.106.175.49;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/admin/ {
        proxy_pass http://moe_cloud_api/api/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host 47.106.175.49;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/images/ {
        proxy_pass http://moe_cloud_api/api/images/;
        proxy_http_version 1.1;
        proxy_set_header Host 47.106.175.49;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://moe_cloud_api/ws;
        proxy_http_version 1.1;
        proxy_set_header Host 47.106.175.49;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
}
