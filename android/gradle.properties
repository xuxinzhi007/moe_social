# Windows 本地开发优先稳定：该项目 Android 插件较多，开启高并发会把系统提交额度打满，
# 导致 Kotlin/Java 编译器 OOM，甚至拖垮 IDE。保留 daemon 以兼容 flutter run。
org.gradle.jvmargs=-Xmx2G -Xss512k -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=320m -XX:HeapBaseMinAddress=4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx1024m -Xss512k -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=256m -XX:HeapBaseMinAddress=4g
android.useAndroidX=true

# 减轻 Windows 上原生子工程 CMake 与 Gradle 文件监听竞态（configure_command.bat 不存在等）
org.gradle.vfs.watch=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
