name: Build and Release APK

on:
  push:
    tags:
      - 'v*' # 仅当推送 v 开头的 tag 时触发，例如 v1.0.0
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag e.g. v1.0.4 or branch main)'
        required: true
        default: 'main'

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - uses: actions/checkout@v4

      # 2. 配置 Java 环境 (Android 构建需要)
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. 配置 Flutter 环境
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9' # 兼容 rive_native 的 SemanticsRole 等新 API
          channel: 'stable'
          cache: true

      # 4. 拉取依赖
      - name: Get Dependencies
        run: flutter pub get

      # 5. 解码签名密钥
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks

      # 6. 构建 APK (Release 模式)
      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ github.event.inputs.ref }}"
            VERSION_NAME="${REF#v}"
          else
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          fi
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          flutter build apk --release --no-tree-shake-icons \
            --build-name "$VERSION_NAME" \
            --build-number "$BUILD_NUMBER"

      # 6. 发布到 GitHub Releases
      - name: Create Release and Upload APK
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/app-release.apk"
          token: ${{ secrets.GITHUB_TOKEN }} # GitHub 自动生成的 Token，无需您手动配置
          name: Release ${{ github.ref_name }}
          body: |
            自动构建发布版本: ${{ github.ref_name }}
            
            更新日志：
            (请在 GitHub Releases 页面手动编辑此部分)
          allowUpdates: true
          replacesArtifacts: true

